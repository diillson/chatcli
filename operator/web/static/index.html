<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="app.title">ChatCLI AIOps Dashboard</title>
<script>
/* Theme and language bootstrap. Runs before the stylesheet so a saved or
   ?theme=/?lang= choice never flashes the system default first. Query
   params win once and are persisted; a blocked localStorage falls back to
   the OS theme and the browser language. */
(function () {
  var root = document.documentElement;
  var params = null;
  try { params = new URLSearchParams(location.search); } catch (e) { params = null; }
  var load = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var store = function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } };
  var theme = params && params.get('theme');
  if (theme === 'system' || theme === 'dark' || theme === 'light') store('chatcli_dash_theme', theme);
  else theme = load('chatcli_dash_theme');
  if (theme === 'dark' || theme === 'light') root.setAttribute('data-theme', theme);
  else root.removeAttribute('data-theme');
  var lang = params && params.get('lang');
  lang = lang ? (/^pt/i.test(lang) ? 'pt-BR' : (/^en/i.test(lang) ? 'en' : null)) : null;
  if (lang) store('chatcli_dash_lang', lang);
  else lang = load('chatcli_dash_lang');
  if (lang !== 'en' && lang !== 'pt-BR') lang = /^pt/i.test(navigator.language || '') ? 'pt-BR' : 'en';
  root.lang = lang;
})();
</script>
<style>
/* Tokens: the same dark terminal the ChatCLI live dashboard draws. A light
   OS theme overrides them below with a set that keeps every text token at
   4.5:1 or better on the panels; the header's theme switcher pins either
   set through data-theme on <html>, so "system" is simply its absence. */
:root {
  --bg:#0B0E14; --panel:#10141C; --panel2:#151B26; --border:#1E2634; --text:#DCE3EB; --strong:#FFFFFF; --muted:#7D8798; --faint:#556070;
  --amber:#FFB454; --cyan:#4FC3E8; --violet:#C79BFF; --green:#7FD962; --red:#E06C75; --orange:#FF8C69;
  --accent:var(--cyan); --brand:var(--amber); --ok:var(--green); --err:var(--red); --warn:var(--amber);
  --on-accent:#0B0E14;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Cascadia Code",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  /* Severity, derived from the palette. Labels always accompany the color. */
  --sev-critical:var(--red); --sev-high:var(--orange); --sev-medium:var(--amber); --sev-low:var(--green);
  /* Legacy names the inline templates still use; they resolve to the palette. */
  --bg-card:var(--panel); --bg-card-hover:var(--panel2); --card-bg:var(--panel);
  --highlight:var(--brand); --success:var(--cyan); --warning:var(--amber);
  --text-muted:var(--muted); --text-dim:var(--faint);
  --radius:6px; --shadow:0 14px 40px rgba(0,0,0,.55);
  --scrim:rgba(4,6,10,.82);
  color-scheme:dark;
}
@media (prefers-color-scheme:light) {
  :root:not([data-theme="dark"]) {
    --bg:#F3F5F8; --panel:#FFFFFF; --panel2:#EDF1F6; --border:#D3DAE4; --text:#1F2733; --strong:#000000; --muted:#5A6575; --faint:#7A8595;
    --amber:#9C5700; --cyan:#0A6E8C; --violet:#7332C7; --green:#2A7430; --red:#BE3140; --orange:#B84A1C;
    --shadow:0 14px 40px rgba(20,30,45,.18);
    --scrim:rgba(235,239,244,.85);
    --on-accent:#FFFFFF;
    color-scheme:light;
  }
}
/* Explicit choice from the header switcher (persisted in localStorage as
   chatcli_dash_theme). Same light set as above; dark is the base set. */
:root[data-theme="light"] {
  --bg:#F3F5F8; --panel:#FFFFFF; --panel2:#EDF1F6; --border:#D3DAE4; --text:#1F2733; --strong:#000000; --muted:#5A6575; --faint:#7A8595;
  --amber:#9C5700; --cyan:#0A6E8C; --violet:#7332C7; --green:#2A7430; --red:#BE3140; --orange:#B84A1C;
  --shadow:0 14px 40px rgba(20,30,45,.18);
  --scrim:rgba(235,239,244,.85);
  --on-accent:#FFFFFF;
  color-scheme:light;
  }
:root[data-theme="dark"] { color-scheme:dark; }
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:12.5px; }
body {
  font:12.5px/1.45 var(--mono);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}
::selection { background:color-mix(in srgb, var(--amber) 25%, transparent); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
button, select, input, textarea { font:inherit; color:inherit; }

/* ===== HEADER: a macOS terminal window's titlebar ===== */
.header {
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:14px;
  padding:8px 14px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}
.lights { display:flex; gap:7px; }
.lights i { width:12px; height:12px; border-radius:50%; display:block; border:1px solid rgba(0,0,0,.25); }
.lights i:nth-child(1) { background:#FF5F57; } .lights i:nth-child(2) { background:#FEBC2E; } .lights i:nth-child(3) { background:#28C840; }
.logo {
  font-size:12px; font-weight:600; margin:0; color:var(--muted); letter-spacing:.02em;
  display:flex; align-items:center; justify-content:center; gap:10px; min-width:0;
}
.logo .title { color:var(--text); white-space:nowrap; }
.logo .sub { color:var(--muted); font-weight:400; white-space:nowrap; }
.refresh-dot { width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none; animation:pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity:1; } 50% { opacity:.3; } }
.tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.refresh-indicator { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }
.sr-label { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.refresh-timer { min-width:32px; text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); font-size:11px; }
.health-badge {
  display:inline-flex; align-items:center; gap:6px;
  padding:2px 9px; border:1px solid var(--border); border-radius:4px;
  font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap;
}
.health-badge::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 6px currentColor; }
.health-ok { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 45%, var(--border)); }
.health-err { color:var(--err); border-color:color-mix(in srgb, var(--err) 45%, var(--border)); }
.time-range-picker { position:relative; }
.time-dropdown {
  position:absolute; top:100%; right:0; margin-top:6px; z-index:100;
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); min-width:240px; padding:8px;
}
.time-presets { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; margin-bottom:8px; }
.time-presets button {
  background:transparent; border:1px solid var(--border); color:var(--muted); padding:3px 6px;
  border-radius:4px; cursor:pointer; font-size:11px;
}
.time-presets button:hover { color:var(--text); border-color:var(--muted); }
.time-custom { border-top:1px solid var(--border); padding-top:8px; }
.time-custom label { display:block; font-size:10px; color:var(--muted); margin-bottom:4px; letter-spacing:.06em; text-transform:uppercase; }
.time-custom input {
  width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
  padding:4px 6px; border-radius:4px; font-size:11px; margin-bottom:4px;
}
.time-custom input:focus { outline:none; border-color:var(--accent); }
.time-custom button {
  width:100%; background:var(--brand); border:1px solid var(--brand); color:var(--on-accent); padding:4px;
  border-radius:4px; cursor:pointer; font-size:11px; font-weight:600; margin-top:4px;
}

/* ===== TABS: the dashboard's segmented control ===== */
.tab-bar {
  display:flex;
  gap:2px;
  padding:3px;
  margin:10px 14px 0;
  width:max-content;
  max-width:calc(100% - 28px);
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow-x:auto;
  scrollbar-width:thin;
}
.tab-btn {
  background:none;
  border:1px solid transparent;
  border-radius:4px;
  color:var(--muted);
  padding:4px 10px;
  font-size:11px;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  cursor:pointer;
  white-space:nowrap;
  transition:color .15s, background .15s;
}
.tab-btn:hover { color:var(--text); }
.tab-btn.active { color:var(--strong); background:var(--panel2); border-color:var(--border); }
.tab-btn .badge {
  margin-left:6px;
  background:var(--brand);
  color:var(--on-accent);
  font-size:10px;
  padding:0 5px;
  border-radius:8px;
  font-weight:700;
}

/* ===== MAIN ===== */
.main { flex:1; padding:10px 14px 14px; max-width:1600px; margin:0 auto; width:100%; min-width:0; }
.page { display:none; }
.page.active { display:block; }

/* ===== KPI TILES: the deck's big mono numbers ===== */
.stats-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));
  gap:8px;
  margin-bottom:10px;
}
.stat-card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:9px 12px 8px;
  min-width:0;
  display:flex;
  flex-direction:column-reverse;
  transition:border-color .2s;
}
.stat-card:hover { border-color:var(--muted); }
/* The "Contained / needs human" tile: violet, like its state badge, so it
   stands apart from the red "active" tile without shouting. */
.stat-card-alert {
  border-color:color-mix(in srgb, var(--violet) 70%, var(--border));
  box-shadow:0 0 0 1px color-mix(in srgb, var(--violet) 25%, transparent), 0 4px 12px color-mix(in srgb, var(--violet) 15%, transparent);
}
.stat-card-alert:hover { border-color:var(--violet); }
.stat-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stat-value { font-size:20px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stat-sub { font-size:10.5px; color:var(--muted); margin-top:3px; }

/* ===== GRID LAYOUTS ===== */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
.grid-3 { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:10px; margin-bottom:10px; }

/* ===== PANEL: a small window ===== */
.panel {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  min-width:0;
}
.panel-header {
  padding:8px 10px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:var(--panel2);
}
.panel-title { font-size:11px; letter-spacing:.06em; color:var(--muted); font-weight:600; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.panel-title::before { content:"$ "; color:var(--brand); }
.panel-body { padding:10px 12px; }
.drag-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
.drag-grid .panel-full { grid-column:1 / -1; }
.drag-grip { color:var(--faint); margin-right:6px; font-size:12px; cursor:grab; user-select:none; }
.drag-grip:active { cursor:grabbing; }
.panel[draggable="true"] .panel-header { cursor:grab; }
.panel[draggable="true"] .panel-header:active { cursor:grabbing; }
.panel.drag-over { border:2px dashed var(--accent); background:color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.panel.dragging { opacity:.3; transform:scale(.98); }

/* ===== TABLE: compact, tabular numerals ===== */
.table-wrap { overflow-x:auto; max-height:70vh; overflow-y:auto; }
.table-wrap table thead { position:sticky; top:0; z-index:2; background:var(--panel); }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th {
  text-align:left;
  padding:6px 8px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--muted);
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
td {
  padding:5px 8px;
  font-size:12px;
  border-bottom:1px solid color-mix(in srgb, var(--border) 60%, transparent);
  vertical-align:top;
}
tr:hover td { background:var(--panel2); }
tr.expandable { cursor:pointer; }
.expand-row td { padding:0; }
.expand-content {
  padding:10px 14px;
  background:color-mix(in srgb, var(--panel2) 70%, var(--panel));
  font-size:12px;
  line-height:1.6;
  border-left:2px solid var(--brand);
}
.expand-content h4 { color:var(--brand); margin:8px 0 3px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
.expand-content h4:first-child { margin-top:0; }
.expand-content p { margin-bottom:4px; }
.expand-content ul { margin-left:1.2rem; margin-bottom:6px; }
.expand-content pre { font:inherit; }

/* ===== BADGES: color plus a label, never color alone ===== */
.badge-sev, .badge-state, .badge-chaos, .badge-needs-human, .resource-kind-badge, .action-type-badge {
  display:inline-block;
  border-radius:4px;
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
  white-space:nowrap;
  vertical-align:middle;
  line-height:1.5;
}
.badge-sev { padding:1px 6px; text-transform:uppercase; border:1px solid transparent; }
.badge-critical { background:color-mix(in srgb, var(--sev-critical) 16%, transparent); color:var(--sev-critical); border-color:color-mix(in srgb, var(--sev-critical) 40%, transparent); }
.badge-high { background:color-mix(in srgb, var(--sev-high) 16%, transparent); color:var(--sev-high); border-color:color-mix(in srgb, var(--sev-high) 40%, transparent); }
.badge-medium { background:color-mix(in srgb, var(--sev-medium) 16%, transparent); color:var(--sev-medium); border-color:color-mix(in srgb, var(--sev-medium) 40%, transparent); }
.badge-low { background:color-mix(in srgb, var(--sev-low) 16%, transparent); color:var(--sev-low); border-color:color-mix(in srgb, var(--sev-low) 40%, transparent); }
.badge-info, .badge-warning, .badge-unknown { background:var(--panel2); color:var(--muted); border-color:var(--border); }
.badge-warning { color:var(--warn); }

.resource-kind-badge { padding:1px 6px; font-weight:600; color:#DCE3EB; }

.action-type-badge {
  padding:1px 5px;
  border-radius:3px;
  font-weight:500;
  background:color-mix(in srgb, var(--accent) 10%, transparent);
  color:var(--accent);
  border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
}

.badge-state { padding:1px 6px; font-weight:600; border:1px solid transparent; }
.state-open, .state-firing, .state-pending, .state-detected, .state-failed, .state-rejected, .state-breached, .state-unreachable {
  background:color-mix(in srgb, var(--err) 14%, transparent); color:var(--err); border-color:color-mix(in srgb, var(--err) 35%, transparent);
}
.state-acknowledged, .state-investigating, .state-inreview, .state-analyzing, .state-remediating, .state-executing, .state-verifying, .state-atrisk, .state-degraded, .state-expired {
  background:color-mix(in srgb, var(--warn) 14%, transparent); color:var(--warn); border-color:color-mix(in srgb, var(--warn) 35%, transparent);
}
.state-resolved, .state-closed, .state-approved, .state-healthy, .state-completed, .state-connected {
  background:color-mix(in srgb, var(--ok) 14%, transparent); color:var(--ok); border-color:color-mix(in srgb, var(--ok) 35%, transparent);
}
.state-snoozed { background:color-mix(in srgb, var(--cyan) 14%, transparent); color:var(--cyan); border-color:color-mix(in srgb, var(--cyan) 35%, transparent); }
.state-unknown, .state-draft { background:var(--panel2); color:var(--muted); border-color:var(--border); }
.state-escalated, .state-rolledback { background:color-mix(in srgb, var(--sev-high) 16%, transparent); color:var(--sev-high); border-color:color-mix(in srgb, var(--sev-high) 40%, transparent); }
/* Contained: violet, neither red (firing) nor green (resolved). It pulses
   because Contained means a human action is owed. */
.state-contained {
  background:color-mix(in srgb, var(--violet) 22%, transparent);
  color:var(--violet);
  border-color:color-mix(in srgb, var(--violet) 50%, transparent);
  animation:contained-pulse 2.2s ease-in-out infinite;
}
@keyframes contained-pulse {
  0%, 100% { box-shadow:0 0 0 0 color-mix(in srgb, var(--violet) 40%, transparent); }
  50%      { box-shadow:0 0 0 5px transparent; }
}
.badge-chaos, .badge-needs-human { padding:1px 6px; margin-left:6px; text-transform:uppercase; }
.badge-chaos { background:color-mix(in srgb, var(--cyan) 14%, transparent); color:var(--cyan); border:1px solid color-mix(in srgb, var(--cyan) 40%, transparent); }
.badge-needs-human { background:color-mix(in srgb, var(--err) 16%, transparent); color:var(--err); border:1px solid color-mix(in srgb, var(--err) 50%, transparent); }

/* ===== PIE CHART (CSS only) ===== */
.pie-container { display:flex; align-items:center; gap:24px; padding:8px 0; }
.pie { width:140px; height:140px; border-radius:50%; position:relative; flex-shrink:0; }
.pie-center {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%, -50%);
  background:var(--panel);
  width:70px; height:70px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}
.pie-center .num { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
.pie-center .lbl { font-size:9px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
.pie-legend { display:flex; flex-direction:column; gap:6px; }
.legend-item { display:flex; align-items:center; gap:8px; font-size:11.5px; }
.legend-dot { width:10px; height:10px; border-radius:2px; flex-shrink:0; }

/* ===== TIMELINE: a tail of the log ===== */
.timeline { position:relative; padding-left:18px; }
.timeline::before { content:''; position:absolute; left:5px; top:0; bottom:0; width:2px; background:var(--border); }
.timeline-item { position:relative; padding-bottom:10px; font-size:12px; }
.timeline-item::before {
  content:'';
  position:absolute;
  left:-18px;
  top:4px;
  width:10px; height:10px;
  border-radius:50%;
  background:var(--panel);
  border:2px solid var(--brand);
}
.timeline-time { font-size:10.5px; color:var(--faint); margin-bottom:2px; font-variant-numeric:tabular-nums; }
.timeline-text { color:var(--text); }
.timeline-type { color:var(--brand); font-weight:600; margin-right:6px; }

/* ===== GAUGE BAR ===== */
.gauge-bar { height:8px; background:var(--panel2); border-radius:4px; overflow:hidden; margin:5px 0; }
.gauge-fill { height:100%; border-radius:4px; transition:width .5s ease; }
.gauge-ok { background:var(--ok); }
.gauge-warn { background:var(--warn); }
.gauge-danger { background:var(--err); }

/* ===== BURN RATES ===== */
.burn-rates { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.burn-chip { padding:2px 7px; border-radius:4px; font-size:10.5px; font-weight:600; background:var(--panel2); border:1px solid var(--border); font-variant-numeric:tabular-nums; }
.burn-ok { color:var(--ok); }
.burn-warn { color:var(--warn); }
.burn-danger { color:var(--err); }

/* ===== BUTTONS ===== */
.btn {
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 9px;
  border:1px solid var(--border);
  border-radius:4px;
  background:transparent;
  color:var(--muted);
  font-size:11px;
  cursor:pointer;
  transition:color .15s, border-color .15s, background .15s;
}
.btn:hover { color:var(--text); border-color:var(--muted); }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.btn-primary { background:var(--brand); border-color:var(--brand); color:var(--on-accent); font-weight:600; }
.btn-primary:hover { color:var(--on-accent); background:color-mix(in srgb, var(--brand) 85%, #FFFFFF); border-color:var(--brand); }
.btn-success { background:color-mix(in srgb, var(--ok) 14%, transparent); border-color:color-mix(in srgb, var(--ok) 50%, var(--border)); color:var(--ok); }
.btn-success:hover { background:color-mix(in srgb, var(--ok) 26%, transparent); border-color:var(--ok); color:var(--ok); }
.btn-danger { background:color-mix(in srgb, var(--err) 14%, transparent); border-color:color-mix(in srgb, var(--err) 50%, var(--border)); color:var(--err); }
.btn-danger:hover { background:color-mix(in srgb, var(--err) 26%, transparent); border-color:var(--err); color:var(--err); }
.btn-group { display:flex; gap:6px; flex-wrap:wrap; }
.btn-icon { padding:3px 7px; }

/* ===== FILTERS ===== */
.filters { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
.filter-select, .filter-input {
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:4px;
  color:var(--text);
  padding:3px 9px;
  font-size:11.5px;
  outline:none;
  max-width:100%;
}
.filter-input::placeholder { color:var(--faint); }
.filter-select:focus, .filter-input:focus { border-color:var(--accent); }
.header .filter-select { padding:2px 7px; font-size:11px; color:var(--muted); background:transparent; }
.header .filter-select:hover { color:var(--text); border-color:var(--muted); }
.switchers { display:flex; align-items:center; gap:6px; }
.panel-filters { padding:8px 12px 0; margin-bottom:0; }

/* ===== INPUT ===== */
.input-group { display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
.input-group label { font-size:10px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
.input-group input, .input-group textarea {
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:4px;
  color:var(--text);
  padding:5px 9px;
  font-size:12px;
  outline:none;
  resize:vertical;
}
.input-group input:focus, .input-group textarea:focus { border-color:var(--accent); }

/* ===== STAR RATING ===== */
.star-rating { display:inline-flex; gap:2px; }
.star { line-height:1; }

/* ===== TOAST ===== */
.toast-container {
  position:fixed;
  top:58px;
  right:14px;
  z-index:1000;
  display:flex;
  flex-direction:column;
  gap:6px;
  max-width:calc(100vw - 28px);
}
.toast {
  padding:8px 12px;
  border-radius:var(--radius);
  font-size:12px;
  box-shadow:var(--shadow);
  animation:slideIn .3s ease;
  max-width:380px;
  background:var(--panel);
  border:1px solid var(--border);
  border-left-width:3px;
  color:var(--text);
}
.toast-success { border-left-color:var(--ok); }
.toast-error { border-left-color:var(--err); }
.toast-info { border-left-color:var(--accent); }
@keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }

/* ===== LOADING ===== */
.spinner {
  width:28px; height:28px;
  border:3px solid var(--border);
  border-top-color:var(--brand);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:20px auto;
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading-overlay {
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
  flex-direction:column;
  gap:8px;
  color:var(--muted);
  font-size:12px;
}

/* ===== ERROR STATE ===== */
.error-state { text-align:center; padding:24px; color:var(--muted); }
.error-state p { margin-bottom:10px; font-size:12px; }

/* ===== CLUSTER CARD ===== */
.cluster-card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:10px 12px;
  min-width:0;
}
.cluster-card-header { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
.cluster-name { font-weight:600; font-size:13px; color:var(--strong); overflow:hidden; text-overflow:ellipsis; }
.cluster-detail { font-size:11.5px; color:var(--muted); margin-bottom:3px; }
.cluster-detail b { color:var(--text); font-weight:500; }

/* ===== APPROVAL CARD ===== */
.approval-card {
  background:var(--panel);
  border:1px solid var(--border);
  border-left:3px solid var(--warn);
  border-radius:var(--radius);
  padding:10px 12px;
  margin-bottom:8px;
}
.approval-header { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
.approval-name { font-weight:600; font-size:13px; color:var(--strong); }
.approval-meta { font-size:11.5px; color:var(--muted); margin-bottom:6px; }
.approval-actions { display:flex; gap:6px; align-items:flex-end; margin-top:8px; flex-wrap:wrap; }

/* ===== LOGIN: the API key window ===== */
.login-overlay {
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:var(--scrim);
  backdrop-filter:blur(3px);
  padding:16px;
}
.login-card {
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); width:100%; max-width:420px; overflow:hidden;
}
.login-ttl { display:flex; align-items:center; gap:8px; padding:7px 10px; background:var(--panel2); border-bottom:1px solid var(--border); }
.login-ttl .lights i { width:9px; height:9px; }
.login-ttl h3 { margin:0; font-size:12px; color:var(--muted); font-weight:600; }
.login-ttl h3 b { color:var(--text); font-weight:600; }
.login-body { padding:22px 20px 20px; text-align:center; }
.login-body h2 { margin-bottom:8px; font-size:15px; color:var(--strong); font-weight:700; }
.login-body p { margin-bottom:16px; color:var(--muted); font-size:12px; }
.login-input {
  width:100%; padding:7px 10px; border-radius:4px; border:1px solid var(--border);
  background:var(--panel2); color:var(--text); font-size:12.5px; margin-bottom:12px; outline:none;
}
.login-input::placeholder { color:var(--faint); }
.login-input:focus { border-color:var(--accent); }
.login-btn { padding:6px 28px; }
.login-err { display:none; color:var(--err); font-size:11.5px; margin-top:10px; }

/* ===== FOOTER: the deck's statusbar ===== */
.footer {
  display:flex; align-items:center; gap:18px; padding:6px 14px; font-size:10.5px; letter-spacing:.04em; color:var(--muted);
  background:color-mix(in srgb, var(--panel) 88%, transparent); border-top:1px solid var(--border); flex-wrap:wrap;
}
.footer .brand { color:var(--brand); font-weight:600; }
.footer .spacer { flex:1; }
.footer b { color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; }

/* ===== RESPONSIVE ===== */
@media (max-width:900px) {
  .grid-2, .drag-grid { grid-template-columns:1fr; }
  .stats-grid { grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); }
  .pie-container { flex-direction:column; align-items:flex-start; }
  .header { grid-template-columns:auto 1fr; }
  .tools { grid-column:1 / 3; justify-content:flex-start; }
}
@media (max-width:600px) {
  .header { padding:8px 12px; gap:10px; }
  .main { padding:8px 12px 12px; }
  .tab-bar { margin:8px 12px 0; max-width:calc(100% - 24px); }
  .tab-btn { padding:4px 8px; }
  .grid-3 { grid-template-columns:1fr; }
  .stats-grid { grid-template-columns:repeat(2, minmax(0, 1fr)); }
  .stat-value { font-size:18px; }
  .filters > .filter-input, .filters > .filter-select { flex:1 1 140px; width:auto !important; }
  .time-dropdown { right:auto; left:0; max-width:calc(100vw - 24px); }
  .toast { max-width:100%; }
  .footer { gap:10px; }
}
@media (prefers-reduced-motion:reduce) {
  .refresh-dot, .state-contained, .toast { animation:none; }
  .gauge-fill, .tab-btn, .btn, .stat-card { transition:none; }
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--muted); }

/* ===== EMPTY STATE ===== */
.empty-state { text-align:center; padding:24px; color:var(--muted); font-size:12px; }
.empty-state::before { content:"$ "; color:var(--brand); }
</style>
</head>
<body>

<!-- HEADER: brand · status · controls -->
<header class="header">
  <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1 class="logo">
    <span class="refresh-dot" id="refreshDot" aria-hidden="true"></span>
    <span class="title">chatcli — aiops</span>
    <span class="health-badge health-ok" id="healthBadge" role="status" aria-live="polite">Healthy</span>
  </h1>
  <div class="tools">
    <div class="time-range-picker" id="timeRangePicker">
      <button class="btn" onclick="toggleTimeDropdown()" title="Time range filter" data-i18n-title="time.filterTitle" aria-haspopup="true">
        <span id="timeRangeLabel" data-i18n="time.all">All time</span> ▾
      </button>
      <div class="time-dropdown" id="timeDropdown" style="display:none">
        <div class="time-presets">
          <button onclick="setTimeRange('1h')" data-i18n="time.last1h">Last 1h</button>
          <button onclick="setTimeRange('6h')" data-i18n="time.last6h">Last 6h</button>
          <button onclick="setTimeRange('24h')" data-i18n="time.last24h">Last 24h</button>
          <button onclick="setTimeRange('7d')" data-i18n="time.last7d">Last 7d</button>
          <button onclick="setTimeRange('30d')" data-i18n="time.last30d">Last 30d</button>
          <button onclick="setTimeRange('all')" data-i18n="time.all">All time</button>
        </div>
        <div class="time-custom">
          <label><span data-i18n="time.from">From</span> <input type="datetime-local" id="timeFrom"></label>
          <label><span data-i18n="time.to">To</span> <input type="datetime-local" id="timeTo"></label>
          <button onclick="applyCustomRange()" data-i18n="time.apply">Apply</button>
        </div>
      </div>
    </div>
    <div class="refresh-indicator">
      <label for="refreshSelect" class="sr-label" data-i18n="refresh.label">Auto-refresh interval</label>
      <select id="refreshSelect" class="filter-select" onchange="changeRefreshInterval()" title="Auto-refresh interval" data-i18n-title="refresh.label">
        <option value="0" data-i18n="refresh.off">Off</option>
        <option value="10">10s</option>
        <option value="30" selected>30s</option>
        <option value="60">1m</option>
        <option value="120">2m</option>
        <option value="300">5m</option>
      </select>
      <span id="refreshTimer" class="refresh-timer">30s</span>
      <button class="btn btn-icon" onclick="manualRefresh()" title="Refresh now" aria-label="Refresh now" data-i18n-title="refresh.now" data-i18n-aria="refresh.now">&#8635;</button>
    </div>
    <div class="switchers">
      <label for="themeSelect" class="sr-label" data-i18n="theme.label">Theme</label>
      <select id="themeSelect" class="filter-select" onchange="changeTheme()" title="Theme" aria-label="Theme" data-i18n-title="theme.label" data-i18n-aria="theme.label">
        <option value="system" data-i18n="theme.system">System</option>
        <option value="dark" data-i18n="theme.dark">Dark</option>
        <option value="light" data-i18n="theme.light">Light</option>
      </select>
      <label for="langSelect" class="sr-label" data-i18n="lang.label">Language</label>
      <select id="langSelect" class="filter-select" onchange="changeLanguage()" title="Language" aria-label="Language" data-i18n-title="lang.label" data-i18n-aria="lang.label">
        <option value="en" lang="en">English</option>
        <option value="pt-BR" lang="pt-BR">Português (BR)</option>
      </select>
    </div>
    <button class="btn btn-icon" id="logoutBtn" style="display:none" onclick="logoutApiKey()" title="Change API key" aria-label="Change API key" data-i18n-title="auth.changeKey" data-i18n-aria="auth.changeKey">&#128274;</button>
  </div>
</header>

<!-- TAB BAR: the dashboard's segmented control -->
<nav class="tab-bar" id="tabBar" role="tablist" aria-label="Dashboard sections" data-i18n-aria="nav.label">
  <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="page-overview" data-tab="overview" data-i18n="tab.overview">Overview</button>
  <button class="tab-btn" role="tab" aria-selected="false" aria-controls="page-incidents" data-tab="incidents" data-i18n="tab.incidents">Incidents</button>
  <button class="tab-btn" role="tab" aria-selected="false" aria-controls="page-slos" data-tab="slos" data-i18n="tab.slos">SLOs</button>
  <button class="tab-btn" role="tab" aria-selected="false" aria-controls="page-approvals" data-tab="approvals"><span data-i18n="tab.approvals">Approvals</span> <span class="badge" id="approvalBadge" style="display:none">0</span></button>
  <button class="tab-btn" role="tab" aria-selected="false" aria-controls="page-aiinsights" data-tab="aiinsights" data-i18n="tab.aiinsights">AI Insights</button>
  <button class="tab-btn" role="tab" aria-selected="false" aria-controls="page-remediations" data-tab="remediations" data-i18n="tab.remediations">Remediations</button>
  <button class="tab-btn" role="tab" aria-selected="false" aria-controls="page-runbooks" data-tab="runbooks" data-i18n="tab.runbooks">Runbooks</button>
  <button class="tab-btn" role="tab" aria-selected="false" aria-controls="page-postmortems" data-tab="postmortems" data-i18n="tab.postmortems">PostMortems</button>
  <button class="tab-btn" role="tab" aria-selected="false" aria-controls="page-clusters" data-tab="clusters" data-i18n="tab.clusters">Clusters</button>

</nav>

<!-- MAIN CONTENT -->
<main class="main">

  <!-- OVERVIEW PAGE -->

  <!-- INCIDENTS PAGE -->

        <option value="Remediating" data-i18n="state.Remediating">Remediating</option>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title" data-i18n="section.incidents">Incidents</span>
        <span class="refresh-indicator" style="font-size:0.75rem; color: var(--text-muted);" id="incidentCount"></span>
      </div>

  <!-- SLOS PAGE -->

  <!-- APPROVALS PAGE -->
  <div class="page" id="page-approvals" role="tabpanel">
    <div class="filters">
      <select class="filter-select" id="approvalStateFilter" aria-label="State" data-i18n-aria="filter.state">

        <option value="Pending" selected data-i18n="state.Pending">Pending</option>
        <option value="Approved" data-i18n="state.Approved">Approved</option>

      </select>
      <button class="btn btn-primary" onclick="loadApprovals()" data-i18n="filter.apply">Apply</button>

    <div id="approvalsList"></div>
  </div>

  <!-- AI INSIGHTS PAGE -->
  <div class="page" id="page-aiinsights" role="tabpanel">
    <div class="filters">
      <input class="filter-input" id="insightIssueFilter" placeholder="Filter by incident..." aria-label="Incident" data-i18n-placeholder="filter.byIncident" data-i18n-aria="col.incident" style="width:200px">
      <button class="btn btn-primary" onclick="loadAIInsights()" data-i18n="filter.apply">Apply</button>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title" data-i18n="section.aiInsights">AI Insights</span>

      </div>
      <div class="panel-body table-wrap" id="insightsTableBody"></div>

  <!-- REMEDIATIONS PAGE -->
  <div class="page" id="page-remediations" role="tabpanel">
    <div class="filters">

<script>
// ============================================================
// ChatCLI AIOps Dashboard - Pure Vanilla JS
// ============================================================

const API = '/api/v1';
let apiKey = localStorage.getItem('chatcli_api_key') || '';
let currentTab = 'overview';
let refreshInterval = null;
let refreshCountdown = 30;
let refreshSeconds = 30; // 0 = off
let expandedRows = new Set();

// ===== I18N + THEME =====
// The catalog is the JSON block above; the head bootstrap already resolved
// the language onto <html lang> and the theme onto <html data-theme>.
const I18N = JSON.parse(document.getElementById('i18n-catalog').textContent);
const LANGS = Object.keys(I18N);
const THEMES = ['system', 'dark', 'light'];
let lang = LANGS.includes(document.documentElement.lang) ? document.documentElement.lang : 'en';

// Enum values the API sends (severity "critical", state "Contained", ...)
// keep their raw value in classes and data-* attributes; only the label is
// looked up, case-insensitively, under the matching catalog prefix.
const enumKeys = {};
Object.keys(I18N.en).forEach(key => {
  const dot = key.indexOf('.');
  if (dot < 0) return;
  const prefix = key.slice(0, dot);
  (enumKeys[prefix] = enumKeys[prefix] || {})[key.slice(dot + 1).toLowerCase()] = key;
});

function t(key, vars) {
  const table = I18N[lang] || {};
  let s = table[key] ?? I18N.en[key] ?? key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, name) => (name in vars ? String(vars[name]) : m));
  return s;
}

function enumLabel(prefix, raw, fallbackKey) {
  if (raw === undefined || raw === null || raw === '') return fallbackKey ? t(fallbackKey) : '';
  const key = (enumKeys[prefix] || {})[String(raw).toLowerCase()];
  return key ? t(key) : String(raw);
}

function applyTranslations(root = document) {
  document.documentElement.lang = lang;
  root.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  root.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  root.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  root.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  root.querySelectorAll('[data-i18n-label]').forEach(el => { el.label = t(el.dataset.i18nLabel); });
}

function setLanguage(next, rerender) {
  if (!LANGS.includes(next)) next = 'en';
  lang = next;
  try { localStorage.setItem('chatcli_dash_lang', next); } catch { /* private mode */ }
  const sel = document.getElementById('langSelect');
  if (sel) sel.value = next;
  applyTranslations();
  renderTimeRangeLabel();
  if (rerender) loadCurrentTab();
}

function changeLanguage() { setLanguage($('#langSelect').value, true); }

function applyTheme(theme) {
  const root = document.documentElement;
  if (theme === 'dark' || theme === 'light') root.setAttribute('data-theme', theme);
  else root.removeAttribute('data-theme');
}

function setTheme(next) {
  if (!THEMES.includes(next)) next = 'system';
  try { localStorage.setItem('chatcli_dash_theme', next); } catch { /* private mode */ }
  applyTheme(next);
  const sel = document.getElementById('themeSelect');
  if (sel) sel.value = next;
}

function changeTheme() { setTheme($('#themeSelect').value); }

function storedTheme() {
  let v = null;
  try { v = localStorage.getItem('chatcli_dash_theme'); } catch { v = null; }
  return THEMES.includes(v) ? v : 'system';
}

// Dates and numbers follow the active language, not the OS locale.
const fmtCache = {};
function formatter(kind, opts) {
  const key = lang + '|' + kind + '|' + JSON.stringify(opts);
  if (!fmtCache[key]) fmtCache[key] = kind === 'num' ? new Intl.NumberFormat(lang, opts) : new Intl.DateTimeFormat(lang, opts);
  return fmtCache[key];
}
function fmtDateTime(value) {
  const d = value instanceof Date ? value : new Date(value);
  if (isNaN(d)) return '-';
  return formatter('dt', { year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' }).format(d);
}
function fmtDate(value) {
  const d = value instanceof Date ? value : new Date(value);
  if (isNaN(d)) return '-';
  return formatter('d', { year: 'numeric', month: 'numeric', day: 'numeric' }).format(d);
}
function fmtNum(value, digits = 0) {
  const n = Number(value);
  if (value === null || value === undefined || isNaN(n)) return '-';
  return formatter('num', { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(n);
}

// Drag-and-drop panel reordering
let draggedPanel = null;

function initDragPanels(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;

  // Restore saved order
  const savedOrder = localStorage.getItem('panelOrder_' + containerId);
  if (savedOrder) {
    try {
      const order = JSON.parse(savedOrder);
      const panels = Array.from(container.querySelectorAll('.panel[data-panel-id]'));
      const panelMap = {};
      panels.forEach(p => { panelMap[p.dataset.panelId] = p; });
      order.forEach(id => {
        const p = panelMap[id];
        if (p) container.appendChild(p);
      });
    } catch {}
  }

  container.addEventListener('dragstart', e => {
    const panel = e.target.closest('.panel[draggable]');
    if (!panel) return;
    draggedPanel = panel;
    panel.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', panel.dataset.panelId);
  });

  container.addEventListener('dragend', e => {
    const panel = e.target.closest('.panel[draggable]');
    if (panel) panel.classList.remove('dragging');
    container.querySelectorAll('.panel').forEach(p => p.classList.remove('drag-over'));
    draggedPanel = null;
  });

  container.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const target = e.target.closest('.panel[draggable]');
    if (!target || target === draggedPanel) return;
    container.querySelectorAll('.panel').forEach(p => p.classList.remove('drag-over'));
    target.classList.add('drag-over');
  });

  container.addEventListener('dragleave', e => {
    const target = e.target.closest('.panel[draggable]');
    if (target) target.classList.remove('drag-over');
  });

  container.addEventListener('drop', e => {
    e.preventDefault();
    const target = e.target.closest('.panel[draggable]');
    if (!target || !draggedPanel || target === draggedPanel) return;
    target.classList.remove('drag-over');

    // Determine insertion position
    const panels = Array.from(container.querySelectorAll('.panel[data-panel-id]'));
    const dragIdx = panels.indexOf(draggedPanel);
    const dropIdx = panels.indexOf(target);

    if (dragIdx < dropIdx) {
      target.after(draggedPanel);
    } else {
      target.before(draggedPanel);
    }

    // Save order to localStorage
    const newOrder = Array.from(container.querySelectorAll('.panel[data-panel-id]'))
      .map(p => p.dataset.panelId);
    localStorage.setItem('panelOrder_' + containerId, JSON.stringify(newOrder));
  });
}

async function apiFetch(path, opts = {}) {
  try {
    const headers = { 'Content-Type': 'application/json', ...opts.headers };
    if (apiKey) headers['X-API-Key'] = apiKey;
    const res = await fetch(API + path, { ...opts, headers });
    if (res.status === 401) {
      apiKey = '';
      localStorage.removeItem('chatcli_api_key');
      updateLogoutBtn();
      promptApiKey();
      throw new Error(t('error.authRequired'));
    }
    if (!res.ok) {
      const err = await res.json().catch(() => ({ message: res.statusText }));
      throw new Error(err.message || res.statusText);
    }
    return res.json();
  } catch (e) {
    console.error(`API error ${path}:`, e);
    throw e;
  }
}

async function apiPost(path, body) {
  return apiFetch(path, { method: 'POST', body: JSON.stringify(body) });
}

// Sortable table columns — click header to sort ascending, click again for descending
function sortTableByCol(tableEl, colIdx, asc) {
  const tbody = tableEl.querySelector('tbody');
  if (!tbody) return;
  const rows = Array.from(tbody.querySelectorAll('tr:not(.expand-row)'));
  rows.sort((a, b) => {
    const aSortVal = a.cells[colIdx]?.dataset.sortValue;
    const bSortVal = b.cells[colIdx]?.dataset.sortValue;
    if (aSortVal !== undefined && bSortVal !== undefined) {
      const an = parseFloat(aSortVal), bn = parseFloat(bSortVal);
      if (!isNaN(an) && !isNaN(bn)) return asc ? an - bn : bn - an;
      return asc ? aSortVal.localeCompare(bSortVal) : bSortVal.localeCompare(aSortVal);
    }
    const av = (a.cells[colIdx]?.textContent || '').trim().toLowerCase();
    const bv = (b.cells[colIdx]?.textContent || '').trim().toLowerCase();
    const an = parseFloat(av), bn = parseFloat(bv);
    if (!isNaN(an) && !isNaN(bn)) return asc ? an - bn : bn - an;
    const timeToSecs = s => {
      const m = s.match(/^(?:há )?(\d+)(s|m|h|d)(?: ago)?$/);
      if (!m) return NaN;
      const v = parseInt(m[1]);
      switch(m[2]) { case 's': return v; case 'm': return v*60; case 'h': return v*3600; case 'd': return v*86400; }
      return NaN;
    };
    const at = timeToSecs(av), bt = timeToSecs(bv);
    if (!isNaN(at) && !isNaN(bt)) return asc ? at - bt : bt - at;
    return asc ? av.localeCompare(bv) : bv.localeCompare(av);
  });
  rows.forEach(r => {
    tbody.appendChild(r);
    const expandRow = tbody.querySelector(`.expand-row[data-parent="${r.dataset.rowId}"]`);
    if (expandRow) tbody.appendChild(expandRow);
  });
  const headers = tableEl.querySelectorAll('thead th');
  headers.forEach(h => h.textContent = h.textContent.replace(/ [▲▼]$/, ''));
  if (headers[colIdx]) headers[colIdx].textContent += asc ? ' ▲' : ' ▼';
}

function makeSortable(tableEl, defaultSortCol) {
  if (!tableEl) return;
  const headers = tableEl.querySelectorAll('thead th');

  // Find timestamp column as default sort if not specified. Templates mark
  // it with data-time so the pick does not depend on the header's language.
  if (defaultSortCol === undefined) {
    headers.forEach((th, i) => {
      const txt = th.textContent.toLowerCase();
      if (th.dataset.time !== undefined || txt.includes('created') || txt.includes('age') || txt.includes('timestamp') || txt.includes('time')) {
        defaultSortCol = i;
      }
    });
  }

  headers.forEach((th, colIdx) => {
    if (!th.textContent.trim()) return;
    th.style.cursor = 'pointer';
    th.style.userSelect = 'none';
    th.title = t('table.sortHint');
    th.addEventListener('click', () => {
      const saved = sortState[currentTab];
      const asc = (saved && saved.colIdx === colIdx) ? !saved.asc : (colIdx === defaultSortCol ? false : true);
      sortState[currentTab] = { colIdx, asc };
      sortTableByCol(tableEl, colIdx, asc);
    });
  });

  // Restore saved sort or apply default (timestamp DESC = newest first)
  const saved = sortState[currentTab];
  if (saved !== undefined) {
    sortTableByCol(tableEl, saved.colIdx, saved.asc);
  } else if (defaultSortCol !== undefined) {
    sortState[currentTab] = { colIdx: defaultSortCol, asc: false };
    sortTableByCol(tableEl, defaultSortCol, false);
  }
}

let globalTimeRange = { from: null, to: null, label: 'All time', labelKey: 'time.all' };

function renderTimeRangeLabel() {

function setTimeRange(preset) {
  const now = new Date();
  let from = null;
  let labelKey = 'time.all';

  switch (preset) {
    case '1h':  from = new Date(now - 3600000); labelKey = 'time.last1h'; break;
    case '6h':  from = new Date(now - 21600000); labelKey = 'time.last6h'; break;
    case '24h': from = new Date(now - 86400000); labelKey = 'time.last24h'; break;
    case '7d':  from = new Date(now - 604800000); labelKey = 'time.last7d'; break;
    case '30d': from = new Date(now - 2592000000); labelKey = 'time.last30d'; break;
    case 'all': from = null; labelKey = 'time.all'; break;
  }

  globalTimeRange = { from, to: preset === 'all' ? null : now, label: t(labelKey), labelKey };
  renderTimeRangeLabel();
  $('#timeDropdown').style.display = 'none';
  refreshCurrentTab();
}

function applyCustomRange() {
  const fromInput = $('#timeFrom').value;
  const toInput = $('#timeTo').value;
  if (!fromInput) return;

  const from = new Date(fromInput);
  const to = toInput ? new Date(toInput) : new Date();

  globalTimeRange = { from, to, label: '', labelKey: null };
  renderTimeRangeLabel();
  $('#timeDropdown').style.display = 'none';
  refreshCurrentTab();
}

function getTimeRangeQuery() {
  let q = '';
  if (globalTimeRange.from) {
    q += '&from=' + encodeURIComponent(globalTimeRange.from.toISOString());
  }
  if (globalTimeRange.to) {
    q += '&to=' + encodeURIComponent(globalTimeRange.to.toISOString());
  }
  return q;
}

function escapeHtml(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML.replace(/'/g, '&#39;');
}

function timeAgo(dateStr) {
  if (!dateStr) return '-';
  const now = Date.now();
  const t = new Date(dateStr).getTime();
  const diff = Math.max(0, now - t);
  const secs = Math.floor(diff / 1000);
  if (secs < 60) return t('time.ago.s', { n: secs });
  const mins = Math.floor(secs / 60);
  if (mins < 60) return t('time.ago.m', { n: mins });
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return t('time.ago.h', { n: hrs });
  const days = Math.floor(hrs / 24);
  return t('time.ago.d', { n: days });
}

function formatDuration(val) {
  if (!val) return '-';
  if (typeof val === 'string') return val;
  if (typeof val === 'number') {
    if (val < 60) return Math.round(val) + 's';
    if (val < 3600) return Math.round(val / 60) + 'm';
    return fmtNum(val / 3600, 1) + 'h';
  }
  return String(val);
}

async function loadSeverityPie() {
  const el = $('#severityPie');
  try {
    const data = await apiFetch('/incidents?pageSize=100' + getTimeRangeQuery());
    const items = data.items || [];
    const counts = { critical: 0, high: 0, medium: 0, low: 0 };
    items.forEach(i => {
      const s = (i.severity || '').toLowerCase();
      if (counts.hasOwnProperty(s)) counts[s]++;
    });
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    if (total === 0) {
      showEmpty(el, t('pie.empty'));
      return;
    }
    const colors = { critical: 'var(--sev-critical)', high: 'var(--sev-high)', medium: 'var(--sev-medium)', low: 'var(--sev-low)' };
    let gradParts = [];
    let deg = 0;
    for (const [sev, count] of Object.entries(counts)) {
      if (count === 0) continue;
      const pct = (count / total) * 360;
      gradParts.push(`${colors[sev]} ${deg}deg ${deg + pct}deg`);
      deg += pct;
    }
    el.innerHTML = `
      <div class="pie-container">
        <div class="pie" style="background: conic-gradient(${gradParts.join(', ')})">
          <div class="pie-center"><span class="num">${total}</span><span class="lbl">${t('common.total')}</span></div>
        </div>
        <div class="pie-legend">
          ${Object.entries(counts).map(([s, c]) => `
            <div class="legend-item">
              <div class="legend-dot" style="background:${colors[s]}"></div>
              <span>${escapeHtml(enumLabel('severity', s))}: ${c}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } catch (e) {
    showError(el, t('error.severity'), 'loadSeverityPie()');
  }
}

      ${res('🔧', t('resources.remediations'), s.totalRemediations ?? 0, 'var(--success)')}
      ${res('📝', t('resources.postmortems'), s.totalPostMortems ?? 0, 'var(--sev-medium)')}
      ${res('📚', t('resources.runbooks'), s.totalRunbooks ?? 0, 'var(--accent)')}
      ${res('🎯', t('resources.slos'), s.totalSLOs ?? 0, s.slosAtRisk > 0 ? 'var(--sev-high)' : 'var(--sev-low)')}
      ${res('⏳', t('resources.pendingApprovals'), s.pendingApprovals ?? 0, s.pendingApprovals > 0 ? 'var(--sev-medium)' : 'var(--text-muted)')}

  } catch (e) {
    showError(el, t('error.platformResources'), 'loadPlatformResources()');
  }
}

async function loadMttdMttrTrend() {
  const el = $('#mttdMttrTrend');
  if (!el) return;
  try {
    const [mttdData, mttrData] = await Promise.all([
      apiFetch('/analytics/mttd?' + getTimeRangeQuery()),
      apiFetch('/analytics/mttr?' + getTimeRangeQuery()),
    ]);
    const mttd = (mttdData.items || mttdData.spec || []);
    const mttr = (mttrData.items || mttrData.spec || []);

    if ((!mttd.length && !mttr.length)) {
      showEmpty(el, t('mttd.empty'));
      return;
    }

    const formatDuration = (secs) => {
      if (secs === 0) return '< 1s';
      if (secs < 60) return Math.round(secs) + 's';
      if (secs < 3600) return fmtNum(secs / 60, 1) + 'm';
      return fmtNum(secs / 3600, 1) + 'h';
    };

    // Show latest values as stats + recent trend as mini bars
    const latestMttdEntry = mttd.length > 0 ? mttd[mttd.length - 1] : null;
    const latestMttrEntry = mttr.length > 0 ? mttr[mttr.length - 1] : null;
    const latestMttd = latestMttdEntry ? latestMttdEntry.value : null;
    const latestMttr = latestMttrEntry ? latestMttrEntry.value : null;
    const mttdSamples = latestMttdEntry ? latestMttdEntry.count : 0;
    const mttrSamples = latestMttrEntry ? latestMttrEntry.count : 0;

    const maxMttr = Math.max(...mttr.map(m => m.value), 1);
    const trendBars = mttr.slice(-10).map(m =>
      `<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;" title="${escapeHtml(t('mttd.barTitle', { date: m.date, value: formatDuration(m.value), n: m.count }))}">
        <div style="width:100%; background:var(--accent); border-radius:2px; height:${Math.max(4, (m.value / maxMttr) * 40)}px;"></div>
        <span style="font-size:0.5rem; color:var(--text-muted)">${m.date?.slice(5) || ''}</span>
      </div>`
    ).join('');

    el.innerHTML = `
      <div style="display:flex; gap:2rem; margin-bottom:1rem;">
        <div style="text-align:center; flex:1;">
          <div style="font-size:1.4rem; font-weight:700; color:var(--success)">${latestMttd !== null ? formatDuration(latestMttd) : '-'}</div>
          <div style="font-size:0.7rem; color:var(--text-muted)">${t('mttd.detect')}</div>
          <div style="font-size:0.6rem; color:var(--text-dim)">${t('mttd.samples', { n: mttdSamples })}</div>
        </div>
        <div style="text-align:center; flex:1;">
          <div style="font-size:1.4rem; font-weight:700; color:var(--accent)">${latestMttr !== null ? formatDuration(latestMttr) : '-'}</div>
          <div style="font-size:0.7rem; color:var(--text-muted)">${t('mttd.resolve')}</div>
          <div style="font-size:0.6rem; color:var(--text-dim)">${t('mttd.samples', { n: mttrSamples })}</div>
        </div>
      </div>
      ${trendBars ? `<div style="display:flex; gap:2px; align-items:flex-end; height:50px;">${trendBars}</div>
      <div style="font-size:0.6rem; color:var(--text-muted); text-align:center; margin-top:4px;">${t('mttd.trend')}</div>` : ''}
    `;
  } catch (e) {
    showError(el, t('error.mttd'), 'loadMttdMttrTrend()');
  }
}

// The Recent Incidents panel filters client-side over the page it already
// fetched: same controls as the Incidents tab, ids prefixed "recent", the
// selection persisted as chatcli_dash_recentFilters and re-applied on every
// render, including the auto-refresh ones.
const RECENT_FILTERS_KEY = 'chatcli_dash_recentFilters';
const recentFilterIds = {
  severity: 'recentSeverityFilter',
  state: 'recentStateFilter',
  kind: 'recentKindFilter',
  chaos: 'recentChaosFilter',
  namespace: 'recentNamespaceFilter',
};
let recentIncidentItems = [];

function readRecentFilters() {
  const f = {};
  for (const [name, id] of Object.entries(recentFilterIds)) {
    const el = document.getElementById(id);
    f[name] = el ? el.value : '';
  }
  return f;
}

function saveRecentFilters() {
  try { localStorage.setItem(RECENT_FILTERS_KEY, JSON.stringify(readRecentFilters())); } catch { /* private mode */ }
}

function restoreRecentFilters() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(RECENT_FILTERS_KEY) || 'null'); } catch { saved = null; }
  if (!saved || typeof saved !== 'object') return;
  for (const [name, id] of Object.entries(recentFilterIds)) {
    const el = document.getElementById(id);
    if (!el || typeof saved[name] !== 'string') continue;
    el.value = saved[name];
    // A select ignores a value it has no option for; fall back to "all".
    if (el.tagName === 'SELECT' && el.value !== saved[name]) el.value = '';
  }
}

function filterRecentIncidents(items, f) {
  const ns = (f.namespace || '').trim().toLowerCase();
  return items.filter(i => {
    if (f.severity && (i.severity || '').toLowerCase() !== f.severity) return false;
    if (f.state && i.state !== f.state) return false;
    if (f.kind && (i.resource || {}).kind !== f.kind) return false;
    if (f.chaos === 'exclude' && i.chaosInduced) return false;
    if (f.chaos === 'only' && !i.chaosInduced) return false;
    if (ns && !(i.namespace || '').toLowerCase().includes(ns)) return false;
    return true;
  });
}

function renderRecentIncidents() {
  const el = $('#recentIncidentsTable');
  if (!el) return;
  if (recentIncidentItems.length === 0) { showEmpty(el, t('recent.empty')); return; }
  const items = filterRecentIncidents(recentIncidentItems, readRecentFilters());
  if (items.length === 0) { showEmpty(el, t('recent.emptyFilter')); return; }
  el.innerHTML = `
    <table>
      <thead><tr>
        <th>${t('col.name')}</th><th>${t('col.severity')}</th><th>${t('col.state')}</th><th>${t('col.resource')}</th><th>${t('col.namespace')}</th><th data-time>${t('col.age')}</th>
      </tr></thead>
      <tbody>
        ${items.map(i => `<tr>
          <td>${escapeHtml(i.name)}</td>
          <td>${severityBadge(i.severity)}</td>
          <td>${stateBadge(i.state)}</td>
          <td>${resourceKindBadge((i.resource || {}).kind)} ${escapeHtml((i.resource || {}).name)}</td>
          <td>${escapeHtml(i.namespace)}</td>
          <td data-sort-value="${new Date(i.creationTimestamp || 0).getTime()}">${timeAgo(i.creationTimestamp)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
}

function initRecentFilters() {
  const bar = document.getElementById('recentFilters');
  if (!bar) return;
  restoreRecentFilters();
  const rerender = () => { saveRecentFilters(); renderRecentIncidents(); };
  bar.addEventListener('change', e => { if (e.target.closest('select, input')) rerender(); });
  bar.addEventListener('input', e => { if (e.target.id === recentFilterIds.namespace) rerender(); });
  document.getElementById('recentFiltersReset').addEventListener('click', () => {
    Object.values(recentFilterIds).forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    rerender();
  });
  // The panel stays draggable from its header; while the pointer is over the
  // controls the drag is off so selecting text in the input does not lift
  // the whole panel.
  const panel = bar.closest('.panel[draggable]');
  if (panel) {
    bar.addEventListener('pointerenter', () => panel.setAttribute('draggable', 'false'));
    bar.addEventListener('pointerleave', () => panel.setAttribute('draggable', 'true'));
  }
}

async function loadRecentIncidents() {

// ===== INCIDENTS PAGE =====

async function loadIncidents() {
  const el = $('#incidentsTableBody');
  showLoading(el);
  const sev = $('#incSeverityFilter').value;
  const state = $('#incStateFilter').value;
  const kindFilter = $('#incKindFilter').value;
  const ns = $('#incNamespaceFilter').value;
  let q = '?pageSize=100';
  if (sev) q += '&severity=' + encodeURIComponent(sev);
  if (state) q += '&state=' + encodeURIComponent(state);
  if (ns) q += '&namespace=' + encodeURIComponent(ns);
  try {
    const data = await apiFetch('/incidents' + q + getTimeRangeQuery());
    let items = (data.items || []).sort((a, b) => (b.creationTimestamp || '').localeCompare(a.creationTimestamp || ''));
    // Client-side filter by resource kind
    if (kindFilter) {
      items = items.filter(i => (i.resource || {}).kind === kindFilter);
    }
    // GAP-04 fix: filter chaos drills client-side (default: hide them so
    // production dashboards stay free of drill noise; toggleable in the
    // chaos filter dropdown).
    const chaosFilter = ($('#incChaosFilter') || {}).value || 'exclude';
    if (chaosFilter === 'exclude') {
      items = items.filter(i => !i.chaosInduced);
    } else if (chaosFilter === 'only') {
      items = items.filter(i => i.chaosInduced);
    }
    const total = items.length;
    $('#incidentCount').textContent = t('incidents.count', { n: total });
    if (items.length === 0) { showEmpty(el, t('incidents.emptyFilter')); return; }
    el.innerHTML = `<table>
      <thead><tr>
        <th></th><th>${t('col.name')}</th><th>${t('col.severity')}</th><th>${t('col.state')}</th><th>${t('col.resource')}</th><th>${t('col.namespace')}</th><th>${t('col.risk')}</th><th data-time>${t('col.age')}</th><th>${t('col.actions')}</th>
      </tr></thead>
      <tbody id="incidentsTbody"></tbody>
    </table>`;
    const tbody = $('#incidentsTbody');
    items.forEach((item, idx) => {
      const id = 'inc-' + idx;
      const isExpanded = expandedRows.has(id);
      const mainRow = document.createElement('tr');
      mainRow.className = 'expandable';
      mainRow.dataset.rowId = id;
      const chaosBadge = item.chaosInduced
        ? `<span class="badge-chaos" title="${escapeHtml(t('badge.chaosTitle', { experiment: item.chaosExperiment || t('badge.chaosDefault') }))}">${t('badge.chaos')}</span>`
        : '';
      const humanBadge = item.requiresHumanAction
        ? `<span class="badge-needs-human" title="${escapeHtml(t('badge.needsHumanTitle'))}">${t('badge.needsHuman')}</span>`
        : '';
      mainRow.innerHTML = `
        <td style="width:20px; cursor:pointer; color:var(--text-muted)">${isExpanded ? '&#9660;' : '&#9654;'}</td>
        <td>${escapeHtml(item.name)}${chaosBadge}${humanBadge}</td>
        <td>${severityBadge(item.severity)}</td>
        <td>${stateBadge(item.state)}</td>
        <td>${resourceKindBadge((item.resource||{}).kind)} ${escapeHtml((item.resource||{}).name)}</td>
        <td>${escapeHtml(item.namespace)}</td>
        <td data-sort-value="${item.riskScore || 0}">${item.riskScore != null ? fmtNum(item.riskScore, 1) : '-'}</td>
        <td data-sort-value="${new Date(item.creationTimestamp || 0).getTime()}">${timeAgo(item.creationTimestamp)}</td>
        <td class="btn-group">
          ${item.state !== 'Resolved' && item.state !== 'Contained' ? `<button class="btn btn-success" onclick="event.stopPropagation(); ackIncident('${escapeHtml(item.name)}', '${escapeHtml(item.namespace)}')">${t('action.ack')}</button>` : ''}
          ${item.state !== 'Resolved' && item.state !== 'Contained' ? `<button class="btn" onclick="event.stopPropagation(); snoozeIncident('${escapeHtml(item.name)}', '${escapeHtml(item.namespace)}')">${t('action.snooze')}</button>` : ''}
          ${(item.state === 'Escalated' || item.state === 'Contained') ? `<button class="btn" style="background:var(--sev-low);color:#000;font-weight:700" onclick="event.stopPropagation(); resolveIncident('${escapeHtml(item.name)}', '${escapeHtml(item.namespace)}')">${t('action.resolve')}</button>` : ''}
        </td>
      `;
      mainRow.addEventListener('click', () => toggleIncidentExpand(id, item, mainRow));
      tbody.appendChild(mainRow);
      if (isExpanded) {
        const expandRow = buildIncidentExpandRow(item);
        tbody.appendChild(expandRow);
      }
    });
    makeSortable(el.querySelector('table'));
  } catch (e) {
    showError(el, t('error.incidents', { msg: e.message }), 'loadIncidents()');
  }
}

function toggleIncidentExpand(id, item, mainRow) {
  if (expandedRows.has(id)) {
    expandedRows.delete(id);
    const next = mainRow.nextElementSibling;
    if (next && next.classList.contains('expand-row')) next.remove();
    mainRow.querySelector('td').innerHTML = '&#9654;';
  } else {
    expandedRows.add(id);
    const expandRow = buildIncidentExpandRow(item);
    mainRow.after(expandRow);
    mainRow.querySelector('td').innerHTML = '&#9660;';
  }
}

function buildIncidentExpandRow(item) {
  const tr = document.createElement('tr');
  tr.className = 'expand-row';
  tr.dataset.parent = item._rowId || '';
  const res = item.resource || {};
  tr.innerHTML = `<td colspan="9">
    <div class="expand-content">
      <h4>${t('detail.description')}</h4>
      <p>${escapeHtml(item.description || t('detail.noDescription'))}</p>
      <h4>${t('detail.resource')}</h4>
      <p>${resourceKindBadge(res.kind)} <strong>${escapeHtml(res.name || '-')}</strong> ${t('detail.in')} <em>${escapeHtml(res.namespace || item.namespace || '-')}</em></p>
      <h4>${t('detail.details')}</h4>
      <p>${t('detail.signalType')}: <span class="action-type-badge">${escapeHtml(item.signalType || '-')}</span> | ${t('detail.source')}: ${escapeHtml(item.source || '-')} | ${t('detail.riskScore')}: <strong>${item.riskScore != null ? fmtNum(item.riskScore, 1) : '-'}</strong></p>
      <p>${t('detail.remediationAttempts')}: ${item.remediationAttempts || 0} / ${item.maxRemediationAttempts || '-'}</p>
      ${item.resolution ? `<h4>${t('detail.resolution')}</h4><p>${escapeHtml(item.resolution)}</p>` : ''}
      <div style="display:flex;gap:2rem;margin-top:0.5rem;font-size:0.8rem;color:var(--text-muted)">
        ${item.detectedAt ? `<span>${t('detail.detected')}: ${fmtDateTime(item.detectedAt)}</span>` : ''}
        ${item.resolvedAt ? `<span>${t('detail.resolved')}: ${fmtDateTime(item.resolvedAt)}</span>` : ''}
        ${item.detectedAt && item.resolvedAt ? `<span>${t('detail.duration')}: ${formatDuration(new Date(item.resolvedAt) - new Date(item.detectedAt))}</span>` : ''}
      </div>
      <div id="ai-preview-${escapeHtml(item.name)}" style="margin-top:0.5rem;"></div>
    </div>
  </td>`;
  // Async load AI insight preview for this incident
  loadAIInsightPreview(item.name);
  return tr;
}

function formatDuration(ms) {
  if (!ms || ms < 0) return '-';
  const secs = Math.floor(ms / 1000);
  if (secs < 60) return secs + 's';
  const mins = Math.floor(secs / 60);
  if (mins < 60) return mins + 'm ' + (secs % 60) + 's';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ' + (mins % 60) + 'm';
  const days = Math.floor(hrs / 24);
  return days + 'd ' + (hrs % 24) + 'h';
}

// Enhancement #4/#8: Load AI insight preview inline in incident expand row
async function loadAIInsightPreview(incidentName) {
  const el = document.getElementById('ai-preview-' + incidentName);
  if (!el) return;
  try {
    const data = await apiFetch('/aiinsights?issue=' + encodeURIComponent(incidentName) + '&pageSize=1');
    const items = data.items || [];
    if (items.length === 0) return;
    const ai = items[0];
    const confPct = ((ai.confidence || 0) * 100).toFixed(0);
    const confColor = ai.confidence >= 0.85 ? 'var(--sev-low)' : ai.confidence >= 0.7 ? 'var(--sev-medium)' : 'var(--sev-high)';
    const recs = (ai.recommendations || []).slice(0, 3);
    el.innerHTML = `
      <h4 style="display:flex;align-items:center;gap:0.5rem;">${t('ai.analysis')}
        <span style="background:${confColor}; color:#fff; padding:0.1rem 0.4rem; border-radius:4px; font-size:0.7rem;">${t('ai.confidence', { pct: confPct })}</span>
        <span style="font-size:0.7rem; color:var(--text-dim)">${escapeHtml(ai.provider || '')} / ${escapeHtml(ai.model || '')}</span>
      </h4>
      <p style="font-size:0.8rem; max-height:100px; overflow-y:auto; white-space:pre-wrap;">${escapeHtml((ai.analysis || '').substring(0, 500))}${(ai.analysis || '').length > 500 ? '...' : ''}</p>
      ${recs.length > 0 ? `<div style="font-size:0.8rem;"><strong>${t('ai.recommendations')}:</strong><ul style="margin:0.2rem 0 0 1rem;">${recs.map(r => `<li>${escapeHtml(r)}</li>`).join('')}</ul></div>` : ''}
    `;
  } catch (e) { /* silent */ }
}

async function ackIncident(name, ns) {
  try {
    await apiPost(`/incidents/${name}/acknowledge?namespace=${encodeURIComponent(ns)}`, {});
    toast(t('toast.acked', { name }), 'success');
    loadIncidents();
  } catch (e) {
    toast(t('toast.ackFailed', { msg: e.message }), 'error');
  }
}

async function snoozeIncident(name, ns) {
  const duration = prompt(t('prompt.snooze'), '1h');
  if (!duration) return;
  try {
    await apiPost(`/incidents/${name}/snooze?namespace=${encodeURIComponent(ns)}`, { duration });
    toast(t('toast.snoozed', { name, duration }), 'success');
    loadIncidents();
  } catch (e) {
    toast(t('toast.snoozeFailed', { msg: e.message }), 'error');
  }
}

async function resolveIncident(name, ns) {
  const resolution = prompt(t('prompt.resolution'), t('prompt.resolutionDefault'));
  if (resolution === null) return; // cancelled
  try {
    await apiPost(`/incidents/${name}/resolve?namespace=${encodeURIComponent(ns)}`, { resolution });
    toast(t('toast.resolved', { name }), 'success');
    loadIncidents();
  } catch (e) {
    toast(t('toast.resolveFailed', { msg: e.message }), 'error');
  }
}

      const budgetPct = slo.errorBudgetRemaining || 100;
      const budgetClass = budgetPct > 50 ? 'gauge-ok' : budgetPct > 20 ? 'gauge-warn' : 'gauge-danger';
      const currentPct = slo.currentValue || 0;
      const target = slo.target || 99.9;
      const meeting = currentPct >= target;
      return `
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">${escapeHtml(slo.service || slo.name)}</span>
            ${stateBadge(slo.state || (meeting ? 'Healthy' : 'Firing'))}
          </div>
          <div class="panel-body">
            <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
              <span style="font-size:0.8rem; color:var(--text-muted)">${escapeHtml(t('slo.sli', { sli: slo.sli || '-' }))}</span>
              <span style="font-size:0.8rem; color:var(--text-muted)">${escapeHtml(t('slo.window', { window: slo.window || '30d' }))}</span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:0.3rem;">
              <span style="font-size:1.5rem; font-weight:700; color:${meeting ? 'var(--sev-low)' : 'var(--sev-critical)'}">
                ${fmtNum(currentPct, 2)}%
              </span>
              <span style="font-size:0.8rem; color:var(--text-muted)">${t('slo.target', { target: fmtNum(target, 2) })}</span>
            </div>
            <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:0.3rem;">${t('slo.budgetRemaining')}</div>
            <div class="gauge-bar"><div class="gauge-fill ${budgetClass}" style="width:${Math.max(0, Math.min(100, budgetPct))}%"></div></div>
            <div style="font-size:0.75rem; color:var(--text-muted); text-align:right">${fmtNum(budgetPct, 1)}%</div>
            <div class="burn-rates">
              ${buildBurnChip('1h', slo)}
              ${buildBurnChip('6h', slo)}
              ${buildBurnChip('24h', slo)}
              ${buildBurnChip('72h', slo)}
            </div>
          </div>
        </div>
      `;
    }).join('');

    // Show alerts for SLOs that are breaching
    const alertItems = items.filter(s => (s.state || '').toLowerCase() === 'firing' || (s.currentValue || 0) < (s.target || 99.9));
    if (alertItems.length === 0) {
      alertsEl.innerHTML = `<div class="empty-state">${t('slo.noActiveAlerts')}</div>`;
    } else {
      alertsEl.innerHTML = `<table>
        <thead><tr><th>${t('col.service')}</th><th>${t('col.current')}</th><th>${t('col.target')}</th><th>${t('col.budget')}</th><th>${t('col.state')}</th></tr></thead>
        <tbody>
          ${alertItems.map(s => `<tr>
            <td>${escapeHtml(s.service || s.name)}</td>
            <td style="color:var(--sev-critical)">${fmtNum(s.currentValue || 0, 2)}%</td>
            <td>${fmtNum(s.target || 99.9, 2)}%</td>
            <td>${fmtNum(s.errorBudgetRemaining || 0, 1)}%</td>
            <td>${stateBadge(s.state || (s.currentValue >= s.target ? 'Healthy' : 'Firing'))}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    }
  } catch (e) {
    showError(cardsEl, t('error.slos', { msg: e.message }), 'loadSLOs()');
    showEmpty(alertsEl, '');
  }
}

function buildBurnChip(window, slo) {
  // Compute a simulated burn rate from the available budget data
  const budgetUsedPct = slo.errorBudgetTotal > 0 ? (slo.errorBudgetUsed / slo.errorBudgetTotal) : 0;
  let rate;
  switch(window) {
    case '1h': rate = budgetUsedPct * 720; break;
    case '6h': rate = budgetUsedPct * 120; break;
    case '24h': rate = budgetUsedPct * 30; break;
    case '72h': rate = budgetUsedPct * 10; break;
    default: rate = 0;
  }
  const cls = rate > 14 ? 'burn-danger' : rate > 1 ? 'burn-warn' : 'burn-ok';
  return `<span class="burn-chip ${cls}">${window}: ${fmtNum(rate, 1)}x</span>`;
}

// GAP-03 fix: acknowledge that the human follow-up for a Contained incident
// has been completed (the workload is back up, the bad image was rolled back,
// etc.). Sets the operator-side annotation that lifts the close-block on the
// PostMortem.
async function ackHumanAction(name, ns) {
  const note = prompt(t('prompt.ackHuman'), '');
  if (note === null) return; // user cancelled
  try {
    await apiPost(`/postmortems/${name}/ack-human-action?namespace=${encodeURIComponent(ns)}`,
      { acknowledgedBy: 'web-ui', note: note });
    toast(t('toast.humanAcked', { name }), 'success');
    loadPostMortems();
  } catch (e) {
    toast(t('toast.ackFailed', { msg: e.message }), 'error');
  }
}

function previewStars(el) {
  const val = parseInt(el.dataset.value);
  const siblings = el.parentElement.querySelectorAll('.star');
  siblings.forEach(s => { s.textContent = parseInt(s.dataset.value) <= val ? '★' : '☆'; s.style.color = parseInt(s.dataset.value) <= val ? 'var(--sev-medium)' : 'var(--text-muted)'; });
}
function resetStars(el) {
  const pm = el.parentElement.dataset.pm;
  const selected = parseInt(document.getElementById('fb-accuracy-' + pm).value) || 0;
  el.parentElement.querySelectorAll('.star').forEach(s => { s.textContent = parseInt(s.dataset.value) <= selected ? '★' : '☆'; s.style.color = parseInt(s.dataset.value) <= selected ? 'var(--sev-medium)' : 'var(--text-muted)'; });
}
function selectStar(el) {
  const val = parseInt(el.dataset.value);
  const pm = el.parentElement.dataset.pm;
  document.getElementById('fb-accuracy-' + pm).value = val;
  previewStars(el);
}

async function submitFeedback(name, ns) {
  const accuracy = parseInt(document.getElementById('fb-accuracy-' + name).value) || 0;
  const author = (document.getElementById('fb-author-' + name).value || '').trim();
  const rootCause = (document.getElementById('fb-rootcause-' + name).value || '').trim();
  const comments = (document.getElementById('fb-comments-' + name).value || '').trim();

  if (!author) { toast(t('toast.nameRequired'), 'error'); return; }
  if (accuracy < 1 || accuracy > 5) { toast(t('toast.ratingRequired'), 'error'); return; }

  try {
    await apiPost(`/postmortems/${name}/feedback?namespace=${encodeURIComponent(ns)}`, {
      overrideRootCause: rootCause,
      remediationAccuracy: accuracy,
      comments: comments,
      providedBy: author
    });

async function loadAIInsights() {
  const el = $('#insightsTableBody');
  showLoading(el);

    const issueFilter = ($('#insightIssueFilter') || {}).value || '';
    const qs = issueFilter ? `?pageSize=100&issue=${encodeURIComponent(issueFilter)}` : '?pageSize=100';
    const data = await apiFetch('/aiinsights' + qs);
    const items = data.items || [];
    $('#insightCount').textContent = t('insights.count', { n: items.length });
    if (items.length === 0) { showEmpty(el, t('insights.empty')); return; }
    el.innerHTML = `<table>
      <thead><tr>
        <th></th><th>${t('col.incident')}</th><th>${t('col.provider')}</th><th>${t('col.model')}</th><th>${t('col.confidence')}</th><th>${t('col.recommendations')}</th><th>${t('col.actions')}</th><th>${t('col.generated')}</th>
      </tr></thead>
      <tbody id="insightsTbody"></tbody>
    </table>`;
    const tbody = $('#insightsTbody');
    items.forEach((item, idx) => {
      const id = 'ai-' + idx;
      const isExpanded = expandedRows.has(id);
      const confidence = item.confidence || 0;
      const confColor = confidence >= 0.85 ? 'var(--sev-low)' : confidence >= 0.7 ? 'var(--sev-medium)' : 'var(--sev-high)';
      const recCount = (item.recommendations || []).length;
      const actCount = (item.suggestedActions || []).length;
      const mainRow = document.createElement('tr');
      mainRow.className = 'expandable';
      mainRow.dataset.rowId = id;
      mainRow.innerHTML = `
        <td style="width:20px; cursor:pointer; color:var(--text-muted)">${isExpanded ? '&#9660;' : '&#9654;'}</td>

        <td>${escapeHtml(item.provider || '-')}</td>
        <td><small>${escapeHtml(item.model || '-')}</small></td>
        <td><span style="color:${confColor}; font-weight:600">${fmtNum(confidence * 100, 0)}%</span></td>
        <td>${recCount}</td>
        <td>${actCount > 0 ? `<span class="action-type-badge">${t('insights.actions', { n: actCount })}</span>` : '-'}</td>
        <td data-sort-value="${new Date(item.generatedAt || item.creationTimestamp || 0).getTime()}">${timeAgo(item.generatedAt || item.creationTimestamp)}</td>

      mainRow.addEventListener('click', () => toggleInsightExpand(id, item, mainRow));
      tbody.appendChild(mainRow);

    });
    makeSortable(el.querySelector('table'));
  } catch (e) {
    showError(el, t('error.insights', { msg: e.message }), 'loadAIInsights()');
  }
}

function toggleInsightExpand(id, item, mainRow) {
  if (expandedRows.has(id)) {
    expandedRows.delete(id);
    const next = mainRow.nextElementSibling;
    if (next && next.classList.contains('expand-row')) next.remove();
    mainRow.querySelector('td').innerHTML = '&#9654;';
  } else {
    expandedRows.add(id);
    mainRow.after(buildInsightExpandRow(item));
    mainRow.querySelector('td').innerHTML = '&#9660;';
  }
}

function buildInsightExpandRow(item) {
  const tr = document.createElement('tr');
  tr.className = 'expand-row';
  const recs = (item.recommendations || []).map(r => `<li>${escapeHtml(r)}</li>`).join('');
  const actions = (item.suggestedActions || []).map(a =>
    `<li><span class="action-type-badge">${escapeHtml(a.action)}</span> <strong>${escapeHtml(a.name)}</strong>: ${escapeHtml(a.description || '')}${a.params ? ` <small style="color:var(--text-muted)">${escapeHtml(JSON.stringify(a.params))}</small>` : ''}</li>`
  ).join('');
  tr.innerHTML = `<td colspan="8">
    <div class="expand-content">
      <h4>${t('ai.analysis')}</h4>
      <p style="white-space:pre-wrap; max-height:300px; overflow-y:auto;">${escapeHtml(item.analysis || t('insights.pending'))}</p>
      ${recs ? `<h4>${t('ai.recommendations')}</h4><ul>${recs}</ul>` : ''}
      ${actions ? `<h4>${t('insights.suggestedActions')}</h4><ul>${actions}</ul>` : ''}
      ${item.logAnalysis ? `<h4>${t('insights.logAnalysis')}</h4><p style="white-space:pre-wrap; max-height:200px; overflow-y:auto; font-size:0.8rem; color:var(--text-muted)">${escapeHtml(item.logAnalysis)}</p>` : ''}
      ${item.cascadeAnalysis ? `<h4>${t('insights.cascade')}</h4><p style="white-space:pre-wrap; font-size:0.85rem;">${escapeHtml(item.cascadeAnalysis)}</p>` : ''}
      ${item.gitOpsContext ? `<h4>${t('insights.gitops')}</h4><p style="font-size:0.85rem;">${escapeHtml(item.gitOpsContext)}</p>` : ''}
      ${item.blastRadiusPrediction ? `<h4>${t('insights.blastRadius')}</h4><p style="font-size:0.85rem;">${escapeHtml(item.blastRadiusPrediction)}</p>` : ''}
    </div>
  </td>`;
  return tr;
}

        <div class="stat-card"><div class="stat-label">${t('federation.disconnected')}</div><div class="stat-value" style="color:var(--sev-critical)">${status.disconnectedClusters || 0}</div></div>
        <div class="stat-card"><div class="stat-label">${t('federation.activeIssues')}</div><div class="stat-value" style="color:var(--warning)">${status.totalActiveIssues || 0}</div></div>

          <strong>${escapeHtml(c.issue || '-')}</strong>
          <span style="color:var(--text-muted)">— ${escapeHtml(c.signalType || '-')}</span>
          ${c.cascade ? `<span style="color:var(--sev-critical); font-size:0.7rem; margin-left:0.3rem">${t('federation.cascade')}</span>` : ''}

function getClusterStateClass(state) {
  const s = (state || '').toLowerCase();
  if (['healthy', 'connected', 'ready'].includes(s)) return 'state-healthy';

  return 'state-unknown';
}

  try {
    const hdrs = {};
    if (apiKey) hdrs['X-API-Key'] = apiKey;
    const res = await fetch(API + '/audit/export' + q, { headers: hdrs });
    if (!res.ok) throw new Error(res.statusText);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `audit-events-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast(t('toast.exported'), 'success');
  } catch (e) {
    toast(t('toast.exportFailed', { msg: e.message }), 'error');
  }
}

// ===== PENDING APPROVALS BADGE (polled) =====

async function updateApprovalBadge() {
  try {
    const data = await apiFetch('/approvals?state=Pending&pageSize=1');
    const total = (data.metadata || {}).totalCount || (data.items || []).length;
    const badge = $('#approvalBadge');
    if (total > 0) {
      badge.style.display = '';
      badge.textContent = total;
    } else {
      badge.style.display = 'none';
    }
  } catch { /* ignore */ }
}

// ===== INIT =====

// Preferences first: the head bootstrap chose theme and language before
// paint; here the switchers reflect that choice and the static markup gets
// its labels, before any panel renders.
$('#themeSelect').value = storedTheme();
$('#langSelect').value = lang;
applyTranslations();

document.addEventListener('DOMContentLoaded', () => {
  updateLogoutBtn();
  initDragPanels('overviewPanels');
  initRecentFilters();
  loadOverview();
  checkHealth();
  updateApprovalBadge();
  startRefresh();

  // Debounced audit search
  let auditTimeout;
  $('#auditSearch').addEventListener('input', () => {
    clearTimeout(auditTimeout);
    auditTimeout = setTimeout(() => { if (currentTab === 'audit') loadAudit(); }, 400);
  });
});

</script>
