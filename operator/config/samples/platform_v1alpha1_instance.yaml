# Sample: a ChatCLI Instance the operator can provision AND reach.
#
# Two things are mandatory for an Instance in a cluster:
#   1. A credential. The server binds every interface inside Kubernetes and
#      refuses to start without one; the operator does not even create the
#      Deployment (condition AuthenticationConfigured=False). This sample
#      uses a shared token (Secret chatcli-sample-token below).
#   2. TLS. The operator always dials the server over TLS 1.3. Without
#      spec.server.tls the server runs but ServerReachable=False and the
#      AIOps pipeline (alerts, AI insights, remediation) cannot talk to it.
#
# Before applying, create the TLS Secret (it cannot be shipped in a sample).
# The certificate must be valid for <instance>.<namespace>.svc.cluster.local,
# the name the operator dials, here chatcli-sample.chatcli.svc.cluster.local.
# Self-signed example (a cert-manager Certificate works the same way; it
# writes ca.crt for you with an internal CA issuer):
#
#   kubectl create namespace chatcli
#   openssl req -x509 -newkey rsa:4096 -sha256 -days 825 -nodes \
#     -keyout tls.key -out tls.crt \
#     -subj "/CN=chatcli-sample.chatcli.svc.cluster.local" \
#     -addext "subjectAltName=DNS:chatcli-sample.chatcli.svc.cluster.local,DNS:chatcli-sample.chatcli.svc,DNS:chatcli-sample"
#   kubectl -n chatcli create secret generic chatcli-sample-tls \
#     --from-file=tls.crt=tls.crt --from-file=tls.key=tls.key \
#     --from-file=ca.crt=tls.crt   # self-signed: the cert is its own CA
#
# ca.crt is the trust root the operator uses for this Instance; leave it out
# only for a certificate from a publicly trusted CA.
#
# Then replace the placeholders below and `kubectl apply -f` this file.
apiVersion: v1
kind: Namespace
metadata:
  name: chatcli
---
# Secret with provider API keys (envFrom'd into the server pod).
apiVersion: v1
kind: Secret
metadata:
  name: chatcli-api-keys
  namespace: chatcli
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "<your-anthropic-api-key>"
  # OPENAI_API_KEY: "<your-openai-api-key>"
  # GOOGLEAI_API_KEY: "<your-google-api-key>"
---
# Shared server token. Replace the placeholder with a random value, e.g.
# the output of `openssl rand -hex 32`, or create the Secret instead with:
#   kubectl -n chatcli create secret generic chatcli-sample-token \
#     --from-literal=token="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: chatcli-sample-token
  namespace: chatcli
type: Opaque
stringData:
  token: "<replace-with-openssl-rand-hex-32>"
---
apiVersion: platform.chatcli.io/v1alpha1
kind: Instance
metadata:
  name: chatcli-sample
  namespace: chatcli
spec:
  replicas: 1
  provider: CLAUDEAI
  model: claude-sonnet-4-5
  image:
    repository: ghcr.io/diillson/chatcli
    # No tag: the operator pins the server image to its own release
    # (CHATCLI_OPERATOR_APP_VERSION). Set tag only to override that.
    pullPolicy: IfNotPresent
  server:
    port: 50051
    token:
      name: chatcli-sample-token
      key: token
    tls:
      enabled: true
      secretName: chatcli-sample-tls   # tls.crt, tls.key, ca.crt
  # Single-target watcher (legacy):
  # watcher:
  #   enabled: true
  #   deployment: my-app
  #   namespace: production
  #   interval: "30s"
  #   window: "2h"
  #   maxLogLines: 100
  #
  # Multi-target watcher:
  # watcher:
  #   enabled: true
  #   interval: "30s"
  #   window: "2h"
  #   maxLogLines: 100
  #   maxContextChars: 32000
  #   targets:
  #     - deployment: api-gateway
  #       namespace: production
  #       metricsPort: 9090
  #       metricsFilter: ["http_requests_total", "http_request_duration_*"]
  #     - deployment: auth-service
  #       namespace: production
  #       metricsPort: 9090
  #     - deployment: worker
  #       namespace: batch
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # persistence:
  #   enabled: true
  #   size: 1Gi
  apiKeys:
    name: chatcli-api-keys
