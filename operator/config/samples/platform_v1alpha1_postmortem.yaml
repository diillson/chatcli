# Sample: PostMortem. The operator creates these itself when an Issue is
# resolved; applying one by hand is only useful for testing the REST API or
# the dashboard. Only the spec below is user input — the narrative (summary,
# rootCause, impact, timeline, lessonsLearned, preventionActions, …) lives in
# .status and is written by the operator, e.g.:
#
#   status:
#     state: Open
#     summary: "Backend pods hit OOM due to a memory leak in the cache layer."
#     rootCause: "Unbounded in-memory cache growth under sustained traffic."
#     impact: "2 of 3 backend pods were OOMKilled for ~8 minutes."
#     timeline:
#       - timestamp: "2026-02-19T10:00:00Z"
#         type: detected
#         detail: "Anomaly detected: HighRestartCount on backend pods"
#       - timestamp: "2026-02-19T10:02:00Z"
#         type: resolved
#         detail: "All pods Running, no OOMKill"
#     lessonsLearned:
#       - "Add cache eviction policy with max-size bounds"
#     preventionActions:
#       - "Alert on cache size above 80% of the memory limit"
apiVersion: platform.chatcli.io/v1alpha1
kind: PostMortem
metadata:
  name: issue-oom-backend-pm
  namespace: default
  labels:
    platform.chatcli.io/issue: issue-oom-backend
spec:
  issueRef:
    name: issue-oom-backend
  resource:
    kind: Deployment
    name: backend
    namespace: default
  severity: medium
