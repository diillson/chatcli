# Sample: ChatCLI Instance using AWS Bedrock (Anthropic Claude on Bedrock).
#
# Two auth modes — pick ONE:
#   (a) IRSA (recommended on EKS): no static keys; set
#       spec.serviceAccount.annotations with eks.amazonaws.com/role-arn
#       (commented out below). The operator merges these annotations into
#       the Instance's ServiceAccount and keeps any others.
#   (b) Static IAM user keys: place AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#       in the Secret referenced by spec.apiKeys (as shown below).
#
# Like every Instance it also needs a credential (Secret
# chatcli-bedrock-token) and TLS: the operator always dials the server over
# TLS 1.3, so without spec.server.tls it cannot reach it. Create the TLS
# Secret first — see platform_v1alpha1_instance.yaml for the openssl
# commands; the certificate must be valid for
# chatcli-bedrock.chatcli.svc.cluster.local:
#
#   kubectl -n chatcli create secret generic chatcli-bedrock-tls \
#     --from-file=tls.crt=tls.crt --from-file=tls.key=tls.key \
#     --from-file=ca.crt=tls.crt
#
# Required IAM policy for the role/user (see docs/features/bedrock):
#   bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream,
#   bedrock:ListFoundationModels, bedrock:ListInferenceProfiles
apiVersion: v1
kind: Namespace
metadata:
  name: chatcli
---
apiVersion: v1
kind: Secret
metadata:
  name: chatcli-bedrock-keys
  namespace: chatcli
type: Opaque
stringData:
  # Mode (b) — static keys. Leave empty if using IRSA.
  AWS_ACCESS_KEY_ID: "<your-access-key-id>"
  AWS_SECRET_ACCESS_KEY: "<your-secret-access-key>"
  # Optional for STS / assumed-role:
  # AWS_SESSION_TOKEN: "<your-session-token>"

  # Region (required either way):
  BEDROCK_REGION: "us-east-1"

  # Corporate proxy / private CA (optional):
  # CHATCLI_BEDROCK_CA_BUNDLE: "/etc/ssl/corp-ca-bundle.pem"
  # CHATCLI_BEDROCK_INSECURE_SKIP_VERIFY: "true"   # INSECURE — troubleshooting only
---
# Shared server token: replace with a random value (openssl rand -hex 32).
apiVersion: v1
kind: Secret
metadata:
  name: chatcli-bedrock-token
  namespace: chatcli
type: Opaque
stringData:
  token: "<replace-with-openssl-rand-hex-32>"
---
apiVersion: platform.chatcli.io/v1alpha1
kind: Instance
metadata:
  name: chatcli-bedrock
  namespace: chatcli
spec:
  replicas: 1
  provider: BEDROCK
  # Claude on Bedrock is addressed through an inference profile id: prefix the
  # base id with "global.", "us.", "eu." or "apac.". Claude 3.x models are retired.
  model: global.anthropic.claude-sonnet-4-6
  image:
    repository: ghcr.io/diillson/chatcli
    # No tag: the operator pins the server image to its own release.
    pullPolicy: IfNotPresent
  server:
    port: 50051
    token:
      name: chatcli-bedrock-token
      key: token
    tls:
      enabled: true
      secretName: chatcli-bedrock-tls   # tls.crt, tls.key, ca.crt
  # IRSA (mode a):
  # serviceAccount:
  #   annotations:
  #     eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/<role-name>
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  apiKeys:
    name: chatcli-bedrock-keys
# IRSA (mode a): with spec.serviceAccount.annotations set as above, delete
# the static keys from the Secret — the AWS SDK picks up the role via the web
# identity token file EKS injects. Annotating the ServiceAccount by hand also
# works: the operator keeps annotations it does not manage.
