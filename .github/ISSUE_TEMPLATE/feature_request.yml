name: Feature request
description: Propose a new capability or a change to an existing one.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For a large change (a new provider, a builtin tool, a new surface, a change of defaults or security behavior), use this issue to agree on the approach before opening a pull request.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: How you would like ChatCLI to behave. Commands, settings or examples help.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Providers and models
        - Coder and agents
        - Quality harness, MoA
        - Memory and context
        - Tools, plugins, skills, MCP
        - Chat gateway
        - Server mode or operator
        - Web UI or live dashboard
        - Security
        - Documentation
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including what you do today.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to open the pull request for this.
