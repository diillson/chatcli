name: Image Refresh (drift remediation)

# Re-scans the last 3 stable image tags published to GHCR (chatcli + chatcli-operator)
# and rebuilds them in-place when fixable HIGH/CRITICAL OS vulns are detected.
# The semver tag is preserved; only the underlying digest changes.
#
# Triggers:
#   - schedule: weekly Monday 06:00 UTC (aligned with security-scan.yml)
#   - workflow_dispatch: manual run with optional `tags` and `force` inputs
#   - repository_dispatch (type: image-refresh-request): external triggers
#
# Architecture:
#   discover -> scan (matrix image+tag) -> plan (singular)
#                                            |
#                                            +-> build (matrix image+tag+arch on native runners)
#                                                  |
#                                                  +-> gate (matrix image+tag, Trivy, read-only token)
#                                                        |
#                                                        +-> merge (matrix image+tag, push tag + sign)
#                                                              |
#                                                              +-> report (singular, always)
#
# Permissions are granted per job. The third-party scanner runs only in
# jobs whose token can read packages and nothing else; the job that can
# push tags and mint an OIDC signing identity runs no scanner and only acts
# on the verdict the gate job recorded for that exact digest.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Comma-separated semver tags to refresh (e.g. "1.111.1,1.110.0"). Empty = last 3 stable.'
        required: false
        type: string
      force:
        description: 'Refresh even if scan is clean'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [image-refresh-request]

permissions:
  contents: read

concurrency:
  group: image-refresh
  cancel-in-progress: false

jobs:
  discover:
    name: Discover target tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      scan_matrix: ${{ steps.compute.outputs.scan_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve target matrix
        id: compute
        env:
          INPUT_TAGS: ${{ github.event.inputs.tags }}
          DISPATCH_TAGS: ${{ github.event.client_payload.tags }}
        run: |
          set -euo pipefail
          INPUT="${INPUT_TAGS:-${DISPATCH_TAGS:-}}"
          if [ -n "$INPUT" ]; then
            TAGS=$(echo "$INPUT" | tr ',' '\n' | sed 's/^v//' | sed '/^$/d')
          else
            TAGS=$(git tag -l 'v*' --sort=-v:refname | head -3 | sed 's/^v//')
          fi
          if [ -z "$TAGS" ]; then
            echo "::error::No semver tags resolved"
            exit 1
          fi
          # Every downstream job puts the tag into a checkout ref, an image
          # reference and shell commands, so only plain MAJOR.MINOR.PATCH
          # values get through. Anything else stops the run here.
          while IFS= read -r t; do
            if ! [[ "$t" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Refusing tag '$t': expected MAJOR.MINOR.PATCH, optionally prefixed with v"
              exit 1
            fi
          done <<< "$TAGS"
          echo "Resolved tags:"
          echo "$TAGS"
          INCLUDES=$(echo "$TAGS" | jq -R -s -c '
            split("\n") | map(select(length > 0)) | map(. as $t | [
              {image: "chatcli",          tag: $t, dockerfile: "Dockerfile",          context: "."},
              {image: "chatcli-operator", tag: $t, dockerfile: "operator/Dockerfile", context: "."}
            ]) | flatten
          ')
          echo "scan_matrix={\"include\":$INCLUDES}" >> "$GITHUB_OUTPUT"

  scan:
    name: "Scan ${{ matrix.image }}:${{ matrix.tag }}"
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.scan_matrix) }}
    steps:
      - name: Checkout source at tag (for .trivyignore.yaml)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ matrix.tag }}"
          fetch-depth: 1
          sparse-checkout: .trivyignore.yaml
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan published image
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/diillson/${{ matrix.image }}:${{ matrix.tag }}"
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          scanners: vuln
          exit-code: '1'

      - name: Record decision
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ matrix.tag }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
          SCAN_OUTCOME: ${{ steps.trivy.outcome }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
          FORCE_DISPATCH: ${{ github.event.client_payload.force }}
        run: |
          set -euo pipefail
          FORCE="${FORCE_INPUT:-${FORCE_DISPATCH:-false}}"
          if [ "$FORCE" = "true" ]; then
            REFRESH=true; REASON="forced"
          elif [ "$SCAN_OUTCOME" = "failure" ]; then
            REFRESH=true; REASON="vulnerabilities-detected"
          else
            REFRESH=false; REASON="clean"
          fi
          mkdir -p decisions
          jq -nc \
            --arg image      "$IMAGE" \
            --arg tag        "$TAG" \
            --arg dockerfile "$DOCKERFILE" \
            --arg context    "$CONTEXT" \
            --argjson refresh $REFRESH \
            --arg reason     "$REASON" \
            '{image:$image, tag:$tag, dockerfile:$dockerfile, context:$context, refresh:$refresh, reason:$reason}' \
            > "decisions/${IMAGE}-${TAG}.json"
          echo "::notice::${IMAGE}:${TAG} -> refresh=${REFRESH} (${REASON})"

      - name: Upload decision
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decision-${{ matrix.image }}-${{ matrix.tag }}
          path: decisions/*.json
          retention-days: 14
          if-no-files-found: error

  plan:
    name: Plan rebuilds
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any_refresh:  ${{ steps.compute.outputs.any_refresh }}
      arch_matrix:  ${{ steps.compute.outputs.arch_matrix }}
      merge_matrix: ${{ steps.compute.outputs.merge_matrix }}
    steps:
      - name: Download all decisions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: decision-*
          path: /tmp/decisions
          merge-multiple: true

      - name: Compute build & merge matrices
        id: compute
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(/tmp/decisions/*.json)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No decisions found"
            exit 1
          fi
          ALL=$(jq -s '.' "${FILES[@]}")
          NEEDS=$(echo "$ALL" | jq '[.[] | select(.refresh==true)]')
          COUNT=$(echo "$NEEDS" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "any_refresh=false" >> "$GITHUB_OUTPUT"
            echo "arch_matrix={\"include\":[]}"  >> "$GITHUB_OUTPUT"
            echo "merge_matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "::notice::No targets need refresh"
            exit 0
          fi
          MERGE_MATRIX=$(echo "$NEEDS" | jq -c '{include: .}')
          ARCH_MATRIX=$(echo "$NEEDS" | jq -c '
            {
              include: [
                .[] as $t |
                ($t + {arch:"amd64", runner:"ubuntu-latest",     platform:"linux/amd64"}),
                ($t + {arch:"arm64", runner:"ubuntu-24.04-arm",  platform:"linux/arm64"})
              ]
            }
          ')
          {
            echo "any_refresh=true"
            echo "arch_matrix=$ARCH_MATRIX"
            echo "merge_matrix=$MERGE_MATRIX"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::$COUNT target(s) need refresh"

  build:
    name: "Build ${{ matrix.image }}:${{ matrix.tag }} (${{ matrix.arch }})"
    needs: plan
    if: needs.plan.outputs.any_refresh == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.arch_matrix) }}
    steps:
      - name: Checkout source at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ matrix.tag }}"
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same release metadata the tag was first published with, so a
      # refreshed server image keeps reporting its real version. The
      # operator Dockerfile does not declare these args and ignores them.
      - name: Build metadata
        id: buildmeta
        env:
          TAG: ${{ matrix.tag }}
        run: |
          {
            echo "version=v${TAG}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.buildmeta.outputs.version }}
            COMMIT_HASH=${{ steps.buildmeta.outputs.commit }}
            BUILD_DATE=${{ steps.buildmeta.outputs.date }}
          no-cache: true
          provenance: true
          sbom: true
          outputs: type=image,name=ghcr.io/diillson/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest file
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.tag }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # The Trivy gate runs here, in a job whose token can only read: a
  # compromised scanner cannot push a tag or obtain a signing identity. It
  # does not fail on findings (continue-on-error, as before); it records the
  # verdict for the exact amd64 digest it scanned, and the merge job below
  # publishes and signs only when that verdict says "success" for the same
  # digest. A missing or unreadable verdict blocks the target.
  gate:
    name: "Gate ${{ matrix.image }}:${{ matrix.tag }}"
    needs: [plan, build]
    if: needs.plan.outputs.any_refresh == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.merge_matrix) }}
    steps:
      - name: Checkout source at tag (for .trivyignore.yaml)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ matrix.tag }}"
          fetch-depth: 1
          sparse-checkout: .trivyignore.yaml
          persist-credentials: false

      - name: Resolve amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.tag }}-amd64
          path: /tmp/digest-amd64

      - name: Compute amd64 digest sha
        id: digest
        run: |
          set -euo pipefail
          SHA="sha256:$(ls /tmp/digest-amd64)"
          if ! [[ "$SHA" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected amd64 digest artifact content: $SHA"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy gate on rebuilt amd64 digest
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/diillson/${{ matrix.image }}@${{ steps.digest.outputs.sha }}"
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          scanners: vuln
          exit-code: '1'

      - name: Record gate verdict
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ matrix.tag }}
          OUTCOME: ${{ steps.trivy.outcome }}
          DIGEST_AMD64: ${{ steps.digest.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p gate
          jq -nc \
            --arg outcome "$OUTCOME" \
            --arg digest  "$DIGEST_AMD64" \
            '{outcome:$outcome, digest:$digest}' \
            > "gate/${IMAGE}-${TAG}.json"
          echo "::notice::${IMAGE}:${TAG} gate=${OUTCOME} (${DIGEST_AMD64})"

      - name: Upload gate verdict
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-${{ matrix.image }}-${{ matrix.tag }}
          path: gate/*.json
          retention-days: 14
          if-no-files-found: error

  merge:
    name: "Merge & sign ${{ matrix.image }}:${{ matrix.tag }}"
    needs: [plan, build, gate]
    # Runs per target even when another target's gate job broke, so one
    # target cannot hold back the others; each target still needs its own
    # "success" verdict (checked below, fail closed) before anything is
    # pushed or signed. A build failure skips every merge, as before.
    if: ${{ !cancelled() && needs.plan.outputs.any_refresh == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.merge_matrix) }}
    steps:
      - name: Download digests for this target
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.image }}-${{ matrix.tag }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Resolve amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.tag }}-amd64
          path: /tmp/digest-amd64

      - name: Compute amd64 digest sha
        id: digest
        run: |
          set -euo pipefail
          SHA="sha256:$(ls /tmp/digest-amd64)"
          if ! [[ "$SHA" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected amd64 digest artifact content: $SHA"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Download gate verdict
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-${{ matrix.image }}-${{ matrix.tag }}
          path: /tmp/gate

      - name: Read gate verdict
        id: gate
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ matrix.tag }}
          DIGEST_AMD64: ${{ steps.digest.outputs.sha }}
        run: |
          set -euo pipefail
          VERDICT="/tmp/gate/${IMAGE}-${TAG}.json"
          OUTCOME="missing"
          if [ -f "$VERDICT" ]; then
            SCANNED=$(jq -r '.digest // ""' "$VERDICT")
            if [ "$SCANNED" = "$DIGEST_AMD64" ]; then
              OUTCOME=$(jq -r '.outcome // "missing"' "$VERDICT")
            else
              OUTCOME="digest-mismatch"
            fi
          fi
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          if [ "$OUTCOME" != "success" ]; then
            echo "::warning::${IMAGE}:${TAG} not published: gate verdict is '${OUTCOME}'"
          fi

      - name: Login to GHCR
        if: steps.gate.outputs.outcome == 'success'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.gate.outputs.outcome == 'success'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create multi-arch manifest and push tag
        id: manifest
        if: steps.gate.outputs.outcome == 'success'
        working-directory: /tmp/digests
        env:
          REF: ghcr.io/diillson/${{ matrix.image }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${REF}:${TAG}" \
            $(printf "${REF}@sha256:%s " *)
          # The signature goes on the digest just pushed: a tag can be moved
          # between this step and the signature, a digest cannot.
          DIGEST=$(docker buildx imagetools inspect "${REF}:${TAG}" --format '{{json .Manifest}}' | jq -r '.digest')
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve the manifest digest of ${REF}:${TAG}"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: steps.gate.outputs.outcome == 'success'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign refreshed manifest by digest (keyless OIDC)
        id: sign
        if: steps.gate.outputs.outcome == 'success'
        env:
          REF: ghcr.io/diillson/${{ matrix.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --recursive "${REF}@${DIGEST}"

      - name: Record result
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ matrix.tag }}
          REASON: ${{ matrix.reason }}
          GATE: ${{ steps.gate.outputs.outcome }}
          SIGN: ${{ steps.sign.outcome }}
          DIGEST_AMD64: ${{ steps.digest.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p results
          if [ "$GATE" != "success" ]; then
            STATUS="gate_failed"
          elif [ "$SIGN" = "success" ]; then
            STATUS="refreshed"
          else
            # Gate passed but the manifest push or the signature failed.
            STATUS="build_failed"
          fi
          jq -nc \
            --arg image  "$IMAGE" \
            --arg tag    "$TAG" \
            --arg status "$STATUS" \
            --arg reason "$REASON" \
            --arg digest "${DIGEST_AMD64:-}" \
            '{image:$image, tag:$tag, status:$status, reason:$reason, digest:$digest}' \
            > "results/${IMAGE}-${TAG}.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.image }}-${{ matrix.tag }}
          path: results/*.json
          retention-days: 14
          if-no-files-found: warn

  report:
    name: Aggregate & open issue
    needs: [scan, plan, merge]
    if: always() && needs.scan.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download decisions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: decision-*
          path: /tmp/decisions
          merge-multiple: true

      - name: Download results (may be empty)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: result-*
          path: /tmp/results
          merge-multiple: true

      - name: Aggregate
        id: agg
        run: |
          set -euo pipefail
          shopt -s nullglob
          DEC=(/tmp/decisions/*.json)
          RES=(/tmp/results/*.json)
          DECISIONS=$([ ${#DEC[@]} -gt 0 ] && jq -s '.' "${DEC[@]}" || echo '[]')
          RESULTS=$(  [ ${#RES[@]} -gt 0 ] && jq -s '.' "${RES[@]}" || echo '[]')
          # Final status per (image, tag): result wins; otherwise decision (clean) or fallback
          MERGED=$(jq -cn --argjson dec "$DECISIONS" --argjson res "$RESULTS" '
            $dec | map(. as $d |
              ($res | map(select(.image==$d.image and .tag==$d.tag)) | first) as $r |
              if $r then $r
              elif ($d.refresh|not) then {image:$d.image, tag:$d.tag, status:"clean",        reason:$d.reason, digest:""}
              else                       {image:$d.image, tag:$d.tag, status:"build_failed", reason:$d.reason, digest:""}
              end
            )
          ')
          REFRESHED=$(echo "$MERGED" | jq '[.[] | select(.status=="refreshed")]')
          FAILED=$(echo    "$MERGED" | jq '[.[] | select(.status=="gate_failed" or .status=="build_failed")]')
          CLEAN=$(echo     "$MERGED" | jq '[.[] | select(.status=="clean")]')
          REFRESHED_N=$(echo "$REFRESHED" | jq 'length')
          FAILED_N=$(echo    "$FAILED"    | jq 'length')
          CLEAN_N=$(echo     "$CLEAN"     | jq 'length')
          ANY_ACTION=$([ "$REFRESHED_N" -gt 0 ] || [ "$FAILED_N" -gt 0 ] && echo true || echo false)
          ANY_FAILURE=$([ "$FAILED_N" -gt 0 ] && echo true || echo false)
          {
            echo "any_action=$ANY_ACTION"
            echo "any_failure=$ANY_FAILURE"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Image refresh report — $(date -u +%Y-%m-%d)"
            echo ""
            echo "Triggered by \`${GITHUB_EVENT_NAME}\` (run [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))"
            echo ""
            if [ "$FAILED_N" -gt 0 ]; then
              echo "### ❌ Failures (manual triage required)"
              echo ""
              echo "| Image | Tag | Status | Reason |"
              echo "| --- | --- | --- | --- |"
              echo "$FAILED" | jq -r '.[] | "| `\(.image)` | `\(.tag)` | `\(.status)` | `\(.reason)` |"'
              echo ""
              echo "Old digest is preserved on these tags; no republish happened."
              echo ""
            fi
            if [ "$REFRESHED_N" -gt 0 ]; then
              echo "### ✅ Refreshed"
              echo ""
              echo "| Image | Tag | Reason | New amd64 digest |"
              echo "| --- | --- | --- | --- |"
              echo "$REFRESHED" | jq -r '.[] | "| `\(.image)` | `\(.tag)` | `\(.reason)` | `\(.digest // "n/a")` |"'
              echo ""
            fi
            if [ "$CLEAN_N" -gt 0 ]; then
              echo "### Clean (no action)"
              echo ""
              echo "$CLEAN" | jq -r '.[] | "- `\(.image):\(.tag)`"'
              echo ""
            fi
          } > /tmp/body.md
          cat /tmp/body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure tracking labels exist
        if: steps.agg.outputs.any_action == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create image-refresh   --color 1d76db --description "Automated image refresh runs" --force
          gh label create security        --color d93f0b --description "Security-related"             --force
          gh label create priority/p1     --color b60205 --description "P1 — manual triage required"  --force

      - name: Open or comment tracking issue
        if: steps.agg.outputs.any_action == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANY_FAILURE: ${{ steps.agg.outputs.any_failure }}
        run: |
          set -euo pipefail
          TITLE="chore(security): image refresh report — $(date -u +%Y-%m-%d)"
          BODY=$(cat /tmp/body.md)
          LABELS="image-refresh,security"
          if [ "$ANY_FAILURE" = "true" ]; then
            LABELS="$LABELS,priority/p1"
          fi
          EXISTING=$(gh issue list --label image-refresh --state open --json number,title --jq \
            ".[] | select(.title==\"$TITLE\") | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Commented on issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "$LABELS"
          fi
