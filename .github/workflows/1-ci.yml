name: CI (Lint, Fmt, Test, Coverage)

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: Executa os testes e gera o relatório de cobertura
  lint-and-test:
    name: Lint, Test and Generate Coverage
    runs-on: ubuntu-latest
    if: github.actor != 'release-please[bot]' && github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint (full module)
        # The legacy backlog that once required --new-from-rev diff-only
        # enforcement was fully paid down (misspell in PR #1055, the five
        # heavy linters in #1056, the remainder here), so the whole module
        # is enforced: debt can no longer accumulate outside PR diffs.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-mode: goinstall
          args: --timeout=8m

      - name: Check gofmt
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "::error file=gofmt::The following files are not formatted:"
            echo "$output"
            exit 1
          fi

      # The release pipeline rewrites the current version in the docs site
      # with this script; a pairing bug there silently rewrote history.
      - name: Docs version bump self-test
        run: bash scripts/docs/test-bump-version.sh

      # The same release job writes the release-notes pages, the home strip
      # and the Releases sidebar of the docs site from CHANGELOG.md.
      - name: Docs release notes self-test
        run: bash scripts/docs/test-gen-release-notes.sh

      - name: Go vet
        run: go vet ./...

      - name: Run unit tests
        run: |
          go test -race -coverprofile=coverage.out ./... -v
          go tool cover -func=coverage.out > coverage.txt

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.txt
          retention-days: 7 # O artefato só precisa existir por 7 dias

  # JOB 2: the Helm charts ship with every release, so they get the same
  # PR-time gate as the Go code: strict lint, a render of the shapes users
  # actually deploy, and schema validation of the rendered manifests.
  helm-charts:
    name: Helm charts (lint, template, kubeconform)
    runs-on: ubuntu-latest
    if: github.actor != 'release-please[bot]' && github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Install kubeconform
        run: |
          set -euo pipefail
          KC_VERSION=v0.8.0
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KC_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: helm lint --strict
        run: |
          set -euo pipefail
          helm lint --strict deploy/helm/chatcli
          helm lint --strict deploy/helm/chatcli-operator

      - name: Render and validate manifests
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          # Server chart: default, and the "everything on" shape (fallback, MCP,
          # watcher targets, persistence, network policy, ingress, HPA, PDB, TLS/JWT).
          helm template chatcli deploy/helm/chatcli \
            --set server.token=ci-token > /tmp/rendered/server-default.yaml
          helm template chatcli deploy/helm/chatcli \
            --set server.token=ci-token \
            --set llm.provider=CLAUDEAI --set secrets.anthropicApiKey=k \
            --set fallback.enabled=true \
            --set 'fallback.providers[0].name=OPENAI' --set 'fallback.providers[0].model=gpt-6-astra' \
            --set 'fallback.providers[1].name=MOONSHOT' --set secrets.moonshotApiKey=k \
            --set mcp.enabled=true --set 'mcp.servers[0].name=fs' --set 'mcp.servers[0].command=npx' \
            --set copilot.model=gpt-6-astra \
            --set persistence.enabled=true --set networkPolicy.enabled=true \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true --set podDisruptionBudget.enabled=true \
            --set serviceMonitor.enabled=true --set security.jwtSecret=ci-secret \
            --set memory.enabled=true > /tmp/rendered/server-full.yaml
          # Operator chart: default and with TLS + CORS + diagnostics allowlist.
          helm template chatcli-operator deploy/helm/chatcli-operator \
            > /tmp/rendered/operator-default.yaml
          helm template chatcli-operator deploy/helm/chatcli-operator \
            --set serviceMonitor.enabled=true \
            --set security.corsAllowedOrigins[0]=https://dash.example.com \
            --set security.allowedDiagnosticCommands="kubectl top" \
            > /tmp/rendered/operator-full.yaml
          # Render-time rules of the server chart that a broken template
          # would lose silently.
          dep() { helm template chatcli deploy/helm/chatcli --set server.token=ci-token \
            --show-only templates/deployment.yaml "$@"; }
          count() { local pattern="$1"; shift; dep "$@" > /tmp/dep.yaml; grep -Ec "$pattern" /tmp/dep.yaml || true; }
          expect() { local want="$1" got="$2" what="$3"; [ "$got" = "$want" ] || { echo "::error::$what: got $got, want $want"; exit 1; }; }
          must_fail() { if dep "$@" >/dev/null 2>&1; then echo "::error::render should fail: $*"; exit 1; fi; }
          # The one-time memory adoption env: only with persistence, memory
          # and a memory subPath.
          env_re='name: CHATCLI_MEMORY_LEGACY_DIR'
          expect 1 "$(count "$env_re" --set memory.enabled=true)" "legacy memory env with memory on the PVC"
          expect 0 "$(count "$env_re")" "legacy memory env with memory off"
          expect 0 "$(count "$env_re" --set memory.enabled=true --set persistence.enabled=false)" "legacy memory env without persistence"
          expect 0 "$(count "$env_re" --set memory.enabled=true --set memory.subPath=)" "legacy memory env on the legacy layout"
          # A single-node sessions volume stops the old pod first.
          expect 1 "$(count 'maxSurge: 0')" "stop-first strategy"
          # Features enabled without a ConfigMap to mount mount nothing.
          expect 0 "$(count 'name: chatcli-(agents|skills|bootstrap)$' --set agents.enabled=true --set skills.enabled=true --set bootstrap.enabled=true)" "ConfigMap volumes with nothing to mount"
          # Mutually exclusive or unworkable inputs fail the render.
          must_fail --set security.jwtSecret=a --set security.jwtSecretRef.name=b --set security.jwtSecretRef.key=c
          must_fail --set 'persistence.accessModes[0]=ReadWriteOncePod' --set replicaCount=2
          must_fail --set logging.maxSizeMB=50
          # CRDs and CRs (Instance etc.) have no upstream JSON schema; the
          # rendered core objects (Deployment, Service, RBAC, ...) are checked
          # strictly. -strict rejects unknown fields, which is what catches a
          # typo in a template.
          kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered/*.yaml

