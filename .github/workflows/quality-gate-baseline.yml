name: Quality Gate · Baseline

# Publishes the total coverage % of main/develop as a GitHub commit status
# (`quality-gate/coverage`). The Quality Gate ratchet job in
# quality-gate.yml reads this status to compute the regression delta on a PR.
#
# Why a commit status? It is the cheapest authoritative store: no external
# service, no S3, no codecov dependency. Statuses are first-class GitHub
# objects and `gh api repos/.../commits/<sha>/statuses` is one call.

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-baseline:
    name: Publish coverage baseline
    runs-on: ubuntu-latest
    if: github.actor != 'release-please[bot]'
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install envtest binaries (operator integration suite)
        # The operator's integration tests need a real API server. The
        # binaries come from setup-envtest, pinned to the Kubernetes minor the
        # operator's client-go targets; KUBEBUILDER_ASSETS makes the suite run
        # instead of skip.
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.25
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.37.0 -p path)" >> "$GITHUB_ENV"

      - name: Run tests with coverage (root + operator merged)
        # -coverpkg=./... is intentional: the baseline must match the PR
        # ratchet methodology in quality-gate.yml. Without it the two
        # numbers measure different denominators and the ratchet would
        # ratchet against a moving target. See tools/qg/diffcover.
        #
        # Both modules merged into a single coverage.out so the published
        # baseline reflects the unified codebase.
        run: |
          go test -race -coverpkg=./... -coverprofile=coverage-root.out ./...
          ( cd operator && go test -race -coverpkg=./... -coverprofile=../coverage-operator.out ./... )
          head -1 coverage-root.out > coverage.out
          tail -n +2 coverage-root.out >> coverage.out
          tail -n +2 coverage-operator.out >> coverage.out
          go tool cover -func=coverage.out | tail -n 1

      - name: Compute total coverage
        id: cov
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/,"",$3); print $3 }')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"

      - name: Publish commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PCT: ${{ steps.cov.outputs.pct }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f context='quality-gate/coverage' \
            -f state='success' \
            -f description="coverage ${PCT}%"

      - name: Step summary
        env:
          PCT: ${{ steps.cov.outputs.pct }}
        run: |
          {
            echo "## Coverage baseline updated"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Total coverage: **${PCT}%**"
          } >> "$GITHUB_STEP_SUMMARY"
