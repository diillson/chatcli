name: Release on main (PR + GitHub Release)

on:
  push:
    branches:
      - main
  # Recovery path for a release that was published without its binaries
  # (a build step failed after release-please created the tag): rebuilds,
  # signs and uploads the release assets and updates Homebrew for an
  # existing tag, from that tag's source, without touching images, charts,
  # docs or the release itself.
  workflow_dispatch:
    inputs:
      assets_tag:
        description: "Existing release tag to (re)build and upload the binaries for, e.g. v1.221.0"
        required: true
        type: string

# Read-only by default. Every job below declares exactly what it needs, so a
# compromised step can only use the rights of its own job.
permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  release_please:
    name: Release Please (create PR and release)
    runs-on: ubuntu-latest
    # release-please-action queries GitHub's GraphQL API to fetch merge
    # commits and existing releases. That endpoint is occasionally flaky
    # ("Something went wrong while executing your query"), and a single
    # failure here aborts the whole release pipeline (build, docker,
    # helm, homebrew, docs sync). Retry up to three times, sleeping
    # between attempts, before giving up. The action is idempotent, so
    # a partial run that already created the release simply reports
    # release_created=false on the next attempt and we still flow into
    # the build job using the resolved tag.
    # release-please authenticates with GH_RELEASE_TOKEN, so the job token
    # itself needs no write access.
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.assets.outputs.tag_name || steps.rp1.outputs.tag_name || steps.rp2.outputs.tag_name || steps.rp3.outputs.tag_name }}
      release_created: ${{ steps.assets.outputs.release_created || steps.rp1.outputs.release_created || steps.rp2.outputs.release_created || steps.rp3.outputs.release_created }}
      # true on a manual assets run: only the binary jobs below run.
      assets_only: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Resolve the release to rebuild assets for
        id: assets
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS_TAG: ${{ inputs.assets_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$ASSETS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::assets_tag must look like v1.2.3, got '$ASSETS_TAG'"
            exit 1
          fi
          # Only an already published release: this path never creates one.
          gh release view "$ASSETS_TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null
          echo "tag_name=$ASSETS_TAG" >> "$GITHUB_OUTPUT"
          echo "release_created=true" >> "$GITHUB_OUTPUT"

      - name: Release Please (attempt 1/3)
        id: rp1
        if: github.event_name == 'push'
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Backoff before retry 2
        if: github.event_name == 'push' && steps.rp1.outcome == 'failure'
        run: sleep 30

      - name: Release Please (attempt 2/3)
        id: rp2
        if: github.event_name == 'push' && steps.rp1.outcome == 'failure'
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Backoff before retry 3
        if: github.event_name == 'push' && steps.rp1.outcome == 'failure' && steps.rp2.outcome == 'failure'
        run: sleep 60

      - name: Release Please (attempt 3/3)
        id: rp3
        if: github.event_name == 'push' && steps.rp1.outcome == 'failure' && steps.rp2.outcome == 'failure'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ---------------------------------------------------------------------------
  # Release binaries: build (no secrets) → sign checksums.txt (signing key
  # only) → upload (release token only). Each job holds one credential at
  # most, and nothing reaches the release until checksums.txt is signed, so
  # there is no window where a release carries checksums without signature.
  # ---------------------------------------------------------------------------
  build_binaries:
    name: Build release binaries
    needs: [release_please]
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release_please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          CGO_ENABLED: 0
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          VERSION="$TAG_NAME"
          LDFLAGS="-X 'github.com/diillson/chatcli/version.Version=${VERSION}' -X 'github.com/diillson/chatcli/version.CommitHash=${COMMIT_HASH}' -X 'github.com/diillson/chatcli/version.BuildDate=${BUILD_DATE}'"

          mkdir -p dist
          # Build the main package (.), never a single file: package main
          # spans several files, and `go build ./main.go` compiles main.go
          # alone (v1.221.0 shipped without binaries because of it).
          GOOS=linux   GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/chatcli-linux-amd64       .
          GOOS=darwin  GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/chatcli-darwin-amd64      .
          GOOS=darwin  GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/chatcli-darwin-arm64      .
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/chatcli-windows-amd64.exe .

          # checksums.txt alimenta a verificação SHA-256 do self-update
          # (update.SelfReplace) — sem ele, binários baixados não são verificáveis.
          cd dist
          sha256sum \
            chatcli-linux-amd64 \
            chatcli-darwin-amd64 \
            chatcli-darwin-arm64 \
            chatcli-windows-amd64.exe > checksums.txt
          cat checksums.txt

          ./chatcli-linux-amd64 --version || true

      - name: Upload binaries for signing and release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: |
            dist/chatcli-linux-amd64
            dist/chatcli-darwin-amd64
            dist/chatcli-darwin-arm64
            dist/chatcli-windows-amd64.exe
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  # Signs checksums.txt with the release Ed25519 key (secret
  # CHATCLI_RELEASE_SIGNING_KEY: standard base64 of the 32-byte seed). The
  # key is visible to one step only, the one that runs the signer; that step
  # runs a binary built from the release tag in the step before it, without
  # the key in its environment. The job token is read-only and the job holds
  # no other secret.
  sign_checksums:
    name: Sign checksums.txt (Ed25519)
    needs: [release_please, build_binaries]
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: dist

      - name: Check checksums.txt against the built binaries
        working-directory: dist
        run: sha256sum --strict -c checksums.txt

      - name: Build the release signer
        run: go build -o "$RUNNER_TEMP/releasesign" ./tools/releasesign

      - name: Sign checksums.txt
        env:
          CHATCLI_RELEASE_SIGNING_KEY: ${{ secrets.CHATCLI_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CHATCLI_RELEASE_SIGNING_KEY}" ]; then
            echo "::error::Secret CHATCLI_RELEASE_SIGNING_KEY is not set. Add the standard base64 of a 32-byte Ed25519 seed as a secret of the 'production' environment; the release is not published unsigned."
            exit 1
          fi
          cp dist/checksums.txt checksums.txt
          "$RUNNER_TEMP/releasesign" sign checksums.txt
          if [ ! -s checksums.txt.sig ]; then
            echo "::error::releasesign did not produce checksums.txt.sig"
            exit 1
          fi

      # The signature must verify against a public key the released binary
      # embeds, or self-update would refuse this release. A seed that does
      # not match update/release_keys.go stops the release here.
      - name: Verify the signature against the embedded release keys
        run: |
          set -euo pipefail
          keys=$(grep -oE '"[A-Za-z0-9+/]{43}="' update/release_keys.go | tr -d '"')
          if [ -z "$keys" ]; then
            echo "::error::update/release_keys.go embeds no release key"
            exit 1
          fi
          for k in $keys; do
            if "$RUNNER_TEMP/releasesign" verify checksums.txt checksums.txt.sig "$k"; then
              echo "checksums.txt.sig verifies against an embedded key"
              exit 0
            fi
          done
          echo "::error::checksums.txt.sig does not verify against any key in update/release_keys.go"
          exit 1

      - name: Upload signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checksums-signature
          path: checksums.txt.sig
          if-no-files-found: error
          retention-days: 7

  build_and_upload:
    name: Upload release assets
    needs: [release_please, build_binaries, sign_checksums]
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: production
    # Uploads go through GH_RELEASE_TOKEN; the job token only reads.
    permissions:
      contents: read
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: dist

      - name: Download checksums signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-checksums-signature
          path: dist

      - name: Check checksums.txt against the binaries being published
        working-directory: dist
        run: sha256sum --strict -c checksums.txt

      - name: Wait for release availability
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          for i in {1..18}; do
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "Release $TAG_NAME disponível."
              break
            fi
            echo "Aguardando release ficar disponível ($i/18)..."
            sleep 5
          done

      - name: Upload assets with retry
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          files=(
            chatcli-linux-amd64
            chatcli-darwin-amd64
            chatcli-darwin-arm64
            chatcli-windows-amd64.exe
            checksums.txt
            checksums.txt.sig
          )
          for f in "${files[@]}"; do
            uploaded=false
            for attempt in {1..4}; do
              if gh release upload "$TAG_NAME" "$f" --clobber; then
                echo "Enviado: $f"
                uploaded=true
                break
              fi
              echo "Falha ao enviar $f (tentativa $attempt). Retentando..."
              sleep $((attempt*5))
            done
            if [ "$uploaded" != "true" ]; then
              echo "::error::Upload of $f to release $TAG_NAME failed after 4 attempts"
              exit 1
            fi
          done

  # ---------------------------------------------------------------------------
  # ChatCLI Docker: native per-arch builds (no QEMU) → Trivy gate → merge manifest → sign
  # ---------------------------------------------------------------------------
  docker_chatcli_build:
    name: "Build ChatCLI (${{ matrix.arch }})"
    needs: [release_please]
    if: needs.release_please.outputs.release_created == 'true' && needs.release_please.outputs.assets_only != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/diillson/chatcli

      # no-cache + fresh apk metadata: GHA layer caching reused stale OS
      # packages between releases (e.g. CVE-2026-27135 nghttp2-libs slipped
      # through because the cached layer's `apk add` ran before the fix
      # landed in the Alpine mirror). Image-Refresh already runs without
      # cache and emits provenance/SBOM; we mirror those flags here so a
      # release publishes the same hardened image instead of leaving it
      # to the next drift-remediation cycle. Trade-off: ~2-5 min slower
      # per arch, acceptable for a tag-triggered job.
      # The server reports this version over GetServerInfo/Health, which the
      # operator surfaces as the Instance status.serverVersion.
      - name: Build metadata
        id: buildmeta
        env:
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          {
            echo "version=${TAG_NAME}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.buildmeta.outputs.version }}
            COMMIT_HASH=${{ steps.buildmeta.outputs.commit }}
            BUILD_DATE=${{ steps.buildmeta.outputs.date }}
          outputs: type=image,name=ghcr.io/diillson/chatcli,push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          provenance: true
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chatcli-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker_chatcli_trivy:
    name: "Trivy scan — ChatCLI"
    needs: [release_please, docker_chatcli_build]
    if: needs.release_please.outputs.release_created == 'true' && needs.release_please.outputs.assets_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout (for .trivyignore.yaml)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release_please.outputs.tag_name }}
          sparse-checkout: .trivyignore.yaml

      - name: Download amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chatcli-digest-amd64
          path: /tmp/digests

      - name: Resolve digest
        id: digest
        run: echo "sha=sha256:$(ls /tmp/digests)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy gate (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/diillson/chatcli@${{ steps.digest.outputs.sha }}"
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          scanners: vuln
          exit-code: '1'

  docker_chatcli_merge:
    name: "Merge & Sign — ChatCLI manifest"
    needs: [release_please, docker_chatcli_build, docker_chatcli_trivy]
    if: needs.release_please.outputs.release_created == 'true' && needs.release_please.outputs.assets_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download all digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: chatcli-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/diillson/chatcli
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release_please.outputs.tag_name }}
            type=raw,value=latest

      - name: Create multi-arch manifest and push
        id: manifest
        working-directory: /tmp/digests
        env:
          REF: ghcr.io/diillson/chatcli
          META_JSON: ${{ steps.meta.outputs.json }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON") \
            $(printf "${REF}@sha256:%s " *)
          # The signature goes on the digest just pushed: a tag can be moved
          # between this step and the signature, a digest cannot.
          DIGEST=$(docker buildx imagetools inspect "${REF}:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve the manifest digest of ${REF}:${VERSION}"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign manifest by digest with Cosign (keyless OIDC)
        env:
          REF: ghcr.io/diillson/chatcli
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --recursive "${REF}@${DIGEST}"

  # ---------------------------------------------------------------------------
  # Operator Docker: native per-arch builds (no QEMU) → Trivy gate → merge manifest → sign
  # ---------------------------------------------------------------------------
  docker_operator_build:
    name: "Build Operator (${{ matrix.arch }})"
    needs: [release_please]
    if: needs.release_please.outputs.release_created == 'true' && needs.release_please.outputs.assets_only != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/diillson/chatcli-operator

      # See chatcli build above: no-cache+provenance+SBOM matches the
      # Image-Refresh path so the operator image (Alpine-based, exposed
      # to OS-package CVEs) ships fresh apk versions on every release
      # instead of inheriting whatever the GHA cache layer captured.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./operator/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/diillson/chatcli-operator,push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          provenance: true
          sbom: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker_operator_trivy:
    name: "Trivy scan — Operator"
    needs: [release_please, docker_operator_build]
    if: needs.release_please.outputs.release_created == 'true' && needs.release_please.outputs.assets_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout (for .trivyignore.yaml)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release_please.outputs.tag_name }}
          sparse-checkout: .trivyignore.yaml

      - name: Download amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: operator-digest-amd64
          path: /tmp/digests

      - name: Resolve digest
        id: digest
        run: echo "sha=sha256:$(ls /tmp/digests)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy gate (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/diillson/chatcli-operator@${{ steps.digest.outputs.sha }}"
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          scanners: vuln
          exit-code: '1'

  docker_operator_merge:
    name: "Merge & Sign — Operator manifest"
    needs: [release_please, docker_operator_build, docker_operator_trivy]
    if: needs.release_please.outputs.release_created == 'true' && needs.release_please.outputs.assets_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download all digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: operator-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/diillson/chatcli-operator
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release_please.outputs.tag_name }}
            type=raw,value=latest

      - name: Create multi-arch manifest and push
        id: manifest
        working-directory: /tmp/digests
        env:
          REF: ghcr.io/diillson/chatcli-operator
          META_JSON: ${{ steps.meta.outputs.json }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON") \
            $(printf "${REF}@sha256:%s " *)
          # The signature goes on the digest just pushed: a tag can be moved
          # between this step and the signature, a digest cannot.
          DIGEST=$(docker buildx imagetools inspect "${REF}:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve the manifest digest of ${REF}:${VERSION}"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign manifest by digest with Cosign (keyless OIDC)
        env:
          REF: ghcr.io/diillson/chatcli-operator
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --recursive "${REF}@${DIGEST}"

  # Atualiza a formula do Homebrew tap após upload dos binários
  update_homebrew:
    name: Update Homebrew Formula
    needs: [release_please, build_and_upload]
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Pushes to the tap with GH_RELEASE_TOKEN (kept by the checkout for the
    # final git push); the job token only reads.
    permissions:
      contents: read
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: diillson/homebrew-chatcli
          token: ${{ secrets.GH_RELEASE_TOKEN }}

      - name: Download release assets and compute SHA256
        env:
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VER="${TAG_NAME#v}"

          echo "Downloading binaries for v${VER}..."

          for attempt in {1..6}; do
            if curl -sfL -o chatcli-darwin-arm64 \
              "https://github.com/diillson/chatcli/releases/download/v${VER}/chatcli-darwin-arm64"; then
              break
            fi
            echo "Waiting for assets to be available (attempt $attempt/6)..."
            sleep 10
          done

          curl -sfL -o chatcli-darwin-amd64 \
            "https://github.com/diillson/chatcli/releases/download/v${VER}/chatcli-darwin-amd64"
          curl -sfL -o chatcli-linux-amd64 \
            "https://github.com/diillson/chatcli/releases/download/v${VER}/chatcli-linux-amd64"

          echo "SHA_DARWIN_ARM64=$(sha256sum chatcli-darwin-arm64 | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "SHA_DARWIN_AMD64=$(sha256sum chatcli-darwin-amd64 | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "SHA_LINUX_AMD64=$(sha256sum chatcli-linux-amd64 | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "VER=${VER}" >> "$GITHUB_ENV"

      - name: Generate formula
        run: |
          cat > Formula/chatcli.rb << 'ENDOFFORMULA'
          # typed: false
          # frozen_string_literal: true

          # Homebrew formula for ChatCLI
          # Repository: https://github.com/diillson/chatcli
          class Chatcli < Formula
            desc "Command-line interface for interacting with multiple LLM providers"
            homepage "https://chatcli.edilsonfreitas.com"
            license "Apache-2.0"
          ENDOFFORMULA

          # Append version and platform blocks with shell variable expansion
          cat >> Formula/chatcli.rb << ENDOFFORMULA
            version "${VER}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/diillson/chatcli/releases/download/v#{version}/chatcli-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"

                def install
                  bin.install "chatcli-darwin-arm64" => "chatcli"
                end
              elsif Hardware::CPU.intel?
                url "https://github.com/diillson/chatcli/releases/download/v#{version}/chatcli-darwin-amd64"
                sha256 "${SHA_DARWIN_AMD64}"

                def install
                  bin.install "chatcli-darwin-amd64" => "chatcli"
                end
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "https://github.com/diillson/chatcli/releases/download/v#{version}/chatcli-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"

                def install
                  bin.install "chatcli-linux-amd64" => "chatcli"
                end
              end
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/chatcli --version 2>&1", 0)
            end
          end
          ENDOFFORMULA

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/chatcli.rb

      - name: Commit and push formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/chatcli.rb
          git diff --cached --quiet && echo "Formula already up to date" && exit 0
          git commit -m "chore: update chatcli formula to v${VER}"
          git push

  helm_charts:
    name: Publish Helm Charts to GHCR (OCI)
    needs: [release_please]
    if: needs.release_please.outputs.release_created == 'true' && needs.release_please.outputs.assets_only != 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Login to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.repository_owner }}
        run: echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Install ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Login to GHCR with ORAS
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.repository_owner }}
        run: echo "$REGISTRY_TOKEN" | oras login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Update chart versions
        env:
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"

          # Update chatcli server chart
          sed -i "s/^version:.*/version: ${VERSION}/" deploy/helm/chatcli/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" deploy/helm/chatcli/Chart.yaml

          # Update chatcli-operator chart
          sed -i "s/^version:.*/version: ${VERSION}/" deploy/helm/chatcli-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" deploy/helm/chatcli-operator/Chart.yaml

      - name: Inject ArtifactHub changelog from CHANGELOG.md
        run: |
          bash scripts/generate-artifacthub-changelog.sh \
            deploy/helm/chatcli/Chart.yaml \
            deploy/helm/chatcli-operator/Chart.yaml

      - name: Package charts
        env:
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          mkdir -p /tmp/charts
          helm package deploy/helm/chatcli/ -d /tmp/charts/
          helm package deploy/helm/chatcli-operator/ -d /tmp/charts/
          ls -la /tmp/charts

      - name: Push chatcli chart
        env:
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          helm push "/tmp/charts/chatcli-${VERSION}.tgz" oci://ghcr.io/diillson/charts

      - name: Push chatcli-operator chart
        env:
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          helm push "/tmp/charts/chatcli-operator-${VERSION}.tgz" oci://ghcr.io/diillson/charts

      - name: Login to GHCR with crane
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.repository_owner }}
        run: echo "$REGISTRY_TOKEN" | crane auth login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Sign chatcli chart with Cosign (keyless OIDC)
        env:
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          CHART_DIGEST=$(crane digest "ghcr.io/diillson/charts/chatcli:${VERSION}")
          cosign sign --yes "ghcr.io/diillson/charts/chatcli@${CHART_DIGEST}"

      - name: Sign chatcli-operator chart with Cosign (keyless OIDC)
        env:
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          CHART_DIGEST=$(crane digest "ghcr.io/diillson/charts/chatcli-operator:${VERSION}")
          cosign sign --yes "ghcr.io/diillson/charts/chatcli-operator@${CHART_DIGEST}"

      - name: Push Artifact Hub metadata for chatcli
        run: |
          oras push \
            ghcr.io/diillson/charts/chatcli:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub/chatcli-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Push Artifact Hub metadata for chatcli-operator
        run: |
          oras push \
            ghcr.io/diillson/charts/chatcli-operator:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub/chatcli-operator-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  # Atualiza versões na documentação (chatcli.ai) automaticamente
  update_docs_version:
    name: Update docs version (chatcli.ai)
    needs: [release_please]
    if: needs.release_please.outputs.release_created == 'true' && needs.release_please.outputs.assets_only != 'true'
    runs-on: ubuntu-latest
    # Pushes to the docs repository with GH_RELEASE_TOKEN (kept by its
    # checkout for the final git push); the job token only reads.
    permissions:
      contents: read
    steps:
      - name: Checkout docs repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: diillson/chatcli.ai
          token: ${{ secrets.GH_RELEASE_TOKEN }}

      - name: Checkout chatcli source (for CHANGELOG.md)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _chatcli_src
          fetch-depth: 1
          persist-credentials: false

      - name: Update version references
        env:
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          # Always remove the embedded chatcli checkout, even on early-exit
          # paths. Without this, an early "exit 0" below leaves _chatcli_src
          # in the work tree and the next "git add -A" step commits it as
          # a stray gitlink (mode 160000).
          trap 'rm -rf _chatcli_src' EXIT

          NEW_VERSION="${TAG_NAME#v}"
          OLD_VERSION=$(cat VERSION | tr -d '[:space:]')

          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "Versão já está atualizada ($NEW_VERSION). Nada a fazer."
            exit 0
          fi

          echo "Atualizando versão: $OLD_VERSION -> $NEW_VERSION"

          # 1) Current-release references in MDX (image tags, helm
          #    --version rows, install URLs, sample output). Scoped to
          #    code spans, code fences, bold spans and URLs: a version
          #    quoted in running prose ("As of v1.2.3 …") is history and
          #    must not follow the release train. The release-notes pages
          #    are left out: each one names its own version and links to
          #    its own tag, and step 2 regenerates them anyway.
          find . \( -path ./_chatcli_src -o -path ./releases -o -path ./pt/releases \) -prune \
              -o -name "*.mdx" -print0 \
            | OLD_VERSION="$OLD_VERSION" NEW_VERSION="$NEW_VERSION" \
              xargs -0 perl _chatcli_src/scripts/docs/bump-version.pl

          # 2) Release notes, from release-please's CHANGELOG.md: one page
          #    per release (releases/<version>, EN and pt), the index at
          #    /releases, the "New release" strip on the home pages and the
          #    Releases sidebar group with the newest version as its badge.
          #    The script rewrites all of it on every run, so it is
          #    idempotent and also fixes any page edited by hand.
          python3 _chatcli_src/scripts/docs/gen-release-notes.py \
            --changelog _chatcli_src/CHANGELOG.md --docs .

          # 3) VERSION file
          echo "$NEW_VERSION" > VERSION

          # 4) Cleanup the source checkout so it does not get committed
          rm -rf _chatcli_src

          echo "Arquivos alterados:"
          git diff --name-only

      - name: Commit and push
        env:
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          NEW_VERSION="${TAG_NAME#v}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet && echo "Nenhuma alteração para commitar." && exit 0

          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push

  # Opcional: sincroniza main -> develop após publicar a release
  sync_main_to_develop:
    needs: [release_please]
    if: needs.release_please.outputs.release_created == 'true' && needs.release_please.outputs.assets_only != 'true'
    runs-on: ubuntu-latest
    # The only job that writes with the job token: it force-pushes develop
    # using the credentials the checkout below keeps.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Kept: the force-push to develop below authenticates with it.
          persist-credentials: true

      - name: Configura usuário git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync release-please from main to develop (rebase)
        run: |
          git checkout develop
          # Pega o último commit da main (que é o do release-please)
          # last_commit=$(git log origin/main -1 --pretty=format:%H)
          
          # Aplica esse commit na develop como squash
          # git cherry-pick -n $last_commit || true
          git fetch origin

          # Cria um commit único na develop com a mensagem da release
          # msg=$(git log -1 --pretty=%B $last_commit)
          # git commit -m "chore(sync): propagate release-please changes - $msg" || echo "Nada para commitar"
          git reset --hard origin/main

          git push --force
