# golangci-lint config for chatcli (golangci-lint v2 format).
#
# Strategy: enable the linters whose findings have caught real bugs in
# the past (errcheck/govet/staticcheck/revive) plus a few quality-of-life
# ones (misspell, unconvert, prealloc). The legacy backlog is fully paid
# down (misspell in PR #1055, errorlint/prealloc/gocyclo/revive/
# contextcheck in #1056, the remainder — root and operator — in the
# change that removed --new-from-rev), so CI enforces the FULL module on
# every PR: `golangci-lint run ./...` must stay at zero findings in both
# modules. New debt fails the gate immediately instead of accumulating
# outside PR diffs.

version: "2"

run:
  go: "1.27"

linters:
  # Disable defaults explicitly so the enabled set is auditable.
  default: none
  enable:
    # Defaults — proven worth across the codebase.
    - errcheck
    - govet
    - ineffassign
    # staticcheck in v2 also carries the former gosimple (S1*) checks
    # plus the style (ST*) and quickfix (QF*) families; see settings.
    - staticcheck
    - unused
    # Doc-comments on exported identifiers (revive's `exported` rule).
    - revive
    # Catches misspellings in identifiers, strings and comments. Cheap
    # and surprisingly effective on AI-generated code.
    - misspell
    # Detects useless type conversions (`int(int(x))`, etc.). Tiny
    # readability win, surfaces lazy generic instantiations.
    - unconvert
    # Suggests pre-allocating slices when the size is known. The
    # streaming hot paths in cli/agent_mode.go and llm/* push enough
    # bytes that this is worth catching.
    - prealloc
    # Forces error wrapping with %w instead of %s/%v, which preserves
    # errors.Is/As at the call site.
    - errorlint
    # Catches http.Response.Body left open — common LLM client mistake.
    - bodyclose
    # Detects context.Context not being propagated correctly into
    # downstream calls. Several recent provider clients had this issue.
    - contextcheck
    # Cyclomatic complexity at the linter level (Floor 8 is finer-grained
    # diff-only; keep this here as a defense-in-depth signal).
    - gocyclo
  settings:
    staticcheck:
      # golangci-lint's default set: every SA/S1/ST/QF check except the
      # six doc-comment and naming style rules (ST1000, ST1003, ST1016,
      # ST1020, ST1021, ST1022) that golangci disables out of the box.
      # Quickfix (QF*) and the remaining style (ST*) checks are new
      # relative to the v1 gate and were paid down in PR #1597.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocyclo:
      min-complexity: 30
    misspell:
      locale: US
      ignore-rules:
        - alternar
        - argumentos
        - autor
        - calcular
        - cancelled
        - cancelling
        - clientes
        - comando
        - comandos
        - contextos
        - correspondente
        - devolvendo
        - duplicatas
        - eles
        - essencial
        - exclusivos
        - exponencial
        - instal
        - operacional
        - presentes
        - prestes
        - problemas
        - processos
        - profissional
        - progresso
        - resolvemos
        - sucess
        - tradicional
        - validade
        - variantes
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    revive:
      severity: warning
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: redefines-builtin-id
        - name: empty-block
        - name: superfluous-else
        - name: confusing-naming
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: receiver-naming
        - name: unreachable-code
        - name: blank-imports
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gocyclo
          - prealloc
          - revive
        path: _test\.go
      - linters:
          - revive
        path: tools/qg/cmd/.*main\.go
        text: package-comments
    paths:
      - vendor
      - tools/docgen
      - proto
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
