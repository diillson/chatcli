# ChatCLI Operator Helm Chart - Default Values

replicaCount: 1

image:
  repository: ghcr.io/diillson/chatcli-operator
  # tag defaults to Chart.appVersion when empty — ensures version consistency.
  # Override with --set image.tag=custom if needed.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Leader election (recommended for HA with replicaCount > 1)
leaderElect: true

# AIOps REST API and Web Dashboard
api:
  # Port for the REST API and embedded web dashboard
  port: 8090

# Prometheus metrics endpoint
metrics:
  # Port for Prometheus metrics scraping
  port: 8080

# Health probes
health:
  port: 8081

# Prometheus URL for metrics collection during incident analysis.
# When set, the operator queries Prometheus for CPU/memory/latency/error rate
# trends correlated with incidents, providing quantitative context to the AI.
# Example: "http://prometheus-server.monitoring.svc:9090"
prometheusUrl: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# RBAC - the operator always needs cluster-wide access
rbac:
  create: true

# CRD lifecycle management.
#
# Helm only applies files from the chart's crds/ directory on first install —
# `helm upgrade` skips them by design (Helm 3 hard restriction). That leaves
# operators upgrading between chart versions running the new controller binary
# against the OLD CRD schema, which surfaced as GAP-06 in the 2026-05-23 chaos
# test (chart 1.121.0 -> 1.122.0 introduced the IssueState Contained and the
# PostMortemSpec.RequiresHumanAction/RequiredAction fields in the binary but
# users upgrading saw "Unsupported value: Contained" rejections from the API
# server because the cluster still carried the 1.121.0 CRD schema).
#
# This block controls the pre-install/pre-upgrade hook that re-applies every
# CRD shipped with the chart so the schema is always in sync with the binary.
# Disable only if you manage CRDs out of band (separate cert-manager-crds-style
# chart, GitOps with explicit CRD application, etc.).
crdUpgrade:
  enabled: true
  # Image used by the pre-upgrade Job to run `kubectl apply`. Defaults to the
  # OFFICIAL Kubernetes-project kubectl image at registry.k8s.io — versioned
  # in lockstep with the Kubernetes release, distroless (no shell, no package
  # manager), and signed/SBOM'd by the project. Avoid pinning the tag to a
  # major-minor stub like "v1.31" — that is NOT a valid manifest reference;
  # the registry only resolves fully-qualified patch tags like "v1.31.10".
  # Override only for air-gapped mirrors.
  image:
    repository: registry.k8s.io/kubectl
    tag: "v1.31.10"
    pullPolicy: IfNotPresent
  # Pod resource limits for the hook Job. Defaults keep it lightweight — the
  # job is short-lived (typically <30s) and only runs kubectl apply.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Tolerations on the hook Job so it can run on tainted control-plane nodes
  # during cluster-wide chart upgrades. Empty by default.
  tolerations: []
  # NodeSelector for the hook Job. Empty by default.
  nodeSelector: {}

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# How the operator receives watcher alerts from the ChatCLI server.
# "stream" keeps a StreamAlerts stream open and falls back to polling only
# while the server has no such RPC; "poll" queries GetAlerts every 30s.
alertTransport: stream

# Decision engine: before a RemediationPlan executes, adjust the AI
# confidence by history, pattern matches, time of day, concurrent issues
# and severity, and park the plan for a human unless confidence and severity
# allow it. A namespace with 3 failed remediations in an hour trips a
# circuit breaker that parks everything. Off by default: ApprovalPolicies
# are then the only gate.
decisionEngine:
  enabled: false

# Name of this cluster's ClusterRegistration. When set, the registration's
# tier decides which severities wait for a human: critical clusters always,
# standard clusters for critical and high, non-critical clusters never. A
# name that no ClusterRegistration carries (by name or displayName) sends
# every plan to manual approval until the registration exists.
clusterName: ""

# Security hardening configuration for the operator
security:
  # Dev mode disables authentication on the REST API (NEVER use in production)
  devMode: false
  # TLS (1.3) for the REST API and dashboard (port 8090). Paths inside the
  # container: mount the Secret with extraVolumes + extraVolumeMounts.
  apiTLS:
    certFile: ""  # CHATCLI_AIOPS_TLS_CERT
    keyFile: ""   # CHATCLI_AIOPS_TLS_KEY
  # Operator-wide TLS material for dialing ChatCLI servers (the operator
  # always dials TLS 1.3). Per-Instance settings win: caFile is only used
  # when the Instance's TLS Secret has no ca.crt, certFile/keyFile only when
  # the Instance sets no operatorClientCertSecretName. Absolute paths inside
  # the container: mount them with extraVolumes + extraVolumeMounts.
  grpcTLS:
    certFile: ""  # CHATCLI_GRPC_TLS_CERT
    keyFile: ""   # CHATCLI_GRPC_TLS_KEY
    caFile: ""    # CHATCLI_GRPC_TLS_CA
  # Extra resource kinds remediation may touch (comma-separated), added to
  # the 17 built-in defaults
  allowedResourceTypes: ""
  # Custom log scrub patterns (comma-separated regexes)
  logScrubPatterns: ""
  # Extra read-only diagnostic commands the remediation engine may run
  # (comma-separated; appended to the built-in allowlist). Read by the
  # operator process, so it is set here, not on the Instance.
  allowedDiagnosticCommands: ""
  # CORS allowed origin (empty = deny all)
  # CORS for the operator REST API (dashboard). Deny-all until an origin is
  # named: with none, a browser blocks every cross-origin call.
  corsOrigin: ""                # a single origin (kept for compatibility)
  corsAllowedOrigins: []        # several origins, or ["*"] for any
  #   - "https://dashboard.example.com"
  corsAllowedMethods: []        # defaults to GET, POST, PUT, DELETE, OPTIONS
  corsAllowCredentials: false   # cookies / Authorization on cross-origin calls
  # DEPRECATED, ignored. The operator no longer writes a file audit log (it
  # records its actions as AuditEvent resources) and nothing reads
  # CHATCLI_AUDIT_LOG_PATH any more. Kept only so existing values files
  # keep validating; the chart no longer renders it.
  auditLogPath: ""

# API keys for the REST API and web dashboard (header X-API-Key).
# The operator reads them from the Secret "chatcli-operator-secrets"
# (key "api-keys") in its own namespace — the name is fixed — and re-reads
# it every 30 seconds. Without keys (and without security.devMode) every
# /api/ call is rejected with 401.
# With create=true the chart renders that Secret from entries. Leave it
# false to manage the Secret yourself (kubectl, External Secrets, Vault…);
# note that keys set here are stored in the Helm release.
# Roles: viewer (read), operator (acknowledge/approve/…), admin (all).
# name (optional) is the identity recorded on the approval decisions the key
# takes (falls back to description, then to a fingerprint of the key). A
# quorum counts each key once, so give each approver their own key.
# Deleting the Secret (and the ConfigMap) revokes every key on the next poll.
apiKeys:
  create: false
  entries: []
  # - key: "<generate with: openssl rand -hex 32>"
  #   role: admin
  #   name: alice
  #   description: platform team

# Optional NetworkPolicy for the operator pod (off by default).
networkPolicy:
  enabled: false
  # Peers (NetworkPolicyPeer list) allowed to reach the REST API/dashboard
  # and the metrics port. Empty = any source.
  apiIngressFrom: []
  metricsIngressFrom: []
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: monitoring
  # "restricted" allows egress only to DNS (53), HTTPS (443), the Kubernetes
  # API (kubernetesApiPort), the Instances' gRPC port and — when
  # prometheusUrl names one — the Prometheus port. "allowAll" leaves egress
  # open. Add egressExtraPorts for SMTP notifications (587/465), git over
  # SSH (22) or webhooks on other ports.
  egress: restricted        # restricted | allowAll
  kubernetesApiPort: 6443
  instanceGrpcPort: 50051
  egressExtraPorts: []
  #   - port: 587
  #     protocol: TCP

# Extra environment variables for the operator pod
extraEnv: []
# - name: CHATCLI_ALLOWED_RESOURCE_TYPES
#   value: "Deployment,Service,ConfigMap,HPA"

# Extra volumes for the pod and mounts for the manager container, e.g. the
# Secrets behind security.apiTLS.* and security.grpcTLS.* paths.
extraVolumes: []
# - name: api-tls
#   secret:
#     secretName: chatcli-operator-api-tls
extraVolumeMounts: []
# - name: api-tls
#   mountPath: /etc/chatcli-operator/api-tls
#   readOnly: true
# ...then: security.apiTLS.certFile: /etc/chatcli-operator/api-tls/tls.crt
#          security.apiTLS.keyFile:  /etc/chatcli-operator/api-tls/tls.key

# Writable /tmp for the operator pod (emptyDir; the root filesystem is
# read-only). SourceRepository clones (shallow, depth 50) and the per-sync
# git credential files live there; raise the limit for large repositories.
tmpVolume:
  sizeLimit: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

# Prometheus ServiceMonitor (requires Prometheus Operator)
serviceMonitor:
  enabled: false
  interval: "30s"
  scrapeTimeout: ""
  labels: {}
