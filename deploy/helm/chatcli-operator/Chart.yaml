apiVersion: v2
name: chatcli-operator
description: >-
  ChatCLI AIOps Operator - Autonomous incident detection, AI analysis, and
  remediation for Kubernetes
type: application
version: 1.213.1
appVersion: 1.213.1
home: https://chatcli.edilsonfreitas.com
sources:
  - https://github.com/diillson/chatcli
icon: https://chatcli.edilsonfreitas.com/images/icon-artifacthub.svg
keywords:
  - chatcli
  - operator
  - aiops
  - kubernetes
  - remediation
  - incident-management
  - sre
  - observability
  - chaos-engineering
maintainers:
  - name: Edilson Freitas
    email: diillson@hotmail.com
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: 'false'
  artifacthub.io/changes: |
    - kind: added
      description: apiKeys.create and apiKeys.entries render the chatcli-operator-secrets Secret the REST API and dashboard read their keys from
    - kind: added
      description: Optional NetworkPolicy for the operator pod behind networkPolicy.enabled
    - kind: added
      description: extraVolumes and extraVolumeMounts, to mount the Secrets behind security.apiTLS and security.grpcTLS paths
    - kind: deprecated
      description: security.auditLogPath is ignored; the operator no longer reads CHATCLI_AUDIT_LOG_PATH and the chart stopped rendering it
    - kind: fixed
      description: NOTES and README point security.allowedDiagnosticCommands at the operator, and state that Instances need a credential and TLS
    - kind: fixed
      description: README, NOTES and values describe the REST API on every replica, its rate limits, API key names and revocation, the fail-closed approval gate, the 16 default remediation kinds, the 5 runnable chaos types and the Instance probes, conditions and rollouts
    - kind: fixed
      description: The ServiceLevelObjective and ChaosExperiment examples validate against the current CRDs and no longer set fields the operator rejects or ignores
  artifacthub.io/prerelease: 'false'
  artifacthub.io/operator: 'true'
  artifacthub.io/operatorCapabilities: Seamless Upgrades
  artifacthub.io/crds: |
    - kind: AIInsight
      version: v1alpha1
      description: AI-generated analysis and recommendations for detected issues
    - kind: Anomaly
      version: v1alpha1
      description: Raw signal from watchers before correlation into issues
    - kind: ApprovalPolicy
      version: v1alpha1
      description: Approval requirements for remediation actions
    - kind: ApprovalRequest
      version: v1alpha1
      description: Pending approval for a remediation action
    - kind: AuditEvent
      version: v1alpha1
      description: Immutable record of an action in the AIOps platform
    - kind: ChaosExperiment
      version: v1alpha1
      description: Chaos engineering experiment targeting a Kubernetes resource
    - kind: ClusterRegistration
      version: v1alpha1
      description: Registered Kubernetes cluster for multi-cluster federation
    - kind: EscalationPolicy
      version: v1alpha1
      description: Escalation chains for incident management
    - kind: IncidentSLA
      version: v1alpha1
      description: SLA targets for incident response and resolution by severity
    - kind: Instance
      version: v1alpha1
      description: ChatCLI instance configuration
    - kind: Issue
      version: v1alpha1
      description: Detected problem in the cluster
    - kind: NotificationPolicy
      version: v1alpha1
      description: Notification delivery rules and channels
    - kind: PostMortem
      version: v1alpha1
      description: Full incident lifecycle captured after resolution
    - kind: RemediationPlan
      version: v1alpha1
      description: Remediation attempt for an Issue
    - kind: Runbook
      version: v1alpha1
      description: Operational procedures linked to issue types
    - kind: ServiceLevelObjective
      version: v1alpha1
      description: Service level objective with burn rate alerting
    - kind: SourceRepository
      version: v1alpha1
      description: Links a Kubernetes workload to its source code repository for code-aware incident analysis
  artifacthub.io/crdsExamples: |
    - apiVersion: platform.chatcli.io/v1alpha1
      kind: Instance
      metadata:
        name: chatcli
        namespace: chatcli
      spec:
        provider: CLAUDEAI
        apiKeys:
          name: chatcli-api-keys
        server:
          token:
            name: chatcli-server-token
            key: token
          tls:
            enabled: true
            secretName: chatcli-tls
    - apiVersion: platform.chatcli.io/v1alpha1
      kind: Issue
      metadata:
        name: payments-api-high-error-rate
        namespace: production
      spec:
        severity: high
        source: prometheus
        description: "Error rate for payments-api exceeded 15% over the last 5 minutes"
        resource:
          kind: Deployment
          name: payments-api
          namespace: production
    - apiVersion: platform.chatcli.io/v1alpha1
      kind: ApprovalPolicy
      metadata:
        name: production-approval
        namespace: production
      spec:
        enabled: true
        defaultMode: manual
        rules:
          - name: critical-manual
            match:
              severities: ["critical", "high"]
              actionTypes: ["RestartDeployment", "ScaleDeployment", "RollbackDeployment"]
            mode: manual
            timeoutMinutes: 15
          - name: low-severity-auto
            match:
              severities: ["low", "medium"]
              actionTypes: ["RestartDeployment"]
            mode: auto
            timeoutMinutes: 30
            autoApproveConditions:
              minConfidence: 0.85
              maxSeverity: medium
              historicalSuccessRate: 0.9
    - apiVersion: platform.chatcli.io/v1alpha1
      kind: ServiceLevelObjective
      metadata:
        name: api-availability
        namespace: production
      spec:
        enabled: true
        serviceName: api-server
        indicator:
          type: availability
          metricSource: issues
        target:
          percentage: 99.9
          window: 30d
    - apiVersion: platform.chatcli.io/v1alpha1
      kind: ChaosExperiment
      metadata:
        name: api-pod-failure
        namespace: chaos-testing
      spec:
        enabled: true
        experimentType: pod_failure
        target:
          kind: Deployment
          name: api-server
          namespace: production
        duration: 5m
        dryRun: true
        safetyChecks:
          minHealthyPods: 1
          abortOnIssueDetected: true
  artifacthub.io/links: |
    - name: Documentation
      url: https://chatcli.edilsonfreitas.com
    - name: Operator guide
      url: https://chatcli.edilsonfreitas.com/features/k8s-operator
    - name: Source
      url: https://github.com/diillson/chatcli
  artifacthub.io/maintainers: |
    - name: Edilson Freitas
      email: diillson@hotmail.com
