{{- if .Values.apiKeys.create }}
{{- if not .Values.apiKeys.entries }}
{{- fail "apiKeys.create=true needs at least one apiKeys.entries item ({key, role})" }}
{{- end }}
{{- /*
  The operator loads REST/dashboard API keys from a Secret with this FIXED
  name in its own namespace (key "api-keys", a YAML list of
  {key, role, name, description}) and re-reads it every 30s. The name cannot be
  templated: the operator looks for exactly "chatcli-operator-secrets".
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: chatcli-operator-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chatcli-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
type: Opaque
stringData:
  api-keys: |
    {{- range .Values.apiKeys.entries }}
    - key: {{ required "apiKeys.entries[].key is required" .key | quote }}
      role: {{ required "apiKeys.entries[].role is required" .role | quote }}
      {{- with .name }}
      name: {{ . | quote }}
      {{- end }}
      {{- with .description }}
      description: {{ . | quote }}
      {{- end }}
    {{- end }}
{{- end }}
