{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "chatcli.fullname" . }}
  labels:
    {{- include "chatcli.labels" . | nindent 4 }}
  {{- /*
    The nginx defaults sit under the user's annotations: a key the user sets
    (backend-protocol GRPCS for a TLS listener, say) replaces the default
    instead of rendering the same annotation twice.
  */}}
  {{- $annotations := dict }}
  {{- if eq .Values.ingress.className "nginx" }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/backend-protocol" "GRPC" }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/ssl-redirect" "true" }}
  {{- end }}
  {{- $annotations = merge (deepCopy (.Values.ingress.annotations | default dict)) $annotations }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "chatcli.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
