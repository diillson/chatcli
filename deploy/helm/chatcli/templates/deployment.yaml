apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chatcli.fullname" . }}
  labels:
    {{- include "chatcli.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "chatcli.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "chatcli.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chatcli.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.plugins.enabled .Values.plugins.initImage }}
      initContainers:
        - name: plugin-loader
          image: {{ .Values.plugins.initImage }}
          {{- /*
            Same container securityContext as the server: without it the
            pod is rejected in a namespace enforcing the "restricted" Pod
            Security Standard. The copy only reads /plugins and writes the
            emptyDir/PVC, so a read-only root filesystem is fine.
          */}}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["sh", "-c", "cp -a /plugins/* /target-plugins/ 2>/dev/null || true"]
          volumeMounts:
            - name: plugins
              mountPath: /target-plugins
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["chatcli", "server"]
          args:
            - "--port={{ .Values.server.port }}"
            {{- /*
              Always passed, 0 included: the server's own default is 9090,
              so omitting the flag for metricsPort=0 left metrics running on
              a port the chart neither exposes nor declares.
            */}}
            - "--metrics-port={{ .Values.server.metricsPort }}"
            {{- /*
              server.token is NOT passed as --token: an arg is readable in
              the pod spec and in the process list. It reaches the server as
              CHATCLI_SERVER_TOKEN from a Secret (see env below).
            */}}
            {{- if .Values.llm.provider }}
            - "--provider={{ .Values.llm.provider }}"
            {{- end }}
            {{- if .Values.llm.model }}
            - "--model={{ .Values.llm.model }}"
            {{- end }}
            {{- if include "chatcli.mcpConfigEnabled" . }}
            - "--mcp-config=/etc/chatcli/mcp/mcp_servers.json"
            {{- end }}
            {{- if .Values.tls.enabled }}
            - "--tls-cert={{ .Values.tls.certFile }}"
            - "--tls-key={{ .Values.tls.keyFile }}"
            {{- end }}
            {{- if and .Values.watcher.enabled .Values.watcher.targets }}
            - "--watch-config=/etc/chatcli/watch/watch-config.yaml"
            {{- else if and .Values.watcher.enabled .Values.watcher.deployment }}
            - "--watch-deployment={{ .Values.watcher.deployment }}"
            - "--watch-namespace={{ .Values.watcher.namespace }}"
            - "--watch-interval={{ .Values.watcher.interval }}"
            - "--watch-window={{ .Values.watcher.window }}"
            - "--watch-max-log-lines={{ .Values.watcher.maxLogLines }}"
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.server.port }}
              protocol: TCP
            {{- if .Values.server.metricsPort }}
            - name: metrics
              containerPort: {{ .Values.server.metricsPort }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "chatcli.fullname" . }}
                optional: true
            - secretRef:
                name: {{ include "chatcli.secretName" . }}
                optional: true
          env:
            - name: HOME
              value: /home/chatcli
          {{- if .Values.prometheusUrl }}
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheusUrl | quote }}
          {{- end }}
          {{- /* Security configuration env vars */ -}}
          {{- if .Values.security.jwtSecret }}
            - name: CHATCLI_JWT_SECRET
              value: {{ .Values.security.jwtSecret | quote }}
          {{- end }}
          {{- if .Values.security.jwtSecretRef }}
            - name: CHATCLI_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.jwtSecretRef.name }}
                  key: {{ .Values.security.jwtSecretRef.key }}
          {{- end }}
          {{- if .Values.security.jwtIssuer }}
            - name: CHATCLI_JWT_ISSUER
              value: {{ .Values.security.jwtIssuer | quote }}
          {{- end }}
          {{- if .Values.security.jwtAudience }}
            - name: CHATCLI_JWT_AUDIENCE
              value: {{ .Values.security.jwtAudience | quote }}
          {{- end }}
          {{- if .Values.security.jwtPublicKey }}
            - name: CHATCLI_JWT_PUBLIC_KEY
              value: {{ .Values.security.jwtPublicKey | quote }}
          {{- end }}
          {{- if .Values.security.jwtPublicKeyRef }}
            - name: CHATCLI_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.jwtPublicKeyRef.name }}
                  key: {{ .Values.security.jwtPublicKeyRef.key }}
          {{- end }}
          {{- if .Values.security.tlsClientCA }}
            - name: CHATCLI_SERVER_TLS_CLIENT_CA
              value: {{ .Values.security.tlsClientCA | quote }}
          {{- end }}
          {{- if .Values.security.mtlsRole }}
            - name: CHATCLI_MTLS_ROLE
              value: {{ .Values.security.mtlsRole | quote }}
          {{- end }}
          {{- if .Values.security.rateLimitRps }}
            - name: CHATCLI_RATE_LIMIT_RPS
              value: {{ .Values.security.rateLimitRps | quote }}
          {{- end }}
          {{- if .Values.security.rateLimitBurst }}
            - name: CHATCLI_RATE_LIMIT_BURST
              value: {{ .Values.security.rateLimitBurst | quote }}
          {{- end }}
          {{- if .Values.security.maxRecvMsgSize }}
            - name: CHATCLI_MAX_RECV_MSG_SIZE
              value: {{ .Values.security.maxRecvMsgSize | quote }}
          {{- end }}
          {{- if .Values.security.maxSendMsgSize }}
            - name: CHATCLI_MAX_SEND_MSG_SIZE
              value: {{ .Values.security.maxSendMsgSize | quote }}
          {{- end }}
          {{- if .Values.security.maxConcurrentStreams }}
            - name: CHATCLI_MAX_CONCURRENT_STREAMS
              value: {{ .Values.security.maxConcurrentStreams | quote }}
          {{- end }}
          {{- if .Values.security.bindAddress }}
            - name: CHATCLI_BIND_ADDRESS
              value: {{ .Values.security.bindAddress | quote }}
          {{- end }}
          {{- if .Values.security.auditLogPath }}
            - name: CHATCLI_AUDIT_LOG_PATH
              value: {{ .Values.security.auditLogPath | quote }}
          {{- end }}
          {{- if .Values.security.debug }}
            - name: CHATCLI_DEBUG
              value: "true"
          {{- end }}
          {{- if .Values.security.agentSecurityMode }}
            - name: CHATCLI_AGENT_SECURITY_MODE
              value: {{ .Values.security.agentSecurityMode | quote }}
          {{- end }}
          {{- if .Values.security.sessionTTL }}
            - name: CHATCLI_SESSION_TTL
              value: {{ .Values.security.sessionTTL | quote }}
          {{- end }}
          {{- if .Values.security.envRedactMode }}
            - name: CHATCLI_ENV_REDACT_MODE
              value: {{ .Values.security.envRedactMode | quote }}
          {{- end }}
          {{- if .Values.security.allowUnsignedPlugins }}
            - name: CHATCLI_ALLOW_UNSIGNED_PLUGINS
              value: "true"
          {{- end }}
          {{- if .Values.security.allowInsecure }}
            - name: CHATCLI_ALLOW_INSECURE
              value: "true"
          {{- end }}
          {{- if .Values.security.encryptionKey }}
            - name: CHATCLI_ENCRYPTION_KEY
              value: {{ .Values.security.encryptionKey | quote }}
          {{- end }}
          {{- /*
            server.token, from a Secret. Declared explicitly (not only
            through envFrom) so it keeps the precedence the old --token arg
            had: it wins over a CHATCLI_SERVER_TOKEN carried by
            secrets.existingSecret (env beats envFrom) or by extraEnv (whose
            entry of that name is dropped, so the container never carries
            the same variable twice).
          */}}
          {{- $extraEnv := .Values.extraEnv }}
          {{- if .Values.server.token }}
          {{- $extraEnv = list }}
          {{- range .Values.extraEnv }}
          {{- if ne .name "CHATCLI_SERVER_TOKEN" }}
          {{- $extraEnv = append $extraEnv . }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- with $extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.server.token }}
            - name: CHATCLI_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "chatcli.tokenSecretName" . }}
                  key: CHATCLI_SERVER_TOKEN
          {{- end }}
          {{- $mounts := list }}
          {{- if .Values.persistence.enabled }}
          {{- $mounts = append $mounts (dict "name" "sessions" "mountPath" "/home/chatcli/.chatcli/sessions") }}
          {{- end }}
          {{- if .Values.tls.existingSecret }}
          {{- $mounts = append $mounts (dict "name" "tls-certs" "mountPath" "/etc/chatcli/tls" "readOnly" true) }}
          {{- end }}
          {{- if and .Values.watcher.enabled .Values.watcher.targets }}
          {{- $mounts = append $mounts (dict "name" "watch-config" "mountPath" "/etc/chatcli/watch" "readOnly" true) }}
          {{- end }}
          {{- if and .Values.securityContext .Values.securityContext.readOnlyRootFilesystem }}
          {{- $mounts = append $mounts (dict "name" "tmp" "mountPath" "/tmp") }}
          {{- $mounts = append $mounts (dict "name" "data" "mountPath" "/home/chatcli/.chatcli") }}
          {{- end }}
          {{- if .Values.agents.enabled }}
          {{- $agentsCM := .Values.agents.existingConfigMap | default (printf "%s-agents" (include "chatcli.fullname" .)) }}
          {{- $mounts = append $mounts (dict "name" "agents" "mountPath" "/home/chatcli/.chatcli/agents" "readOnly" true) }}
          {{- end }}
          {{- if .Values.skills.enabled }}
          {{- $skillsCM := .Values.skills.existingConfigMap | default (printf "%s-skills" (include "chatcli.fullname" .)) }}
          {{- $mounts = append $mounts (dict "name" "skills" "mountPath" "/home/chatcli/.chatcli/skills" "readOnly" true) }}
          {{- end }}
          {{- if .Values.plugins.enabled }}
          {{- $mounts = append $mounts (dict "name" "plugins" "mountPath" "/home/chatcli/.chatcli/plugins") }}
          {{- end }}
          {{- if include "chatcli.mcpConfigEnabled" . }}
          {{- $mounts = append $mounts (dict "name" "mcp-config" "mountPath" "/etc/chatcli/mcp" "readOnly" true) }}
          {{- end }}
          {{- if .Values.bootstrap.enabled }}
          {{- $mounts = append $mounts (dict "name" "bootstrap" "mountPath" "/home/chatcli/.chatcli/bootstrap" "readOnly" true) }}
          {{- end }}
          {{- if .Values.memory.enabled }}
          {{- $mounts = append $mounts (dict "name" "memory" "mountPath" "/home/chatcli/.chatcli/memory") }}
          {{- end }}
          {{- range .Values.extraVolumeMounts }}
          {{- $mounts = append $mounts . }}
          {{- end }}
          {{- if $mounts }}
          volumeMounts:
            {{- toYaml $mounts | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- /*
            No kubelet gRPC probe: it cannot speak TLS. HTTP /healthz and TCP
            work for every server image version and with or without TLS.
            Liveness and startup ask the process (/healthz on the metrics
            port, TCP on the gRPC port when metrics are off); readiness asks
            the gRPC listener, so the Service only routes to a pod once the
            port it targets is bound.
          */}}
          startupProbe:
            {{- include "chatcli.processProbe" . | trim | nindent 12 }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            {{- include "chatcli.processProbe" . | trim | nindent 12 }}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      {{- if or .Values.persistence.enabled .Values.tls.existingSecret (and .Values.watcher.enabled .Values.watcher.targets) (and .Values.securityContext .Values.securityContext.readOnlyRootFilesystem) .Values.agents.enabled .Values.skills.enabled .Values.plugins.enabled (include "chatcli.mcpConfigEnabled" .) .Values.bootstrap.enabled .Values.memory.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: sessions
          persistentVolumeClaim:
            claimName: {{ include "chatcli.fullname" . }}-sessions
        {{- end }}
        {{- if .Values.tls.existingSecret }}
        - name: tls-certs
          secret:
            secretName: {{ .Values.tls.existingSecret }}
        {{- end }}
        {{- if and .Values.watcher.enabled .Values.watcher.targets }}
        - name: watch-config
          configMap:
            name: {{ include "chatcli.fullname" . }}-watch-config
        {{- end }}
        {{- if and .Values.securityContext .Values.securityContext.readOnlyRootFilesystem }}
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: data
          emptyDir:
            sizeLimit: 200Mi
        {{- end }}
        {{- if .Values.agents.enabled }}
        - name: agents
          configMap:
            name: {{ .Values.agents.existingConfigMap | default (printf "%s-agents" (include "chatcli.fullname" .)) }}
        {{- end }}
        {{- if .Values.skills.enabled }}
        - name: skills
          configMap:
            name: {{ .Values.skills.existingConfigMap | default (printf "%s-skills" (include "chatcli.fullname" .)) }}
        {{- end }}
        {{- if .Values.plugins.enabled }}
        - name: plugins
          {{- if .Values.plugins.existingPVC }}
          persistentVolumeClaim:
            claimName: {{ .Values.plugins.existingPVC }}
          {{- else }}
          emptyDir:
            sizeLimit: 500Mi
          {{- end }}
        {{- end }}
        {{- if include "chatcli.mcpConfigEnabled" . }}
        - name: mcp-config
          configMap:
            name: {{ .Values.mcp.existingConfigMap | default (printf "%s-mcp" (include "chatcli.fullname" .)) }}
        {{- end }}
        {{- if .Values.bootstrap.enabled }}
        - name: bootstrap
          configMap:
            name: {{ .Values.bootstrap.existingConfigMap | default (printf "%s-bootstrap" (include "chatcli.fullname" .)) }}
        {{- end }}
        {{- if .Values.memory.enabled }}
        - name: memory
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "chatcli.fullname" . }}-sessions
          {{- else }}
          emptyDir:
            sizeLimit: 200Mi
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
