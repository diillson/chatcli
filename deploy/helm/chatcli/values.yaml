# ChatCLI Helm Chart - Default Values

replicaCount: 1

# Deployment update strategy. Empty (default) = chosen from persistence:
# with persistence enabled on a volume that is not ReadWriteMany the chart
# stops the old pod before starting the new one (RollingUpdate with
# maxSurge 0, maxUnavailable 1), because under the API server default a
# surge pod scheduled on another node waits forever on Multi-Attach while
# the old pod, stopped only once the new one is Ready, holds the volume.
# Without persistence, or with ReadWriteMany, the API server default
# (RollingUpdate, 25% / 25%) applies. Anything set here is rendered as
# written and wins; `type: Recreate` gets `rollingUpdate: null`. With Helm 4
# server-side apply, a release still on a chart that rendered no strategy
# (up to 1.211.2) cannot switch straight to Recreate: upgrade once on the
# default first (see the README).
strategy: {}
#   type: Recreate

image:
  repository: ghcr.io/diillson/chatcli
  # tag defaults to Chart.appVersion when empty — ensures version consistency.
  # Override with --set image.tag=custom if needed.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# gRPC server configuration
server:
  port: 50051
  # Prometheus metrics HTTP port (0 = disabled). The same listener serves
  # GET /healthz, which the liveness and startup probes use; with 0 the
  # probes fall back to a TCP connect on the gRPC port.
  metricsPort: 9090
  # Authentication token for the gRPC server.
  #
  # REQUIRED for any in-cluster install. Inside Kubernetes the server binds
  # every interface, and it refuses to start unauthenticated on a reachable
  # address — every caller that could reach it would otherwise be admitted
  # as an administrator. Set this, or security.jwtSecret / jwtSecretRef for
  # per-user JWTs. Leaving both empty is only valid when the server is
  # bound to loopback (security.bindAddress: "127.0.0.1").
  #
  # Generate one with: openssl rand -hex 32
  # The value is delivered as CHATCLI_SERVER_TOKEN from a Secret (the chart
  # Secret, or "<fullname>-server-token" when secrets.existingSecret is set),
  # never as a command-line argument. Alternatively leave this empty and put
  # CHATCLI_SERVER_TOKEN in secrets.existingSecret yourself.
  token: ""
  # Sets CHATCLI_GRPC_REFLECTION=true, which registers gRPC server
  # reflection (grpcurl, Postman and similar tools can list the services).
  # Reflection calls still need the server credential like any other RPC.
  # Keep it off in production.
  grpcReflection: false

# TLS configuration (the server requires TLS 1.3 when enabled)
tls:
  enabled: false
  # certFile and keyFile are paths inside the container. With
  # existingSecret the Secret is mounted at /etc/chatcli/tls and they
  # default to /etc/chatcli/tls/tls.crt and /etc/chatcli/tls/tls.key.
  # enabled: true without existingSecret or both paths fails the render
  # instead of starting a plaintext listener.
  certFile: ""
  keyFile: ""
  # Existing Secret with tls.crt / tls.key (e.g. from cert-manager),
  # mounted read-only at /etc/chatcli/tls. A ca.crt key in it can serve as
  # the mTLS client CA: security.tlsClientCA: /etc/chatcli/tls/ca.crt
  existingSecret: ""

# LLM Provider configuration
llm:
  # Default provider: OPENAI, OPENAI_ASSISTANT, CLAUDEAI, BEDROCK, GOOGLEAI, XAI, ZAI,
  # MINIMAX, MOONSHOT, STACKSPOT, OLLAMA, COPILOT, OPENROUTER
  # DEVIN is a local-CLI transport and is not available in the server image.
  # For BEDROCK: use IRSA via serviceAccount.annotations, or static AWS keys in secrets.*
  provider: ""
  model: ""

# Provider fallback chain — automatic failover between LLM providers
# When the primary provider fails (rate limit, timeout, server error),
# the system automatically tries the next provider in the chain.
#
# The chain is llm.provider (with llm.model) followed by the providers
# listed below; the chart puts llm.provider in front unless you list it
# yourself, in which case your order is kept. The server only installs the
# chain when at least two of its providers have working credentials, and
# uses it for requests that bring no credentials or provider of their own.
fallback:
  enabled: false
  # Ordered list of providers to try after llm.provider (first = highest
  # priority). Each entry needs a corresponding API key in secrets. Each
  # entry's model is rendered as CHATCLI_FALLBACK_MODEL_<NAME>; an entry
  # without one uses that provider's default model.
  providers: []
  #   - name: OPENAI
  #     model: gpt-4o
  #   - name: CLAUDEAI
  #     model: claude-sonnet-4-6
  #   - name: GOOGLEAI
  #     model: gemini-2.5-flash
  maxRetries: 2
  cooldownBase: "30s"
  cooldownMax: "5m"

# MCP (Model Context Protocol) server configuration
mcp:
  enabled: false
  # Inline MCP server config (creates ConfigMap automatically)
  # servers:
  #   - name: filesystem
  #     transport: stdio
  #     command: npx
  #     args: ["-y", "@anthropic/mcp-server-filesystem", "/workspace"]
  #     enabled: true
  #   - name: web-tools
  #     transport: sse
  #     url: "http://mcp-web:8080/sse"
  #     enabled: true
  #     # overrides: built-in plugins this MCP server replaces.
  #     # When connected, these built-ins are hidden from the LLM.
  #     # If the server disconnects, built-ins are restored automatically.
  #     overrides: ["@webfetch", "@websearch"]
  #     # env: extra environment for a stdio server process
  #     env:
  #       LOG_LEVEL: info
  servers: []
  # Or reference an existing ConfigMap with a mcp_servers.json key. It is
  # mounted at /etc/chatcli/mcp and passed as --mcp-config; when set it is
  # used instead of the ConfigMap rendered from servers.
  existingConfigMap: ""

# Provider API keys (stored in a Secret)
# Set these values or use existingSecret
secrets:
  # Use an existing secret instead of creating one
  existingSecret: ""
  openaiApiKey: ""
  anthropicApiKey: ""
  googleaiApiKey: ""
  xaiApiKey: ""
  # ZAI (Zhipu AI)
  zaiApiKey: ""
  # MiniMax
  minimaxApiKey: ""
  minimaxApiCompat: ""  # Empty = native API, "anthropic" = Anthropic Messages API compat
  # StackSpot
  stackspotClientId: ""
  stackspotClientKey: ""
  stackspotRealm: ""
  stackspotAgentId: ""
  # GitHub Copilot
  githubCopilotToken: ""
  # OpenRouter
  openrouterApiKey: ""
  # Moonshot (Kimi)
  moonshotApiKey: ""
  # AWS Bedrock — leave empty and use IRSA (serviceAccount.annotations) for IAM-based auth,
  # or set the static credentials below. Region is required either way (BEDROCK_REGION or AWS_REGION).
  awsAccessKeyId: ""
  awsSecretAccessKey: ""
  awsSessionToken: ""      # optional, only for STS/assumed-role credentials
  bedrockRegion: ""        # e.g. "us-east-1" (falls back to AWS_REGION)
  awsRegion: ""            # alternative to BEDROCK_REGION; picked up natively by the AWS SDK
  # Corporate proxy / private CA (optional):
  chatcliBedrockCaBundle: ""           # path INSIDE the pod to a mounted PEM bundle
  chatcliBedrockInsecureSkipVerify: "" # "true" disables TLS verification (insecure, troubleshooting only)

# GitHub Copilot configuration (if using COPILOT provider)
# Authenticate via /auth login github-copilot (Device Flow OAuth)
# or set secrets.githubCopilotToken above
copilot:
  model: ""           # e.g., gpt-6-astra, gpt-4o, claude-sonnet-4-6, gemini-2.5-flash
  maxTokens: ""       # max tokens for response (default: provider limit)
  apiBaseUrl: ""      # override for enterprise (default: https://api.githubcopilot.com)

# Ollama configuration (if using Ollama provider)
ollama:
  enabled: false
  baseUrl: "http://ollama:11434"
  model: ""

# Kubernetes Watcher mode
watcher:
  enabled: false

  # Single-target mode (legacy) — use "deployment" + "namespace". Watches a
  # Deployment; an empty namespace means the namespace named "default".
  deployment: ""
  namespace: ""

  # Multi-target mode — use "targets" list (takes precedence over deployment/namespace)
  # "deployment" is the resource name; "kind" picks the resource type
  # (Deployment, StatefulSet, DaemonSet, Job or CronJob; omitted = Deployment).
  # targets:
  #   - deployment: api-gateway
  #     namespace: production
  #     metricsPort: 9090
  #     metricsPath: "/metrics"
  #     metricsFilter: ["http_requests_*", "http_request_duration_*"]
  #   - deployment: auth-service
  #     namespace: production
  #     metricsPort: 9090
  #   - deployment: postgres
  #     kind: StatefulSet
  #     namespace: production
  #   - deployment: nightly-report
  #     kind: CronJob
  #     namespace: batch
  targets: []

  interval: "30s"
  window: "2h"
  maxLogLines: 100
  # Character budget for the LLM context (multi-target mode only)
  maxContextChars: 32000

serviceAccount:
  create: true
  name: ""
  annotations: {}

# RBAC for K8s watcher mode
rbac:
  create: true
  # Set to true to use ClusterRole/ClusterRoleBinding instead of namespace-scoped Role/RoleBinding.
  # Default false (least-privilege: namespace-scoped).
  clusterWide: false
  # Additional rules beyond the defaults. The defaults grant no access to
  # Secrets (the server never reads one through the API); add a rule here
  # only for a plugin that needs it, scoped with resourceNames.
  additionalRules: []

# CRD lifecycle management.
#
# Helm only applies files from the chart's crds/ directory on first install —
# `helm upgrade` skips them by design (Helm 3 hard restriction). That leaves
# users upgrading between chart versions running the new chatcli binary
# against the OLD CRD schema, which surfaced as GAP-06 in the 2026-05-23 chaos
# test (chart 1.121.0 -> 1.122.0 added IssueState Contained and the
# PostMortemSpec.RequiresHumanAction/RequiredAction fields).
#
# This block controls the pre-install/pre-upgrade hook that re-applies every
# CRD shipped with the chart so the schema is always in sync with the binary.
# Disable only if you manage CRDs out of band (separate cert-manager-crds-style
# chart, GitOps with explicit CRD application, etc.).
crdUpgrade:
  enabled: true
  # Image used by the pre-upgrade Job to run `kubectl apply`. Defaults to the
  # OFFICIAL Kubernetes-project kubectl image at registry.k8s.io — versioned
  # in lockstep with the Kubernetes release, distroless (no shell, no package
  # manager), and signed/SBOM'd by the project. Avoid pinning to a major-minor
  # stub like "v1.31" — only fully-qualified patch tags like "v1.31.10" resolve.
  image:
    repository: registry.k8s.io/kubectl
    tag: "v1.31.10"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  tolerations: []
  nodeSelector: {}

service:
  type: ClusterIP
  port: 50051
  # Enable headless Service for gRPC client-side load balancing with multiple replicas.
  # When true, DNS returns individual pod IPs instead of a virtual IP,
  # allowing gRPC round-robin distribution across all pods.
  # Recommended when replicaCount > 1.
  headless: false

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chatcli.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # Optional second metric; unset = CPU only.
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

networkPolicy:
  enabled: false
  # Peers allowed to reach the gRPC and metrics ports (NetworkPolicyPeer
  # list). Unset or empty = any source. Example: only the operator and
  # Prometheus namespaces.
  # ingressFrom:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: chatcli-system
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: monitoring

  # Egress policy. "allowAll" (the default) keeps the previous behaviour:
  # the policy restricts ingress and leaves outbound traffic alone.
  # "restricted" narrows egress to what the server actually needs — DNS,
  # HTTPS for LLM providers, and the Kubernetes API — which is what a
  # NetworkPolicy is usually installed for.
  #
  # Start with allowAll, confirm ingress behaves, then tighten. A pod that
  # cannot resolve DNS fails in ways that look nothing like a network
  # policy problem.
  egress: allowAll        # allowAll | restricted
  # Extra ports to allow on egress when egress=restricted, for a private
  # model endpoint or an internal service the server calls.
  # egressExtraPorts:
  #   - port: 8080
  #     protocol: TCP
  kubernetesApiPort: 6443

nodeSelector: {}
tolerations: []
affinity: {}

# Prometheus ServiceMonitor (requires Prometheus Operator)
serviceMonitor:
  enabled: false
  interval: "30s"
  scrapeTimeout: ""
  labels: {}

# Deprecated: PROMETHEUS_URL is read by the AIOps operator, not by the server.
# Set `prometheusUrl` on the chatcli-operator chart instead. Kept so existing
# values files keep validating; the server ignores the variable.
prometheusUrl: ""

# Security hardening configuration
# All fields map to CHATCLI_* environment variables on the server pod.
security:
  # JWT authentication secret (leave empty to use legacy token auth)
  # For production: use jwtSecretRef to reference a Kubernetes Secret instead.
  jwtSecret: ""
  # Reference a Secret key for JWT secret (recommended over plain jwtSecret).
  # Set jwtSecret or jwtSecretRef, not both: the render fails when both are
  # set, since each would define CHATCLI_JWT_SECRET.
  # JWT material fails closed: if a public key (or a PEM-looking secret)
  # cannot be loaded and JWT is the only credential, the server refuses to
  # start; with a token or mTLS also set, every JWT caller is rejected.
  # Tokens must carry an exp claim.
  jwtSecretRef: {}
  #   name: chatcli-jwt
  #   key: secret

  # Expected JWT claims. Leaving either empty skips that check, which means
  # a token minted for another audience by the same issuer is accepted —
  # set both wherever more than one service shares a signing key.
  jwtIssuer: ""         # expected "iss" claim
  jwtAudience: ""       # expected "aud" claim

  # RS256: an RSA public key (PEM) or the path to one inside the container.
  # Setting this selects RS256; leave it empty for an HS256 shared secret.
  jwtPublicKey: ""
  # Reference a Secret key holding the RSA public key (recommended).
  # Exclusive with jwtPublicKey, like jwtSecret and jwtSecretRef.
  jwtPublicKeyRef: {}
  #   name: chatcli-jwt
  #   key: public.pem

  # Mutual TLS: path inside the container to the CA bundle client
  # certificates are verified against. Requires tls.enabled (with
  # tls.existingSecret or both tls.certFile and tls.keyFile) — there is no
  # handshake to carry a client certificate without it — and then EVERY
  # connection must present a
  # client certificate. Point it at a ca.crt inside tls.existingSecret
  # (/etc/chatcli/tls/ca.crt), or mount a separate Secret with
  # extraVolumes + extraVolumeMounts (see below).
  tlsClientCA: ""
  # Role granted to callers identified by their client certificate alone
  # (no bearer token): viewer/readonly, user/operator or admin. Default:
  # user; an unknown value means readonly.
  mtlsRole: ""

  # Per-client rate limiting
  rateLimitRps: ""      # requests/second (default: 10)
  rateLimitBurst: ""    # burst size (default: 20)

  # gRPC message size limits
  maxRecvMsgSize: ""    # bytes (default: 52428800 = 50MB)
  maxSendMsgSize: ""    # bytes (default: 52428800 = 50MB)
  maxConcurrentStreams: "" # (default: 100)

  # Server bind address. Empty = 0.0.0.0 inside Kubernetes (the server
  # detects KUBERNETES_SERVICE_HOST) and 127.0.0.1 elsewhere. Set
  # "127.0.0.1" to keep the gRPC listener pod-local (the only shape that
  # may run without a credential).
  bindAddress: ""

  # Audit logging: absolute path for the hash-chained JSON-lines audit log.
  # Put it on a writable mount (the root filesystem is read-only), e.g.
  # under /home/chatcli/.chatcli or an extraVolumes entry.
  auditLogPath: ""

  # Debug mode (enables stack traces in error logs)
  debug: false

  # Agent security mode: "strict" (allowlist only) or "permissive" (allowlist + denylist)
  agentSecurityMode: ""

  # Session TTL in days (default: 90)
  sessionTTL: ""

  # Environment variable redaction: "off", "permissive" (default) or "strict"
  envRedactMode: ""

  # Allow unsigned plugins (dev only, default: false)
  allowUnsignedPlugins: false

  # Sets CHATCLI_ALLOW_INSECURE. Only the chatcli *client* reads it (to
  # dial a plaintext server); it does not change the server listener.
  allowInsecure: false

  # Encryption key for sessions at rest (leave empty to use auth key)
  # For production: set via extraEnv with secretKeyRef instead.
  encryptionKey: ""

# Log file rotation. Logs go to stderr as JSON lines and to a rotated file,
# /home/chatcli/.chatcli/app.log. With the read-only root filesystem that
# directory is a 200Mi emptyDir, and a volume past its sizeLimit gets the
# pod evicted, so the chart sets a rotation that fits: at most
# maxSizeMB x (maxBackups + 1) = 80 MB of log with these defaults (the
# server's own defaults, 100 MB x 4, do not fit). While the data emptyDir
# is in use the render fails when that product exceeds 100 MB, leaving the
# rest of the volume to the other state kept there.
# Each field sets its CHATCLI_LOG_* variable; null leaves the variable
# unset (server default). An extraEnv entry of the same name wins.
logging:
  maxSizeMB: 20      # CHATCLI_LOG_MAX_SIZE_MB
  maxBackups: 3      # CHATCLI_LOG_MAX_BACKUPS
  maxAgeDays: 28     # CHATCLI_LOG_MAX_AGE_DAYS
  compress: true     # CHATCLI_LOG_COMPRESS

# Extra environment variables. An entry for one of the CHATCLI_LOG_*
# variables above replaces the chart's value; a CHATCLI_SERVER_TOKEN entry
# is dropped when server.token is set.
extraEnv: []
# - name: LOG_LEVEL
#   value: "debug"
# - name: CHATCLI_AGENT_ALLOWLIST
#   value: "terraform,ansible,packer"
# - name: CHATCLI_ENCRYPTION_KEY
#   valueFrom:
#     secretKeyRef:
#       name: chatcli-secrets
#       key: encryption-key

# Extra volumes for the pod and mounts for the server container, e.g. a
# Secret holding the mTLS client CA for security.tlsClientCA, a corporate
# CA bundle, or a writable path for security.auditLogPath.
extraVolumes: []
# - name: client-ca
#   secret:
#     secretName: chatcli-client-ca
extraVolumeMounts: []
# - name: client-ca
#   mountPath: /etc/chatcli/client-ca
#   readOnly: true
# ...then: security.tlsClientCA: /etc/chatcli/client-ca/ca.crt

# Persistence for sessions. The PVC root is mounted at
# /home/chatcli/.chatcli/sessions (and memory, when enabled, in its own
# directory of the same PVC; see memory.subPath).
# Without ReadWriteMany the volume attaches to one node at a time: the
# Deployment then stops the old pod before starting the new one (see
# `strategy`), and every replica must land on the node holding the volume,
# so run one replica (or set ReadWriteMany): replicaCount or an HPA above 1 on a
# ReadWriteOnce volume leaves the pods scheduled elsewhere stuck in
# ContainerCreating. ReadWriteOncePod admits a single pod, so the render
# fails with more than one replica.
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

# Agent/Skill provisioning (remote resource discovery)
agents:
  enabled: false
  # Inline agent definitions (creates ConfigMap automatically)
  # Each key is the filename (e.g., coder.md), value is the full markdown content
  definitions: {}
  #   coder.md: |
  #     ---
  #     name: coder
  #     description: Expert coder agent
  #     model: gpt-6-astra
  #     skills: [golang, docker]
  #     ---
  #     You are an expert coder...
  # Or reference an existing ConfigMap containing agent .md files
  existingConfigMap: ""

skills:
  enabled: false
  # Inline skill definitions (creates ConfigMap automatically)
  definitions: {}
  #   golang.md: |
  #     ---
  #     name: golang
  #     description: Go programming skill
  #     ---
  #     You are a Go expert...
  # Or reference an existing ConfigMap containing skill .md files
  existingConfigMap: ""

# Bootstrap files (SOUL.md, USER.md, IDENTITY.md, RULES.md, AGENTS.md)
# Loaded into system prompt for agent personality and behavior
bootstrap:
  enabled: false
  # Inline bootstrap file definitions (creates ConfigMap automatically)
  definitions: {}
  #   SOUL.md: |
  #     You are a helpful DevOps assistant...
  #   USER.md: |
  #     The user prefers Go and Kubernetes...
  # Or reference an existing ConfigMap containing bootstrap .md files
  existingConfigMap: ""

# Pipeline RPCs: host the full ChatCLI turn engine in the server
# (ChatTurn, RunCoder, RunAgent, tool RPCs). Off by default: the engine's
# workers run inside the pod and its turns are serialized. Cannot be
# combined with the co-located gateway (CHATCLI_GATEWAY_IN_SERVER).
pipeline:
  enabled: false

# Memory persistence (long-term MEMORY.md + daily notes)
memory:
  enabled: false
  # Memory files are stored under /home/chatcli/.chatcli/memory/. With
  # persistence enabled that is the `subPath` directory of the sessions PVC
  # (kubelet creates it; the default fsGroup makes it writable), so memory
  # stores never land among the session files. Without persistence it is a
  # 200Mi emptyDir.
  #
  # Charts up to 1.211.2 mounted memory at the PVC root, next to the
  # sessions. The sessions stay at the root, so no session moves; memory
  # files written by an older chart stay at the root too and are no longer
  # read from there. To carry them over, copy the root into the memory
  # directory once (see the README, "Memory on the sessions PVC"), or set
  # subPath: "" to keep the old shared layout.
  subPath: memory

# Shell safety is configured through the agent's own variables, set under
# `env` or `secrets` above. Nothing reads a CHATCLI_SAFETY_ENABLED switch:
#   CHATCLI_AGENT_SECURITY_MODE   strict (default) | permissive
#   CHATCLI_AGENT_ALLOWLIST       commands that run without confirmation
#   CHATCLI_AGENT_DENYLIST        commands that are always refused
#   CHATCLI_AGENT_ALLOW_SUDO      false by default

# Skill Registry configuration (multi-registry support)
skillRegistry:
  enabled: false
  # Comma-separated list of additional registry URLs
  registryUrls: ""
  # Comma-separated list of registry names to disable
  registryDisable: ""
  # Override the skill install directory inside the container
  installDir: ""

# Plugin provisioning (remote resource discovery)
plugins:
  enabled: false
  # Init container image containing plugin binaries in /plugins/
  # The init container copies binaries to the chatcli plugins directory
  initImage: ""
  # Or reference an existing PVC with pre-installed plugin binaries
  existingPVC: ""
