apiVersion: v2
name: chatcli
description: ChatCLI - CLI for LLM interaction with gRPC server mode
type: application
version: 1.212.1
appVersion: 1.212.1
home: https://chatcli.edilsonfreitas.com
sources:
  - https://github.com/diillson/chatcli
icon: https://chatcli.edilsonfreitas.com/images/icon-artifacthub.svg
keywords:
  - chatcli
  - llm
  - grpc
  - ai
  - cli
  - openai
  - claude
  - mcp
  - aiops
  - kubernetes
maintainers:
  - name: Edilson Freitas
    email: diillson@hotmail.com
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: 'true'
  artifacthub.io/changes: |
    - kind: fixed
      description: Probes use GET /healthz on the metrics port and a TCP check on the gRPC port, which work for every server image version and with or without TLS; kubelet gRPC probes cannot speak TLS
    - kind: security
      description: server.token is delivered as CHATCLI_SERVER_TOKEN from a Secret instead of a --token container argument, including with secrets.existingSecret
    - kind: fixed
      description: The values schema accepts networkPolicy.ingressFrom, autoscaling.targetMemoryUtilizationPercentage and mcp.servers[].env, which the templates already read
    - kind: fixed
      description: mcp.existingConfigMap alone is mounted and passed as --mcp-config
    - kind: fixed
      description: The fallback chain starts with llm.provider, which the server does not add on its own
    - kind: fixed
      description: server.metricsPort 0 now disables metrics instead of leaving them on the server default port
    - kind: fixed
      description: The plugin-loader init container gets the restricted securityContext
    - kind: added
      description: extraVolumes and extraVolumeMounts, to back security.tlsClientCA and other paths with Secrets
    - kind: security
      description: tls.enabled with tls.existingSecret defaults the certificate and key paths to the mounted Secret, and tls.enabled without a Secret or both paths fails the render instead of starting a plaintext listener
    - kind: security
      description: The server Role and ClusterRole no longer grant access to Secrets, which the server never reads through the API; rbac.additionalRules can add a scoped rule where a plugin needs one
    - kind: fixed
      description: A backend-protocol or ssl-redirect annotation in ingress.annotations replaces the nginx default instead of being rendered twice, so GRPCS backends work
    - kind: added
      description: watcher.targets[].kind watches a StatefulSet, DaemonSet, Job or CronJob instead of a Deployment
    - kind: fixed
      description: An empty watcher.namespace no longer renders an empty --watch-namespace, and a single-target namespace outside the release namespace switches RBAC to a ClusterRole
    - kind: fixed
      description: server.grpcReflection is documented as working, since CHATCLI_GRPC_REFLECTION alone enables reflection
    - kind: fixed
      description: README, values and schema describe gRPC reflection as working, the unauthenticated grpc.health.v1 service, a server that refuses to start when its only credential is JWT material that fails to load, JSON logs on stderr, per-provider fallback models and --reset-then-reuse-values upgrades
    - kind: fixed
      description: The ServiceLevelObjective and ChaosExperiment examples validate against the current CRDs and no longer set fields the operator rejects or ignores
    - kind: fixed
      description: With persistence on a volume without ReadWriteMany a rollout stops the old pod before starting the new one (RollingUpdate with maxSurge 0 and maxUnavailable 1, which Helm 3 and Helm 4 server-side apply both accept on an existing release), so a rollout onto another node no longer waits forever on Multi-Attach; the new strategy value overrides it, and ReadWriteOncePod with more than one replica fails the render
    - kind: fixed
      description: The logging values set a log rotation that fits the 200Mi data emptyDir (20 MB x 3 backups by default) instead of the server defaults of 100 MB x 3, which could pass the limit and get the pod evicted
    - kind: fixed
      description: Editing the chart-rendered MCP, agents, skills or bootstrap ConfigMap rolls the pods through checksum annotations; existingConfigMap edits still need kubectl rollout restart
    - kind: fixed
      description: With persistence, memory lives in the memory directory of the sessions PVC (memory.subPath) instead of its root, where its stores showed up as sessions and session expiry could delete them; sessions stay at the root, the server copies existing memory into the new directory once on its first start (CHATCLI_MEMORY_LEGACY_DIR), and memory.subPath "" keeps the old layout
    - kind: fixed
      description: agents, skills and bootstrap enabled without definitions or an existingConfigMap no longer mount a ConfigMap that does not exist, which left the pod in ContainerCreating
    - kind: fixed
      description: Setting both security.jwtSecret and jwtSecretRef, or jwtPublicKey and jwtPublicKeyRef, fails the render instead of defining the variable twice, and the Secret references are quoted
  artifacthub.io/prerelease: 'false'
  artifacthub.io/operator: 'false'
  artifacthub.io/crds: |
    - kind: AIInsight
      version: v1alpha1
      description: AI-generated analysis and recommendations for detected issues
    - kind: Anomaly
      version: v1alpha1
      description: Raw signal from watchers before correlation into issues
    - kind: ApprovalPolicy
      version: v1alpha1
      description: Approval requirements for remediation actions
    - kind: ApprovalRequest
      version: v1alpha1
      description: Pending approval for a remediation action
    - kind: AuditEvent
      version: v1alpha1
      description: Immutable record of an action in the AIOps platform
    - kind: ChaosExperiment
      version: v1alpha1
      description: Chaos engineering experiment targeting a Kubernetes resource
    - kind: ClusterRegistration
      version: v1alpha1
      description: Registered Kubernetes cluster for multi-cluster federation
    - kind: EscalationPolicy
      version: v1alpha1
      description: Escalation chains for incident management
    - kind: IncidentSLA
      version: v1alpha1
      description: SLA targets for incident response and resolution by severity
    - kind: Instance
      version: v1alpha1
      description: ChatCLI instance configuration
    - kind: Issue
      version: v1alpha1
      description: Detected problem in the cluster
    - kind: NotificationPolicy
      version: v1alpha1
      description: Notification delivery rules and channels
    - kind: PostMortem
      version: v1alpha1
      description: Full incident lifecycle captured after resolution
    - kind: RemediationPlan
      version: v1alpha1
      description: Remediation attempt for an Issue
    - kind: Runbook
      version: v1alpha1
      description: Operational procedures linked to issue types
    - kind: ServiceLevelObjective
      version: v1alpha1
      description: Service level objective with burn rate alerting
    - kind: SourceRepository
      version: v1alpha1
      description: Links a Kubernetes workload to its source code repository for code-aware incident analysis
  artifacthub.io/crdsExamples: |
    - apiVersion: platform.chatcli.io/v1alpha1
      kind: Instance
      metadata:
        name: chatcli
        namespace: chatcli
      spec:
        provider: CLAUDEAI
        apiKeys:
          name: chatcli-api-keys
        server:
          token:
            name: chatcli-server-token
            key: token
          tls:
            enabled: true
            secretName: chatcli-tls
    - apiVersion: platform.chatcli.io/v1alpha1
      kind: Issue
      metadata:
        name: payments-api-high-error-rate
        namespace: production
      spec:
        severity: high
        source: prometheus
        description: "Error rate for payments-api exceeded 15% over the last 5 minutes"
        resource:
          kind: Deployment
          name: payments-api
          namespace: production
    - apiVersion: platform.chatcli.io/v1alpha1
      kind: ApprovalPolicy
      metadata:
        name: production-approval
        namespace: production
      spec:
        enabled: true
        defaultMode: manual
        rules:
          - name: critical-manual
            match:
              severities: ["critical", "high"]
              actionTypes: ["RestartDeployment", "ScaleDeployment", "RollbackDeployment"]
            mode: manual
            timeoutMinutes: 15
          - name: low-severity-auto
            match:
              severities: ["low", "medium"]
              actionTypes: ["RestartDeployment"]
            mode: auto
            timeoutMinutes: 30
            autoApproveConditions:
              minConfidence: 0.85
              maxSeverity: medium
              historicalSuccessRate: 0.9
    - apiVersion: platform.chatcli.io/v1alpha1
      kind: ServiceLevelObjective
      metadata:
        name: api-availability
        namespace: production
      spec:
        enabled: true
        serviceName: api-server
        indicator:
          type: availability
          metricSource: issues
        target:
          percentage: 99.9
          window: 30d
    - apiVersion: platform.chatcli.io/v1alpha1
      kind: ChaosExperiment
      metadata:
        name: api-pod-failure
        namespace: chaos-testing
      spec:
        enabled: true
        experimentType: pod_failure
        target:
          kind: Deployment
          name: api-server
          namespace: production
        duration: 5m
        dryRun: true
        safetyChecks:
          minHealthyPods: 1
          abortOnIssueDetected: true
  artifacthub.io/links: |
    - name: Documentation
      url: https://chatcli.edilsonfreitas.com
    - name: Server mode guide
      url: https://chatcli.edilsonfreitas.com/features/server-mode
    - name: Source
      url: https://github.com/diillson/chatcli
  artifacthub.io/maintainers: |
    - name: Edilson Freitas
      email: diillson@hotmail.com
