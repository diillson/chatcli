---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: instances.platform.chatcli.io
spec:
  group: platform.chatcli.io
  names:
    kind: Instance
    listKind: InstanceList
    plural: instances
    shortNames:
    - inst
    singular: instance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.replicas
      name: Replicas
      type: integer
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .status.serverVersion
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Instance is the Schema for the instances API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: InstanceSpec defines the desired state of a ChatCLI deployment.
            properties:
              agents:
                description: Agents configures agent/skill provisioning for the instance.
                properties:
                  configMapRef:
                    description: ConfigMapRef references a ConfigMap containing agent
                      .md files as keys.
                    type: string
                  skillsConfigMapRef:
                    description: SkillsConfigMapRef references a ConfigMap containing
                      skill .md files.
                    type: string
                type: object
              aiops:
                description: |-
                  AIOps configures the autonomous incident management pipeline.
                  All fields are optional with sensible defaults.
                properties:
                  agenticMaxSteps:
                    default: 10
                    description: |-
                      AgenticMaxSteps is the maximum number of steps the AI can take in agentic
                      remediation mode before forced failure. Higher values give the AI more room
                      to investigate and try different approaches.
                    format: int32
                    maximum: 30
                    minimum: 3
                    type: integer
                  dedupTTLMinutes:
                    default: 30
                    description: |-
                      DedupTTLMinutes is how long (in minutes) the bridge dedup cache retains alert hashes.
                      After this period, the same alert can create a new Anomaly CR.
                      Lowered from 60 to 30 in GAP-02 fix (chaos test report 2026-05-23): 60+ minutes
                      penalized legitimate resource recreation (GitOps re-deploys, rollbacks).
                      Re-creation is now also handled structurally via UID-aware hashing — TTL is
                      the secondary safety net for genuinely persisting issues.
                    format: int32
                    maximum: 1440
                    minimum: 5
                    type: integer
                  enableAutoResolve:
                    default: true
                    description: |-
                      EnableAutoResolve enables automatic resolution of Escalated issues when the
                      watcher detects the resource has recovered (all pods healthy).
                    type: boolean
                  maxRemediationAttempts:
                    default: 5
                    description: |-
                      MaxRemediationAttempts is the maximum number of remediation attempts before escalating to human.
                      Higher values give the AI more chances to try different strategies.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                  resolutionCooldownMinutes:
                    default: 10
                    description: |-
                      ResolutionCooldownMinutes is how long (in minutes) after an issue is resolved before
                      new anomalies for the same resource can create a new issue. Prevents stale re-triggers.
                    format: int32
                    maximum: 120
                    minimum: 0
                    type: integer
                type: object
              apiKeys:
                description: |-
                  APIKeys references a Secret containing provider API keys and config.
                  Expected keys: OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLEAI_API_KEY, XAI_API_KEY,
                  ZAI_API_KEY, MINIMAX_API_KEY, MINIMAX_API_COMPAT, MOONSHOT_API_KEY, GITHUB_COPILOT_TOKEN, OPENROUTER_API_KEY.
                  For BEDROCK: AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (+ optional AWS_SESSION_TOKEN),
                  or leave unset and use IRSA by annotating the pod's ServiceAccount with
                  eks.amazonaws.com/role-arn. Region is set via AWS_REGION or BEDROCK_REGION.
                  All providers used in the fallback chain must have their credentials in this Secret.
                properties:
                  name:
                    description: Name is the Secret name.
                    type: string
                required:
                - name
                type: object
              extraEnv:
                description: |-
                  ExtraEnv allows passing arbitrary environment variables to the ChatCLI server pod.
                  Use this for security configuration (CHATCLI_RATE_LIMIT_RPS, CHATCLI_AGENT_SECURITY_MODE, etc.)
                  or any other CHATCLI_* env vars not covered by structured fields.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: |-
                                The key to select from the ConfigMap's Data field.
                                Keys in the BinaryData field are not currently propagated to container env vars.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              fallback:
                description: |-
                  Fallback configures automatic provider failover.
                  When the primary provider fails (rate limit, timeout, server error),
                  the system tries the next provider in the chain automatically.
                properties:
                  cooldownBase:
                    default: 30s
                    description: |-
                      CooldownBase is the initial cooldown duration after a provider fails (e.g., "30s").
                      Subsequent failures use exponential backoff up to CooldownMax.
                    type: string
                  cooldownMax:
                    default: 5m
                    description: CooldownMax is the maximum cooldown duration (e.g.,
                      "5m").
                    type: string
                  enabled:
                    description: Enabled activates the fallback chain.
                    type: boolean
                  maxRetries:
                    default: 2
                    description: MaxRetries is the number of retries per provider
                      before moving to next.
                    format: int32
                    minimum: 0
                    type: integer
                  providers:
                    description: |-
                      Providers is an ordered list of fallback providers to try.
                      First entry is highest priority. The primary provider (spec.provider)
                      is always tried first, then these in order.
                    items:
                      description: FallbackProviderEntry defines a single provider
                        in the fallback chain.
                      properties:
                        model:
                          description: Model is the LLM model to use for this provider.
                          type: string
                        name:
                          description: Name is the provider name (OPENAI, OPENAI_ASSISTANT,
                            CLAUDEAI, BEDROCK, GOOGLEAI, XAI, ZAI, MINIMAX, MOONSHOT,
                            STACKSPOT, OLLAMA, COPILOT, OPENROUTER, DEVIN).
                          enum:
                          - OPENAI
                          - OPENAI_ASSISTANT
                          - CLAUDEAI
                          - BEDROCK
                          - GOOGLEAI
                          - XAI
                          - ZAI
                          - MINIMAX
                          - MOONSHOT
                          - STACKSPOT
                          - OLLAMA
                          - COPILOT
                          - OPENROUTER
                          - DEVIN
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                required:
                - enabled
                - providers
                type: object
              features:
                description: |-
                  Features toggles the server's own capabilities that used to be
                  reachable only through extraEnv: memory, knowledge, budgets, the
                  conversation hub, a corporate CA bundle, encryption at rest, log
                  rotation and the HTTP-provider guard.
                properties:
                  allowHTTPProviders:
                    description: |-
                      AllowHTTPProviders lets caller-supplied provider endpoints use plain
                      HTTP (CHATCLI_ALLOW_HTTP_PROVIDERS). Off keeps the TLS-only posture.
                    type: boolean
                  budget:
                    description: |-
                      Budget bounds spend (CHATCLI_SESSION_BUDGET_USD,
                      CHATCLI_DAILY_BUDGET_USD, CHATCLI_BUDGET_HARD_STOP).
                    properties:
                      dailyUSD:
                        description: DailyUSD is the calendar-day budget (CHATCLI_DAILY_BUDGET_USD).
                        type: string
                      hardStop:
                        description: |-
                          HardStop refuses turns once a budget is exceeded
                          (CHATCLI_BUDGET_HARD_STOP).
                        type: boolean
                      sessionUSD:
                        description: SessionUSD is the per-session budget (CHATCLI_SESSION_BUDGET_USD).
                        type: string
                    type: object
                  caBundleSecretName:
                    description: |-
                      CABundleSecretName names a Secret whose ca.crt is the corporate CA
                      bundle every outbound TLS connection trusts (mounted at
                      /etc/chatcli/ca, CHATCLI_CA_BUNDLE).
                    type: string
                  encryptionKeyRef:
                    description: |-
                      EncryptionKeyRef references the Secret key holding the at-rest
                      encryption key for the server's stores (CHATCLI_ENCRYPTION_KEY).
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        type: string
                      name:
                        description: Name is the Secret name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  hub:
                    description: |-
                      Hub enables the cross-channel conversation hub (CHATCLI_HUB_ENABLED).
                      Nil keeps the server default.
                    type: boolean
                  knowledge:
                    description: |-
                      Knowledge enables the knowledge base for chat turns
                      (CHATCLI_CHAT_KNOWLEDGE). Nil keeps the server default.
                    type: boolean
                  logRotation:
                    description: LogRotation configures the server log file rotation.
                    properties:
                      compress:
                        description: Compress gzips rotated files (CHATCLI_LOG_COMPRESS).
                        type: boolean
                      maxAgeDays:
                        description: MaxAgeDays removes rotated files older than this
                          (CHATCLI_LOG_MAX_AGE_DAYS).
                        format: int32
                        type: integer
                      maxBackups:
                        description: MaxBackups keeps at most this many rotated files
                          (CHATCLI_LOG_MAX_BACKUPS).
                        format: int32
                        type: integer
                      maxSizeMB:
                        description: MaxSizeMB rotates the log file past this size
                          (CHATCLI_LOG_MAX_SIZE_MB).
                        format: int32
                        type: integer
                    type: object
                  memory:
                    description: |-
                      Memory controls long-term memory (CHATCLI_MEMORY_ENABLED,
                      CHATCLI_MEMORY_MODE).
                    properties:
                      enabled:
                        description: Enabled turns memory on or off (CHATCLI_MEMORY_ENABLED).
                        type: boolean
                      mode:
                        description: |-
                          Mode selects how memory reaches the prompt (CHATCLI_MEMORY_MODE):
                          index, pull, or off.
                        enum:
                        - index
                        - pull
                        - "off"
                        type: string
                    type: object
                type: object
              image:
                description: Image defines the container image for ChatCLI.
                properties:
                  pullPolicy:
                    default: IfNotPresent
                    description: PullPolicy defines the image pull policy.
                    type: string
                  repository:
                    default: ghcr.io/diillson/chatcli
                    description: Repository is the container image repository.
                    type: string
                  tag:
                    description: |-
                      Tag is the container image tag. When unset, the operator resolves it from the
                      CHATCLI_OPERATOR_APP_VERSION env var (set by the Helm chart to the chart's
                      appVersion), falling back to "latest". This lets a helm upgrade of the operator
                      also roll managed server pods without patching each Instance.
                    type: string
                type: object
              mcp:
                description: |-
                  MCP configures MCP (Model Context Protocol) servers for the instance.
                  MCP servers expose external tools (filesystem, search, databases, etc.)
                  that the AI can invoke during conversations.
                properties:
                  enabled:
                    default: false
                    description: Enabled activates MCP server connections.
                    type: boolean
                  existingConfigMap:
                    description: |-
                      ExistingConfigMap references an existing ConfigMap containing mcp_servers.json.
                      If set, Servers field is ignored and this ConfigMap is mounted instead.
                    type: string
                  servers:
                    description: Servers is the list of MCP server configurations.
                    items:
                      description: MCPServerSpec defines a single MCP server connection.
                      properties:
                        args:
                          description: Args are command-line arguments for the executable
                            (stdio transport only).
                          items:
                            type: string
                          type: array
                        command:
                          description: Command is the executable to start (stdio transport
                            only).
                          type: string
                        enabled:
                          default: true
                          description: Enabled controls whether this server is active.
                          type: boolean
                        env:
                          additionalProperties:
                            type: string
                          description: Env are environment variables for the process
                            (stdio transport only).
                          type: object
                        name:
                          description: Name is a unique identifier for this MCP server.
                          type: string
                        overrides:
                          description: |-
                            Overrides lists built-in plugin names that this MCP server replaces.
                            When the server is connected, these built-ins are hidden from the LLM prompt.
                            If the server disconnects, the built-ins are automatically restored (fallback).
                            Example: ["@webfetch", "@websearch"]
                          items:
                            type: string
                          type: array
                        transport:
                          description: 'Transport is the communication protocol: "stdio"
                            (local process) or "sse" (HTTP SSE).'
                          enum:
                          - stdio
                          - sse
                          type: string
                        url:
                          description: URL is the SSE endpoint URL (sse transport
                            only).
                          type: string
                      required:
                      - enabled
                      - name
                      - transport
                      type: object
                    type: array
                required:
                - enabled
                type: object
              model:
                description: Model is the LLM model name.
                type: string
              persistence:
                description: Persistence configures persistent storage for sessions.
                properties:
                  enabled:
                    description: Enabled activates persistent storage.
                    type: boolean
                  size:
                    default: 1Gi
                    description: Size is the PVC size (e.g., "1Gi").
                    type: string
                  storageClassName:
                    description: StorageClassName is the storage class to use.
                    type: string
                type: object
              pipeline:
                description: |-
                  Pipeline hosts the full ChatCLI turn engine in the server behind the
                  ChatTurn, RunCoder, RunAgent and tool RPCs (CHATCLI_SERVER_PIPELINE).
                  Off by default: the engine's workers run inside the pod and its turns
                  are serialized.
                properties:
                  enabled:
                    description: Enabled serves the pipeline RPCs.
                    type: boolean
                type: object
              plugins:
                description: Plugins configures plugin provisioning for the instance.
                properties:
                  image:
                    description: Image is an init container image containing plugin
                      binaries in /plugins/.
                    type: string
                  pvcName:
                    description: PVCName references a PVC with pre-installed plugin
                      binaries.
                    type: string
                type: object
              provider:
                description: |-
                  Provider is the LLM provider (OPENAI, OPENAI_ASSISTANT, CLAUDEAI, BEDROCK, GOOGLEAI, XAI, ZAI, MINIMAX, MOONSHOT, STACKSPOT, OLLAMA, COPILOT, OPENROUTER, DEVIN).
                  BEDROCK uses the AWS credentials chain (IAM role via IRSA, static keys in the Secret, or instance profile).
                type: string
              replicas:
                default: 1
                description: Replicas is the number of ChatCLI server pods.
                format: int32
                minimum: 0
                type: integer
              resources:
                description: Resources defines resource requests/limits for the ChatCLI
                  container.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              scheduling:
                description: |-
                  Scheduling places the pod: node selector, tolerations, affinity,
                  image pull secrets, priority class and extra pod annotations.
                properties:
                  affinity:
                    description: Affinity is the pod's scheduling affinity.
                    properties:
                      nodeAffinity:
                        description: Describes node affinity scheduling rules for
                          the pod.
                        properties:
                          preferredDuringSchedulingIgnoredDuringExecution:
                            description: |-
                              The scheduler will prefer to schedule pods to nodes that satisfy
                              the affinity expressions specified by this field, but it may choose
                              a node that violates one or more of the expressions. The node that is
                              most preferred is the one with the greatest sum of weights, i.e.
                              for each node that meets all of the scheduling requirements (resource
                              request, requiredDuringScheduling affinity expressions, etc.),
                              compute a sum by iterating through the elements of this field and adding
                              "weight" to the sum if the node matches the corresponding matchExpressions; the
                              node(s) with the highest sum are the most preferred.
                            items:
                              description: |-
                                An empty preferred scheduling term matches all objects with implicit weight 0
                                (i.e. it's a no-op). A null preferred scheduling term matches no objects (i.e. is also a no-op).
                              properties:
                                preference:
                                  description: A node selector term, associated with
                                    the corresponding weight.
                                  properties:
                                    matchExpressions:
                                      description: A list of node selector requirements
                                        by node's labels.
                                      items:
                                        description: |-
                                          A node selector requirement is a selector that contains values, a key, and an operator
                                          that relates the key and values.
                                        properties:
                                          key:
                                            description: The label key that the selector
                                              applies to.
                                            type: string
                                          operator:
                                            description: |-
                                              Represents a key's relationship to a set of values.
                                              Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                                            type: string
                                          values:
                                            description: |-
                                              An array of string values. If the operator is In or NotIn,
                                              the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                              the values array must be empty. If the operator is Gt or Lt, the values
                                              array must have a single element, which will be interpreted as an integer.
                                              This array is replaced during a strategic merge patch.
                                            items:
                                              type: string
                                            type: array
                                            x-kubernetes-list-type: atomic
                                        required:
                                        - key
                                        - operator
                                        type: object
                                      type: array
                                      x-kubernetes-list-type: atomic
                                    matchFields:
                                      description: A list of node selector requirements
                                        by node's fields.
                                      items:
                                        description: |-
                                          A node selector requirement is a selector that contains values, a key, and an operator
                                          that relates the key and values.
                                        properties:
                                          key:
                                            description: The label key that the selector
                                              applies to.
                                            type: string
                                          operator:
                                            description: |-
                                              Represents a key's relationship to a set of values.
                                              Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                                            type: string
                                          values:
                                            description: |-
                                              An array of string values. If the operator is In or NotIn,
                                              the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                              the values array must be empty. If the operator is Gt or Lt, the values
