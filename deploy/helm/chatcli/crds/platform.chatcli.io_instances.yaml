                            Deployment is the resource name to monitor.
                            Deprecated: Use "name" instead. Kept for backward compatibility — if both are set, "name" takes precedence.
                          type: string
                        kind:
                          default: Deployment
                          description: |-
                            Kind is the Kubernetes resource kind to monitor.
                            Supported values: Deployment, StatefulSet, DaemonSet, Job, CronJob.
                            Defaults to "Deployment" when omitted for backward compatibility.
                          enum:
                          - Deployment
                          - StatefulSet
                          - DaemonSet
                          - Job
                          - CronJob
                          type: string
                        metricsFilter:
                          description: MetricsFilter is a list of glob patterns to
                            filter Prometheus metrics.
                          items:
                            type: string
                          type: array
                        metricsPath:
                          description: 'MetricsPath is the HTTP path for Prometheus
                            metrics (default: "/metrics").'
                          type: string
                        metricsPort:
                          description: MetricsPort is the port where Prometheus metrics
                            are exposed (0 = disabled).
                          format: int32
                          type: integer
                        name:
                          description: Name is the resource name to monitor (e.g.,
                            "api-gateway", "postgres", "fluentd").
                          type: string
                        namespace:
                          description: Namespace is the namespace of the resource.
                          type: string
                      required:
                      - namespace
                      type: object
                    type: array
                  window:
                    default: 2h
                    description: Window is the observation window (e.g., "2h", "30m").
                    type: string
                type: object
            required:
            - provider
            type: object
          status:
            description: InstanceStatus defines the observed state of Instance.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the instance state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration tracks which generation was last reconciled.
                format: int64
                type: integer
              ready:
                description: Ready indicates whether all replicas are available.
                type: boolean
              readyReplicas:
                description: ReadyReplicas is the number of ready replicas.
                format: int32
                type: integer
              replicas:
                description: Replicas is the total number of desired replicas.
                format: int32
                type: integer
              serverProbeTime:
                description: |-
                  ServerProbeTime is when the operator last probed the server; the
                  ServerReachable condition carries the outcome.
                format: date-time
                type: string
              serverVersion:
                description: |-
                  ServerVersion is the version the running server reported on the last
