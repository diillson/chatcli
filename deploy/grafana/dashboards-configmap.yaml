# ChatCLI AIOps dashboards for Grafana.
#
# This file holds the ServiceMonitors Prometheus needs to scrape the operator
# and the server. It does NOT carry the dashboards: a ConfigMap written here
# by hand would hold placeholders instead of the JSON, and applying it would
# overwrite a good one. Build the dashboard ConfigMap from the JSON files,
# naming each file (pointing --from-file at the directory would also pack
# this YAML into the ConfigMap):
#
#   kubectl create configmap chatcli-grafana-dashboards -n monitoring \
#     --from-file=deploy/grafana/aiops-overview.json \
#     --from-file=deploy/grafana/incident-timeline.json \
#     --from-file=deploy/grafana/remediation-stats.json \
#     --from-file=deploy/grafana/slo-burn-rate.json \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl label configmap chatcli-grafana-dashboards -n monitoring grafana_dashboard=1 --overwrite
#   kubectl annotate configmap chatcli-grafana-dashboards -n monitoring grafana-folder="ChatCLI AIOps" --overwrite
#
# The grafana_dashboard label is what the Grafana dashboard sidecar watches;
# the grafana-folder annotation files them under one folder.
#
# ServiceMonitor for the operator metrics endpoint (chatcli_operator_*)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chatcli-operator
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: chatcli-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: chatcli-operator
  namespaceSelector:
    any: true
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
---
# ServiceMonitor for the server metrics endpoint (chatcli_*). Instance
# Services (operator) and the server Helm chart both label the Service
# app.kubernetes.io/name: chatcli and name the port "metrics".
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chatcli-server
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: chatcli-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: chatcli
  namespaceSelector:
    any: true
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
