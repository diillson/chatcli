# Minimal Kubernetes manifest for the ChatCLI gRPC server.
#
# This is the smallest deployable shape and exists for kubectl-only
# environments. The supported path for production is the Helm chart at
# deploy/helm/chatcli (TLS, JWT, rate limits, PVC, network policy, HPA,
# ServiceMonitor and CRD upgrades are all handled there):
#
#   helm install chatcli oci://ghcr.io/diillson/charts/chatcli \
#     --namespace chatcli --create-namespace \
#     --set llm.provider=OPENAI --set secrets.openaiApiKey=sk-... \
#     --set server.token="$(openssl rand -hex 32)"
#
# Before applying:
#   kubectl create secret generic chatcli-server \
#     --from-literal=CHATCLI_SERVER_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=OPENAI_API_KEY=sk-...
apiVersion: v1
kind: Service
metadata:
  name: chatcli
  labels:
    app.kubernetes.io/name: chatcli
spec:
  selector:
    app.kubernetes.io/name: chatcli
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatcli
  labels:
    app.kubernetes.io/name: chatcli
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chatcli
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatcli
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chatcli
          # Pin to a release tag in production; "latest" is for evaluation only.
          image: ghcr.io/diillson/chatcli:latest
          # The image ENTRYPOINT is already `chatcli server`; stated explicitly.
          command: ["chatcli", "server"]
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9090
          env:
            - name: HOME
              value: /home/chatcli
            - name: LLM_PROVIDER
              value: OPENAI
            # The server refuses a reachable bind without a credential, so
            # CHATCLI_SERVER_TOKEN (or CHATCLI_JWT_SECRET) must come from
            # the Secret below.
            - name: CHATCLI_BIND_ADDRESS
              value: "0.0.0.0"
          envFrom:
            - secretRef:
                name: chatcli-server
          # The server registers no grpc.health.v1 service, so a kubelet
          # gRPC probe can never pass (nor can it speak TLS). Liveness and
          # startup use GET /healthz on the metrics port; readiness checks
          # the gRPC listener with a TCP connect.
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home/chatcli
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
