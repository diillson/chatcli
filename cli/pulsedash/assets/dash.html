<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatCLI · Live</title>
<style>
  /* Tokens: one deliberate look, a dark terminal, the same the ChatCLI deck
     uses. A light terminal theme is the only thing that overrides them. */
  :root {
    --bg:#0B0E14; --panel:#10141C; --panel2:#151B26; --border:#1E2634; --text:#DCE3EB; --strong:#FFFFFF; --muted:#7D8798; --faint:#556070;
    --amber:#FFB454; --cyan:#4FC3E8; --violet:#C79BFF; --green:#7FD962; --red:#E06C75;
    --accent:var(--cyan); --brand:var(--amber); --ok:var(--green); --err:var(--red); --warn:var(--amber);
    --k-session:#FFB454; --k-agent:#C79BFF; --k-llm:#4FC3E8; --k-tool:#7FD962; --k-skill:#F2D66B;
    --k-mcp:#FF8C69; --k-pattern:#F27DB5; --k-background:#8FA1B8; --k-conn:#4FD1C5; --k-rpc:#B8E05A; --k-turn:#8B9CFF;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Cascadia Code",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--text); font:12.5px/1.45 var(--mono); }
  ::selection { background:#ffb45433; }
  #app { display:grid; grid-template-rows:auto auto 1fr auto; grid-template-columns:minmax(0,1fr) 360px; height:100%; }
  header { grid-row:1; grid-column:1 / 3; } #tiles { grid-row:2; grid-column:1 / 2; } #stage { grid-row:3; grid-column:1 / 2; }
  aside { grid-row:2 / 4; grid-column:2 / 3; } footer { grid-row:4; grid-column:1 / 3; }
  /* progress line: the deck's bar, here driven by activity */
  #bar { position:fixed; top:0; left:0; height:2px; width:0; z-index:10; background:linear-gradient(90deg, var(--amber), var(--cyan)); transition:width .6s ease; }
  /* titlebar: a macOS terminal window's */
  header { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px; padding:8px 14px;
    background:var(--panel); border-bottom:1px solid var(--border); }
  .lights { display:flex; gap:7px; }
  .lights i { width:12px; height:12px; border-radius:50%; display:block; border:1px solid rgba(0,0,0,.25); }
  .lights i:nth-child(1) { background:#FF5F57; } .lights i:nth-child(2) { background:#FEBC2E; } .lights i:nth-child(3) { background:#28C840; }
  h1 { font-size:12px; font-weight:600; margin:0; color:var(--muted); letter-spacing:.02em; display:flex; align-items:center; justify-content:center; gap:10px; min-width:0; }
  h1 #title { color:var(--text); }
  h1 .sub { color:var(--muted); font-weight:400; }
  #beat { width:8px; height:8px; border-radius:50%; background:var(--faint); transition:background .2s, box-shadow .2s; }
  #beat.on { background:var(--ok); box-shadow:0 0 10px var(--ok); }
  .tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--border); border-radius:4px; padding:2px 9px; cursor:pointer; user-select:none;
    background:transparent; color:var(--text); font:inherit; font-size:11px; display:inline-flex; align-items:center; gap:6px; }
  .chip:hover { border-color:var(--muted); }
  .chip.off { opacity:.38; }
  .chip .dot { width:7px; height:7px; border-radius:50%; background:var(--faint); }
  .chip.live .dot { background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .chip.self { border-color:var(--brand); }
  button.ctl, select.ctl { background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:4px;
    padding:3px 9px; cursor:pointer; font:inherit; font-size:11px; }
  button.ctl:hover, select.ctl:hover { color:var(--text); border-color:var(--muted); }
  button.ctl:focus-visible, select.ctl:focus-visible, #search:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  select.ctl { appearance:none; -webkit-appearance:none; padding-right:16px; }
  #search { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:3px 9px; font:inherit; font-size:11px; width:170px; }
  #search::placeholder { color:var(--faint); }
  #search:focus { outline:none; border-color:var(--cyan); }
  /* stat tiles: the deck's big mono numbers */
  #tiles { display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; padding:10px 14px 4px; background:var(--bg); }
  .tile { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:9px 12px 8px; min-width:0; position:relative; }
  .tile .n { font-size:20px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .d { font-size:10px; color:var(--muted); margin-top:3px; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile.a .n { color:var(--amber); } .tile.c .n { color:var(--cyan); } .tile.g .n { color:var(--green); } .tile.v .n { color:var(--violet); }
  .tile.e .n { color:var(--muted); } .tile.e.hot .n { color:var(--red); }
  .tile.e { cursor:pointer; } .tile.e.on { border-color:var(--red); }
  #spark { position:absolute; right:10px; top:8px; width:96px; height:30px; opacity:.9; }
  @media (max-width:1100px) { #tiles { grid-template-columns:repeat(3, 1fr); } }
  /* stage */
  #stage { position:relative; overflow:hidden; background:var(--bg);
    background-image:radial-gradient(circle at 1px 1px, #1a2130 1px, transparent 0); background-size:26px 26px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  canvas.over { cursor:move; }
  canvas.drag { cursor:grabbing; }
  #empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
    color:var(--muted); padding:40px; pointer-events:none; white-space:pre-line; font-size:13px; line-height:1.7; }
  #empty .ps1 { color:var(--green); } #empty .cur::after { content:"▋"; color:var(--amber); animation:blink 1.05s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion:reduce) { #empty .cur::after { animation:none; } #bar { transition:none; } }
  /* feed: a tail of the log */
  aside { border-left:1px solid var(--border); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  aside .bar { display:flex; align-items:center; gap:6px; padding:9px 10px 6px; border-bottom:1px solid var(--border); }
  aside .bar h2 { flex:1; min-width:0; }
  aside h2 { font-size:11px; letter-spacing:.06em; color:var(--muted); margin:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  aside h2::before { content:"$ "; color:var(--brand); }
  aside .bar button.ctl, aside .bar select.ctl { padding:2px 7px; font-size:10.5px; }
  aside .bar button.ctl.on { border-color:var(--err); color:var(--err); }
  #feed { overflow:auto; flex:1; padding:4px 6px 10px; font-size:11.5px; }
  #feed.only-err .row:not(.err) { display:none; }
  .row { display:grid; grid-template-columns:52px 8px 1fr auto; gap:7px; align-items:baseline; padding:2px 6px; border-radius:4px; }
  .row:hover { background:var(--panel2); }
  .row .t { color:var(--faint); font-variant-numeric:tabular-nums; font-size:10.5px; }
  .row .k { width:7px; height:7px; border-radius:50%; align-self:center; }
  .row .n { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .n small { color:var(--muted); font-size:10.5px; }
  .row .d { color:var(--muted); font-variant-numeric:tabular-nums; font-size:10.5px; }
  .row.err .n { color:var(--err); }
  .row.mark .n { color:var(--amber); }
  .row.mark .k { border-radius:1px; transform:rotate(45deg); }
  .row.route .n { color:var(--strong); }
  /* popover: a small window */
  #pop { position:absolute; min-width:250px; max-width:360px; background:var(--panel); border:1px solid var(--border);
    border-radius:6px; padding:0; box-shadow:0 14px 40px rgba(0,0,0,.55); display:none; z-index:5; overflow:hidden; }
  #pop .ttl { display:flex; align-items:center; gap:8px; padding:7px 10px; background:var(--panel2); border-bottom:1px solid var(--border); }
  #pop .ttl .lights i { width:9px; height:9px; }
  #pop h3 { margin:0; font-size:12px; color:var(--strong); word-break:break-all; font-weight:600; }
  #pop table { border-collapse:collapse; width:100%; margin:8px 10px 10px; width:calc(100% - 20px); font-size:11.5px; }
  #pop td { padding:1px 0; vertical-align:top; } #pop td:first-child { color:var(--muted); padding-right:12px; white-space:nowrap; }
  #pop td:last-child { word-break:break-all; }
  #legend { position:absolute; left:12px; bottom:10px; display:flex; gap:5px; flex-wrap:wrap; max-width:70%; }
  #legend .chip { font-size:10px; letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; background:color-mix(in srgb, var(--panel) 80%, transparent); }
  /* statusbar: the deck's */
  footer { display:flex; align-items:center; gap:18px; padding:6px 14px; font-size:10.5px; letter-spacing:.04em; color:var(--muted);
    background:color-mix(in srgb, var(--panel) 88%, transparent); border-top:1px solid var(--border); }
  footer .brand { color:var(--brand); font-weight:600; }
  footer .spacer { flex:1; }
  footer b { color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; }
  #err { color:var(--err); }
</style>
</head>
<body>
<div id="bar"></div>
<div id="app">
  <header>
    <div class="lights"><i></i><i></i><i></i></div>
    <h1><span id="beat"></span><span id="title">chatcli — live</span><span class="sub" id="subtitle"></span></h1>
    <div class="tools">
      <div class="chips" id="instances"></div>
      <input id="search" type="search" autocomplete="off" spellcheck="false">
      <button class="ctl" id="bPause"></button>
      <button class="ctl" id="bReset"></button>
      <button class="ctl" id="bFit"></button>
      <button class="ctl" id="bExport"></button>
    </div>
  </header>
  <div id="tiles">
    <div class="tile a"><div class="n" id="tCost">—</div><div class="d" id="lCost">cost</div></div>
    <div class="tile c"><div class="n" id="tReq">0</div><div class="d" id="lReq">requests</div></div>
    <div class="tile g"><div class="n"><span id="sActive">0</span> <span style="font-size:12px;color:var(--muted)">/ <span id="sNodes">0</span></span></div><div class="d" id="lActive">active</div></div>
    <div class="tile v"><div class="n" id="tCtx">—</div><div class="d" id="lCtx">context</div></div>
    <div class="tile e" id="sAlert" role="button" tabindex="0"><div class="n"><span id="tErr">0</span> <span style="font-size:12px;color:var(--muted)"><span id="sErrN">0</span> <span id="lErrMin">last min</span></span></div><div class="d" id="lErr">errors</div></div>
    <div class="tile"><canvas id="spark" width="192" height="60"></canvas><div class="n" id="sRate">0</div><div class="d" id="lRate">events/s</div></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="empty"></div>
    <div id="legend"></div>
    <div id="pop"></div>
  </div>
  <aside>
    <div class="bar">
      <h2 id="lFeed">tail -f events</h2>
      <select class="ctl" id="feedKind"></select>
      <button class="ctl" id="bErrOnly"></button>
    </div>
    <div id="feed"></div>
  </aside>
  <footer>
    <span class="brand">chatcli</span><span id="lBrand">· live dashboard</span>
    <span><b id="fProcs">0</b> <span id="lProcs">processes</span></span>
    <span class="spacer"></span>
    <span id="err"></span>
    <span id="fKeys"></span>
  </footer>
</div>
<script>
"use strict";
const BOOT = __PULSE_BOOT__;
const $ = id => document.getElementById(id);
const S = (k, fb) => (BOOT.strings && BOOT.strings[k]) || fb;
document.documentElement.lang = BOOT.lang || "en";
for (const [k, v] of Object.entries(BOOT.theme || {})) document.documentElement.style.setProperty(k, v);
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// The token arrives in the URL once, moves to memory and leaves the address bar.
const TOKEN = new URLSearchParams(location.search).get("t") || "";
history.replaceState(null, "", location.pathname);

const KINDS = ["session","agent","turn","llm","tool","skill","mcp","pattern","background","conn","rpc"];
// Resource kinds share three columns instead of one each: a graph ten columns
// wide only fits the screen at a zoom nobody can read.
const GROUPS = [["llm","conn"], ["tool","mcp","skill"], ["pattern","background","turn","rpc"]];
const NODE_W = 188, NODE_H = 54, GAP_X = 62, GAP_Y = 14, GROUP_GAP = 34, HEAD_H = 20, BAND_PAD = 56, MIN_FIT = .72, DONE_TTL = 45000, FEED_MAX = 250;

$("title").textContent = S("title", "chatcli — live");
$("lActive").textContent = S("tile.active", "active / nodes");
$("lRate").textContent = S("rate", "events/s");
$("lCost").textContent = S("tile.cost", "session cost");
$("lReq").textContent = S("tile.requests", "requests");
$("lCtx").textContent = S("tile.ctx", "context window");
$("lErr").textContent = S("tile.errors", "errors");
$("lErrMin").textContent = S("recent_min", "last min");
$("lFeed").textContent = S("feed", "tail -f events");
$("lBrand").textContent = "· " + S("brand_sub", "live dashboard");
$("lProcs").textContent = S("processes", "processes");
$("fKeys").textContent = S("keys", "/ search · e errors · space pause · 0 fit");
$("bFit").textContent = S("fit", "Fit");
$("bReset").textContent = S("reset", "Reset layout");
$("bExport").textContent = S("export", "Export");
$("bExport").title = S("export_hint", "Download the events of the shown processes as NDJSON");
$("bErrOnly").textContent = S("errors_only", "Errors only");
$("sAlert").title = S("alerts", "Errors in the last minute; click to show only errors in the feed");
$("search").placeholder = S("search", "Search nodes… ( / )");
$("search").title = S("keys", "Keys: / search · e errors only · space pause · 0 fit · Esc clear");
$("bReset").title = S("reset_hint", "Drag a card to place it, or drag a kind header (or Shift-drag a card) to move the whole kind. Double-click hands it back to the automatic layout; this does it for everything.");
{ const e = $("empty"), ps = document.createElement("span"), cmd = document.createElement("span");
  ps.className = "ps1"; ps.textContent = "chatcli ~ % "; cmd.className = "cur"; cmd.textContent = "tail -f ~/.chatcli/pulse";
  e.append(ps, cmd, document.createTextNode("\n" + S("empty", "Waiting for a chatcli process to report…\nRun something in any chatcli session on this machine."))); }

const state = {
  instances: new Map(),   // token -> {meta, alive, cursor, shown}
  nodes: new Map(),       // key -> node
  edges: new Map(),       // "from>to" -> {from,to,fire,active}
  particles: [],
  hidden: new Set(),      // hidden kinds
  groupOff: new Map(),    // "inst|kind" -> {dx,dy,seq}: a whole kind dragged as one
  moveSeq: 0,             // orders what the user moved: the latest holds its ground
  cam: {x:30, y:30, k:1}, autoFit: true, paused: false,
  recent: [],             // timestamps for the rate
  errs: [],               // timestamps of errors, for the alert badge
  hist: new Array(60).fill(0), histSec: 0,   // events per second, last minute
  query: "",              // node search
  feedKind: "", onlyErr: false,              // feed filters
};
// Per-viewer conveniences survive a reload; nothing here is state that matters.
const PREFS = "chatcli.dash.prefs";
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREFS) || "{}");
    if (Array.isArray(p.hidden)) p.hidden.forEach(k => state.hidden.add(k));
    if (typeof p.feedKind === "string") state.feedKind = p.feedKind;
    if (p.onlyErr) state.onlyErr = true;
  } catch (_) { /* private mode or blocked storage: defaults */ }
}
function savePrefs() {
  try { localStorage.setItem(PREFS, JSON.stringify({hidden: [...state.hidden], feedKind: state.feedKind, onlyErr: state.onlyErr})); } catch (_) { /* ignore */ }
}

// ─── reducer: events -> graph ─────────────────────────────────────────────
function nodeKey(ev) {
  if (ev.kind === "session") return ev.instance + "|session";
  if (ev.kind === "agent") return ev.instance + "|a|" + ev.id;
  return ev.instance + "|h|" + ev.kind + "|" + (ev.name || ev.id);
}
function parentKey(ev) {
  if (ev.kind === "session") return null;
  if (ev.parent && ev.parent !== "session") {
    const k = ev.instance + "|a|" + ev.parent;
    if (state.nodes.has(k)) return k;
  }
  return ev.instance + "|session";
}
function ensureSession(inst) {
  const key = inst + "|session";
  if (!state.nodes.has(key)) {
    const info = state.instances.get(inst);
    state.nodes.set(key, mkNode(key, inst, "session", (info && info.meta.surface) || "chatcli", true));
  }
  return key;
}
function mkNode(key, inst, kind, name, single) {
  return { key, inst, kind, name, single, status:"", active:0, calls:0, errors:0, totalMs:0, timed:0,
           attrs:{}, recent:[], routes:[], flash:0, doneAt:0, x:null, y:null, tx:0, ty:0 };
}
function apply(ev) {
  const live = !(ev.attrs && ev.attrs.snapshot === "true");
  ensureSession(ev.instance);
  const key = nodeKey(ev);
  let n = state.nodes.get(key);
  if (!n) { n = mkNode(key, ev.instance, ev.kind, ev.name || ev.id, ev.kind === "session" || ev.kind === "agent"); state.nodes.set(key, n); }
  if (ev.name && n.single) n.name = ev.name;
  const sameAction = ev.phase === "update" && n.attrs.action === ((ev.attrs || {}).action);
  // The session card names the pair that serves the next request. A change
  // of pair (@model use, a skill hint, /switch) is worth a line of its own in
  // the feed and a place in the card's history: it is the moment every
  // request hub after it lights up under another model.
  const before = routeOf(n.attrs), after = routeOf(ev.attrs || {});
  Object.assign(n.attrs, ev.attrs || {});
  delete n.attrs.snapshot;
  const rerouted = n.kind === "session" && after && before && after !== before;
  if (rerouted) { n.routes.unshift({model: after, route: n.attrs.route || "", via: n.attrs.via || ""}); if (n.routes.length > 6) n.routes.pop(); }
  // A mark is a label the agent left on the timeline (@dash mark): a feed
  // row, never a change of the session's state.
  const mark = n.kind === "session" && ev.phase === "point" && ev.attrs && ev.attrs.note;
  if (mark) { if (live) { pushMarkRow(ev); state.recent.push(Date.now()); } return; }

  if (n.single) {
    n.status = ev.status || n.status;
    if (ev.phase === "end") { n.doneAt = Date.now(); n.active = 0; if (ev.dur_ms) n.totalMs = ev.dur_ms; }
    else { n.active = 1; n.doneAt = 0; }
    if (ev.status === "error") n.errors = 1;
  } else {
    if (ev.phase === "start") { n.active++; n.calls++; }
    else if (ev.phase === "point") { n.calls++; }
    else if (ev.phase === "end") {
      n.active = Math.max(0, n.active - 1);
      if (ev.dur_ms) { n.totalMs += ev.dur_ms; n.timed++; }
      if (ev.status === "error") n.errors++;
      n.recent.unshift({ts:ev.ts, status:ev.status, dur:ev.dur_ms||0});
      if (n.recent.length > 6) n.recent.pop();
    }
    n.status = n.active > 0 ? "running" : (ev.status || n.status);
  }
  if (live) n.flash = 1;
  if (live && ev.status === "error") state.errs.push(Date.now());

  const pk = parentKey(ev);
  if (pk) {
    const ek = pk + ">" + key;
    let e = state.edges.get(ek);
    if (!e) { e = {from:pk, to:key, fire:0}; state.edges.set(ek, e); }
    if (live) { e.fire = 1; state.particles.push({edge:ek, t:0, err: ev.status === "error"}); }
  }
  if (live) { if (rerouted) pushRouteRow(n, ev); else if (!sameAction) pushFeed(ev); state.recent.push(Date.now()); }
}
const routeOf = a => a && a.model ? (a.provider ? a.provider + ":" : "") + a.model : "";
function prune(now) {
  for (const [k, n] of state.nodes) {
    if (n.kind !== "agent" || !n.doneAt || now - n.doneAt < DONE_TTL) continue;
    let busy = false;
    for (const e of state.edges.values()) if (e.from === k) { const c = state.nodes.get(e.to); if (c && c.active > 0) { busy = true; break; } }
    if (busy) continue;
    state.nodes.delete(k);
    for (const ek of [...state.edges.keys()]) { const e = state.edges.get(ek); if (e.from === k || e.to === k) state.edges.delete(ek); }
  }
  for (const [k, n] of state.nodes) {            // hubs left with no edge lose their place too
    if (n.kind === "session" || n.kind === "agent") continue;
    let linked = false;
    for (const e of state.edges.values()) if (e.to === k) { linked = true; break; }
    if (!linked) state.nodes.delete(k);
  }
}

// ─── layout: a band per process, a column per kind, agents by depth ───────
function visible(n) {
  const inst = state.instances.get(n.inst);
  return inst && inst.shown && !state.hidden.has(n.kind);
}
// Layout, in three passes.
//  1. Flow: a band per process, a column per group, kinds stacked in a column.
//     A node placed by hand (pin) and a kind moved as a whole (groupOff) leave
//     the flow, so the column closes up behind them.
//  2. Moved kinds are stacked at their offset from the column they belong to.
//     Because it is an offset and not a position, cards that show up later
//     join the group where the user put it.
//  3. Collision: no card the layout places may land on another card. Anything
//     in the way of a fixed card (pinned or moved) is pushed down its column.
const groupKey = n => n.inst + "|" + n.kind;
const isFixed = n => !!n.pin || state.groupOff.has(groupKey(n));
function layout() {
  const depth = new Map();
  const parentOf = new Map();
  for (const e of state.edges.values()) { const c = state.nodes.get(e.to); if (c && c.kind === "agent") parentOf.set(e.to, e.from); }
  const depthOf = k => {
    if (depth.has(k)) return depth.get(k);
    const p = parentOf.get(k); const pn = p && state.nodes.get(p);

    const b = document.createElement("button");
    b.className = "chip" + (inst.alive ? " live" : "") + (inst.shown ? "" : " off") + (tok === BOOT.self ? " self" : "");
    const dot = document.createElement("span"); dot.className = "dot";
    b.append(dot, document.createTextNode((inst.meta.surface || "chatcli") + " · " + inst.meta.pid));
    b.title = tok; b.onclick = () => { inst.shown = !inst.shown; renderChips(); };
    box.appendChild(b);
  }
}
function renderLegend() {
  const box = $("legend"); box.textContent = "";
  for (const k of KINDS) {
    const b = document.createElement("button"); b.className = "chip" + (state.hidden.has(k) ? " off" : "");
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = cssVar("--k-" + k);
    b.append(dot, document.createTextNode(S("kind." + k, k)));
    b.onclick = () => { state.hidden.has(k) ? state.hidden.delete(k) : state.hidden.add(k); renderLegend(); savePrefs(); };
    box.appendChild(b);
  }
}
function showPop(n, sx, sy) {
  const pop = $("pop"); pop.textContent = "";
  const ttl = document.createElement("div"); ttl.className = "ttl";
  const lights = document.createElement("div"); lights.className = "lights"; for (let i = 0; i < 3; i++) lights.appendChild(document.createElement("i"));
  const h = document.createElement("h3"); h.textContent = n.name; h.style.color = cssVar("--k-" + n.kind) || cssVar("--strong");
  ttl.append(lights, h); pop.appendChild(ttl);
  const table = document.createElement("table");
  const add = (k, v) => { if (v === undefined || v === "" || v === null) return; const tr = document.createElement("tr"), a = document.createElement("td"), b = document.createElement("td"); a.textContent = k; b.textContent = String(v); tr.append(a, b); table.appendChild(tr); };
  add(S("p.kind", "kind"), S("kind." + n.kind, n.kind)); add(S("p.status", "status"), n.status);
  if (!n.single) { add(S("p.calls", "calls"), n.calls); add(S("active", "active"), n.active); add(S("p.errors", "errors"), n.errors); if (n.timed) add(S("p.avg", "average"), ms(n.totalMs / n.timed)); }
  else if (n.totalMs) add(S("p.took", "took"), ms(n.totalMs));
  const hit = cacheHit(n); if (hit !== null) add(S("cache", "cache"), hit + "%");
  for (const [k, v] of Object.entries(n.attrs)) add(k, v);
  n.recent.forEach((r, i) => add(i === 0 ? S("p.recent", "recent") : "", (r.status || "") + (r.dur ? " · " + ms(r.dur) : "")));
  n.routes.forEach((r, i) => add(i === 0 ? S("p.routes", "model changes") : "", [r.model, r.route, r.via].filter(Boolean).join(" · ")));
  pop.appendChild(table);
  pop.style.display = "block";
  pop.style.left = Math.min(sx + 14, view.w - pop.offsetWidth - 10) + "px"; pop.style.top = Math.min(sy + 14, view.h - pop.offsetHeight - 10) + "px";
}

// ─── interaction ──────────────────────────────────────────────────────────
let drag = null, moved = false;
const toWorld = (sx, sy) => ({x: sx / state.cam.k - state.cam.x, y: sy / state.cam.k - state.cam.y});
const pointerWorld = e => { const r = cv.getBoundingClientRect(); return {sx: e.clientX - r.left, sy: e.clientY - r.top, ...toWorld(e.clientX - r.left, e.clientY - r.top)}; };
// The last node drawn is the one on top, so it wins the hit test.
function hit(w) {
  let found = null;
  for (const n of state.nodes.values()) if (visible(n) && n.x !== null && w.x >= n.x && w.x <= n.x + NODE_W && w.y >= n.y && w.y <= n.y + NODE_H) found = n;
  return found;
}
function hitHeader(w) {
  for (const hd of world.headers) if (w.x >= hd.x && w.x <= hd.x + NODE_W && w.y >= hd.y && w.y <= hd.y + HEAD_H) return hd;
  return null;
}
// startGroupDrag begins moving a whole kind. The offset is seeded from where
// the cluster is right now, so grabbing it never makes it jump.
function startGroupDrag(key, p, e) {
  if (!state.groupOff.has(key)) {
    let first = null;
    for (const n of state.nodes.values()) if (groupKey(n) === key && !n.pin && visible(n) && (!first || n.ty < first.ty)) first = n;
    if (!first) return null;
    state.groupOff.set(key, {dx: first.tx - first.colX, dy: first.ty - first.bandTop, seq: 0});
  }
  const off = state.groupOff.get(key);   // its priority only changes once it actually moves: a bare click must not make it jump
  return {group:key, node:null, px:p.x, py:p.y, dx0:off.dx, dy0:off.dy, sx:e.clientX, sy:e.clientY};
}
// Pointer events cover mouse, touch and pen with one code path. Pressing on a
// kind header (or Shift-pressing one of its cards) drags the whole kind;
// pressing on a card drags that card; pressing on the background pans.
cv.addEventListener("pointerdown", e => {
  const p = pointerWorld(e), hd = hitHeader(p), n = hd ? null : hit(p);
  moved = false; cv.setPointerCapture(e.pointerId); cv.classList.add("drag");
  if (hd) drag = startGroupDrag(hd.key, p, e);
  else if (n && e.shiftKey && n.kind !== "session") { delete n.pin; drag = startGroupDrag(groupKey(n), p, e); }
  else if (n) drag = {node:n, ox:p.x - n.x, oy:p.y - n.y, sx:e.clientX, sy:e.clientY, seq: ++state.moveSeq};
  if (!drag) drag = {node:null, cx:state.cam.x, cy:state.cam.y, sx:e.clientX, sy:e.clientY};
});
cv.addEventListener("pointermove", e => {
  if (!drag) { const p = pointerWorld(e); cv.classList.toggle("over", !!(hitHeader(p) || hit(p))); return; }
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!moved && Math.abs(dx) + Math.abs(dy) <= 3) return;   // a press that barely moves is still a click
  moved = true; state.autoFit = false; $("pop").style.display = "none";
  if (drag.group) {
    const p = pointerWorld(e);
    const off = state.groupOff.get(drag.group);
    if (!drag.ranked) { off.seq = ++state.moveSeq; drag.ranked = true; }
    off.dx = drag.dx0 + p.x - drag.px; off.dy = drag.dy0 + p.y - drag.py;
  } else if (drag.node) {
    const p = pointerWorld(e), n = drag.node;
    n.pin = {x: p.x - drag.ox, y: p.y - drag.oy, seq: drag.seq}; n.tx = n.x = n.pin.x; n.ty = n.y = n.pin.y;
  } else {
    state.cam.x = drag.cx + dx / state.cam.k; state.cam.y = drag.cy + dy / state.cam.k;
  }
});
function endDrag(e) {
  if (!drag) return;
  const clicked = !moved ? drag.node : null, wasClick = !moved;
  drag = null; cv.classList.remove("drag");
  if (!wasClick) return;
  if (clicked) { const p = pointerWorld(e); showPop(clicked, p.sx, p.sy); } else $("pop").style.display = "none";
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", () => { drag = null; cv.classList.remove("drag"); });
// Double-click hands a placed card, or a moved kind, back to the automatic layout.
cv.addEventListener("dblclick", e => {
  const p = pointerWorld(e), hd = hitHeader(p);
  if (hd) { state.groupOff.delete(hd.key); return; }
  const n = hit(p); if (n && n.pin) { delete n.pin; $("pop").style.display = "none"; }
});
$("bReset").onclick = () => { for (const n of state.nodes.values()) delete n.pin; state.groupOff.clear(); state.autoFit = true; };
cv.addEventListener("wheel", e => {
  e.preventDefault(); state.autoFit = false;
  const r = cv.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top, before = toWorld(sx, sy);
  state.cam.k = Math.min(2.5, Math.max(.2, state.cam.k * (e.deltaY < 0 ? 1.1 : 1/1.1)));
  state.cam.x = sx / state.cam.k - before.x; state.cam.y = sy / state.cam.k - before.y;
}, {passive:false});
$("bFit").onclick = () => { state.autoFit = true; };
function paintPause() { $("bPause").textContent = state.paused ? S("resume", "Resume") : S("pause", "Pause"); }
$("bPause").onclick = () => { state.paused = !state.paused; paintPause(); };
window.addEventListener("keydown", e => {
  const typing = e.target === $("search") || e.target.tagName === "SELECT";
  if (e.key === "Escape") { $("pop").style.display = "none"; if (typing) { $("search").value = ""; state.query = ""; $("search").blur(); } return; }
  if (typing) return;
  if (e.key === "0") state.autoFit = true;
  if (e.key === " ") { e.preventDefault(); $("bPause").click(); }
  if (e.key === "/") { e.preventDefault(); $("search").focus(); $("search").select(); }
  if (e.key === "e") $("bErrOnly").click();
});
$("search").addEventListener("input", () => { state.query = $("search").value.trim().toLowerCase(); });
$("bErrOnly").onclick = () => { state.onlyErr = !state.onlyErr; applyFeedFilter(); };
$("sAlert").onclick = () => $("bErrOnly").click();
$("sAlert").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("bErrOnly").click(); } };
$("feedKind").onchange = () => { state.feedKind = $("feedKind").value; applyFeedFilter(); };
// Export: the events of every shown process, replayed from the spool with
// the same cursor API the page polls, as NDJSON — what a bug report needs.
$("bExport").onclick = async () => {
  const lines = [];
  for (const [tok, inst] of state.instances) {
    if (!inst.shown) continue;
    let cursor = 0;
    for (let guard = 0; guard < 200; guard++) {
      const out = await api("/api/events?instance=" + encodeURIComponent(tok) + "&since=" + cursor);
      out.events.forEach(ev => lines.push(JSON.stringify(ev)));
      if (!out.events.length || out.next === cursor) break;
      cursor = out.next;
    }
  }
  const blob = new Blob([lines.join("\n") + "\n"], {type: "application/x-ndjson"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "chatcli-pulse-" + new Date().toISOString().replace(/[:.]/g, "-") + ".ndjson";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
// The sparkline is the last minute of events per second.
function drawSpark() {
  const c = $("spark"), g = c.getContext("2d"), w = c.width, h = c.height, n = state.hist.length, max = Math.max(1, ...state.hist);
  g.clearRect(0, 0, w, h); g.fillStyle = cssVar("--cyan"); g.globalAlpha = .75;
  const bw = w / n;
  for (let i = 0; i < n; i++) { const v = state.hist[(state.histSec + 1 + i) % n]; if (!v) continue; const bh = Math.max(2, v / max * (h - 4)); g.fillRect(i * bw, h - bh, Math.max(1, bw - 1), bh); }
  g.globalAlpha = 1;
}
window.addEventListener("resize", resize);

// ─── polling ──────────────────────────────────────────────────────────────
async function api(path) {
  const res = await fetch(path, {headers: {"X-Pulse-Token": TOKEN}, cache: "no-store"});
  if (!res.ok) throw new Error(String(res.status));
  return res.json();
}
async function tick() {
  try {
    const list = await api("/api/instances");
    const seen = new Set();
    for (const row of list.instances) {
      seen.add(row.instance);
      let inst = state.instances.get(row.instance);
      if (!inst) { inst = {meta:row, alive:row.alive, cursor:0, shown:row.alive}; state.instances.set(row.instance, inst); }
      inst.meta = row; inst.alive = row.alive;
      const s = state.nodes.get(row.instance + "|session"); if (s && row.surface) s.name = row.surface;
    }
    for (const tok of [...state.instances.keys()]) if (!seen.has(tok)) state.instances.delete(tok);
    renderChips();
    if (!state.paused) {
      for (const [tok, inst] of state.instances) {
        if (!inst.shown) continue;
        const out = await api("/api/events?instance=" + encodeURIComponent(tok) + "&since=" + inst.cursor);
        out.events.forEach(apply); inst.cursor = out.next;
      }
    }
    const now = Date.now(); prune(now);
    const sec = Math.floor(now / 1000);
    if (sec !== state.histSec) { state.hist[sec % state.hist.length] = 0; state.histSec = sec; }
    state.hist[sec % state.hist.length] += state.recent.filter(t => now - t < 1000).length;
    state.recent = state.recent.filter(t => now - t < 5000);
    state.errs = state.errs.filter(t => now - t < 60000);
    $("sErrN").textContent = state.errs.length;
    drawSpark(); renderTiles();
    const rate = state.recent.length / 5;
    $("sRate").textContent = rate.toFixed(1);
    $("bar").style.width = Math.min(100, rate * 12) + "%";   // the deck's progress line, here a measure of activity
    $("err").textContent = "";
  } catch (err) {
    $("err").textContent = err.message === "403" ? S("forbidden", "session expired — reopen from chatcli") : S("offline", "dashboard server unreachable");
    $("beat").classList.remove("on"); $("bar").style.width = "0";
  }
  setTimeout(tick, 1000);
}
loadPrefs(); resize(); renderLegend(); renderFeedKinds(); applyFeedFilter(); paintPause(); requestAnimationFrame(draw); tick();
</script>
